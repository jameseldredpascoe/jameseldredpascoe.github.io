ic and the Isagoge, setting the initial parameters for his later epistemological frameworks."}, {"id": "Abu Mansur al-Qumri", "year": 985, "color": "#10b981", "bio": "Physician and mentor to Avicenna. Author of 'The Book of Life and Death', demonstrating early attempts to systemize empirical biological phenomena into formal treatises."}, {"id": "Abu Sahl al-Masihi", "year": 990, "color": "#10b981", "bio": "Christian physician in the Ghaznavid court. His mentorship of Avicenna exemplifies the cross-pollination of Hellenistic and Islamic scholarly traditions."}, {"id": "Avicenna", "year": 1000, "color": "#10b981", "bio": "Ibn Sina (980–1037). Codified the rules of logical implication in the Kitab al-Shifa. His epistemic framework acted as the latent foundational matrix for European scholasticism."}, {"id": "Bahmanyār ibn al-Marzubān", "year": 1040, "color": "#10b981", "bio": "Avicenna's primary conduit. Preserved, refined, and transmitted the peripatetic philosophy, ensuring the survival of the logical apparatus necessary for later mathematical formalization."}, {"id": "Omar Khayyam", "year": 1068, "color": "#10b981", "bio": "Persian polymath (1048–1131). Translated the rhetorical into the spatial. His geometric classification of cubic equations via intersecting conic sections was a profound proto-exploration of algebraic varieties."}, {"id": "Sharaf al-Dīn al-Ṭūsī", "year": 1160, "color": "#10b981", "bio": "Pushed Khayyam's geometric algebra toward calculus. His Treatise on Equations utilized early concepts of the derivative to find the maxima of cubic polynomials."}, {"id": "Saraf al-Dīn Muhammad al-Masʿūdī al-Marwazī", "year": 1180, "color": "#10b981", "bio": "A vital, often-overlooked bridge. Served as the connective tissue between the Khayyam era and the later rigorous systematization of the Maragheh school."}, {"id": "Fakhr al-Dīn al-Rāzī", "year": 1222, "color": "#10b981", "bio": "Influential theologian and philosopher. Applied rigorous, nearly mathematical argumentation to theological disputes, maintaining the cultural emphasis on logical proof."}, {"id": "Kamal al-Din ibn Yunus", "year": 1200, "color": "#10b981", "bio": "Iraqi polymath (1156–1242). A central hub of knowledge in Mosul, teaching mathematics, astronomy, and logic to a generation that would found the Maragheh Observatory."}, {"id": "Qutb al-Dīn al-Mīṣrī", "year": 1222, "color": "#10b981", "bio": "Physician and logician who studied under al-Rāzī, carrying the structuralist approach of philosophy into empirical medicine."}, {"id": "Athīr al-Dīn al-Mufaḍḍal al-Abharī", "year": 1240, "color": "#10b981", "bio": "Author of the definitive 'Isagoge' in logic used for centuries. His mentorship directly shaped the mind of al-Tusi."}, {"id": "Nasir al-Din al-Tusi", "year": 1250, "color": "#10b981", "bio": "The absolute documented root. Decoupled trigonometry from astronomy, establishing it as an independent discipline. Formulated the 'Tusi-couple'."}, {"id": "Shams ad-Din Al-Bukhari", "year": 1280, "color": "#10b981", "bio": "Student at the Maragheh Observatory. Acted as the crucial geographic transmission vector, carrying al-Tusi's intellectual lineage toward the Byzantine West."}, {"id": "Gregory Chioniadis", "year": 1300, "color": "#8b5cf6", "bio": "Byzantine Greek astronomer. Traveled to Tabriz to absorb the Maragheh mathematical frameworks, initiating the flow of Arabic/Persian mathematics into the Greek intellectual sphere."}, {"id": "Manuel Bryennios", "year": 1310, "color": "#8b5cf6", "bio": "Author of the 'Harmonics'. He systematized the mathematical theory of music, mapping numerical ratios to acoustic phenomena."}, {"id": "Theodore Metochites", "year": 1320, "color": "#8b5cf6", "bio": "Statesman, scholar, and driving force behind the Palaiologan Renaissance. Cultivated the revival of ancient Greek mathematical texts."}, {"id": "Gregory Palamas", "year": 1340, "color": "#8b5cf6", "bio": "Theologian who engaged deeply with the limits of Aristotelian logic, defining the boundaries of rational inquiry."}, {"id": "Nilos Kabasilas", "year": 1350, "color": "#8b5cf6", "bio": "Byzantine intellectual and teacher who synthesized the incoming Eastern mathematical methods with orthodox philosophical traditions."}, {"id": "Demetrios Kydones", "year": 1370, "color": "#8b5cf6", "bio": "Translator who brought Latin scholasticism to Byzantium, creating a localized intellectual network capable of parsing complex proofs."}, {"id": "Georgios Plethon Gemistos", "year": 1410, "color": "#8b5cf6", "bio": "Late Byzantine neoplatonist. Reintroduced Plato to the West, emphasizing the geometric and mathematical underpinnings of reality."}, {"id": "Basilios Bessarion", "year": 1440, "color": "#ec4899", "bio": "The critical Renaissance seed. Fled the fall of Constantinople, bringing a massive library of ancient Greek mathematical manuscripts to Italy."}, {"id": "Johannes Argyropoulos", "year": 1444, "color": "#ec4899", "bio": "Lectured in Florence to figures like Da Vinci. Translated Aristotle's physical treatises, providing the foundational physics for the early modern era."}, {"id": "Johannes Kapnion Reuchlin", "year": 1481, "color": "#ec4899", "bio": "Humanist scholar who integrated Hebrew Kabbalistic numerical mysticism with emerging European mathematics, expanding the philosophical scope of numbers."}, {"id": "Philipp Melanchthon", "year": 1514, "color": "#ec4899", "bio": "The 'Teacher of Germany'. Revolutionized the university curriculum to mandate mathematics and astronomy as core requirements for logical development."}, {"id": "Johannes Caselius", "year": 1566, "color": "#ec4899", "bio": "Humanist and jurist who maintained the rigorous analytical frameworks established by Melanchthon during a period of intense theological upheaval."}, {"id": "Georg Calixt", "year": 1607, "color": "#ec4899", "bio": "Theologian who championed the 'consensus of antiquity', applying strict historical and logical proofs to resolve dogmatic disputes."}, {"id": "Johannes Müller Regiomontanus", "year": 1460, "color": "#ec4899", "bio": "Author of 'De Triangulis Omnimodis'. He established trigonometry in Europe as a self-contained science independent of astronomy."}, {"id": "Domenico Maria Novara da Ferrara", "year": 1490, "color": "#ec4899", "bio": "Professor at Bologna who fiercely critiqued the Ptolemaic system's mathematical inconsistencies, heavily influencing his student, Copernicus."}, {"id": "Nicolaus Copernicus", "year": 1520, "color": "#ec4899", "bio": "Formulated the heliocentric model. His work fundamentally restructured the mathematical and spatial representation of the universe."}, {"id": "Georg Joachim von Leuchen Rheticus", "year": 1540, "color": "#ec4899", "bio": "Sole student of Copernicus. He published the first highly accurate, large-scale trigonometric tables, providing the computational power for the scientific revolution."}, {"id": "Michel Chasles", "year": 1814, "color": "#eab308", "bio": "French mathematician. Advised by Poisson, laying the absolute groundwork for modern projective geometry."}, {"id": "H. A. (Hubert Anson) Newton", "year": 1850, "color": "#06b6d4", "bio": "American astronomer and mathematician. Acted as the primary geographic transmission vector, bringing French geometric traditions to Yale."}, {"id": "E. H. (Eliakim Hastings) Moore", "year": 1885, "color": "#06b6d4", "bio": "Architect of the Chicago School. Pioneered abstract algebra and topology in America, establishing a rigorous structuralist approach."}, {"id": "Oswald Veblen", "year": 1903, "color": "#06b6d4", "bio": "Crucial figure in American mathematics. His work on the axioms of geometry provided the strict logical rigor for subsequent topological proofs."}, {"id": "Alonzo Church", "year": 1927, "color": "#06b6d4", "bio": "Foundational logician. Created the lambda calculus, fundamentally bridging pure mathematical logic with the theory of computation."}, {"id": "Dana Stewart Scott", "year": 1958, "color": "#06b6d4", "bio": "Turing Award winner. Defined domain theory, creating the necessary topological spaces to represent computational semantics."}, {"id": "Angus John Macintyre", "year": 1968, "color": "#14b8a6", "bio": "Logician specializing in model theory. Applied deep logical frameworks directly to algebraic geometry."}, {"id": "Peter Mann Winkler", "year": 1975, "color": "#14b8a6", "bio": "Specialist in combinatorics, probability, and the theory of computing, expanding the reach of discrete structural analysis."}, {"id": "Zachary Hamaker", "year": 2014, "color": "#6366f1", "bio": "Expert in bijective combinatorics and reduced decompositions. Provides the combinatorial scaffolding for complex network geometries."}, {"id": "Moritz Valentin Steinmetz", "year": 1560, "color": "#ec4899", "bio": "German mathematician and astronomer. Ensured the transmission of Copernican and trigonometric methods into the central European university system."}, {"id": "Christoph Meurer", "year": 1580, "color": "#ec4899", "bio": "Professor of mathematics in Leipzig. His work established a local tradition of rigorous celestial mechanics."}, {"id": "Philipp Müller", "year": 1610, "color": "#ec4899", "bio": "Physicist and mathematician at Leipzig. Mentored the generation that would transition from classical geometry to early mathematical logic."}, {"id": "Friedrich Leibniz", "year": 1622, "color": "#f97316", "bio": "Professor of moral philosophy at Leipzig and father of Gottfried. Instilled a deep appreciation for classical logic and jurisprudence."}, {"id": "Jakob Thomasius", "year": 1643, "color": "#f97316", "bio": "Towering figure in German philosophy. Treated the history of philosophy as a continuous, analyzable progression of axiomatic shifts."}, {"id": "Christoph Notnagel", "year": 1640, "color": "#f97316", "bio": "Professor of mathematics at Wittenberg. Focused on optics and astronomy, maintaining the physical application of abstract math."}, {"id": "Johann Andreas Quenstedt", "year": 1644, "color": "#f97316", "bio": "Orthodox Lutheran theologian whose massive, hyper-logical dogmatic frameworks mirrored the structured proofs of contemporary mathematics."}, {"id": "Michael Walther, Jr.", "year": 1661, "color": "#f97316", "bio": "Mathematician and theologian. Emphasized the necessity of mathematical certainty in an era of subjective philosophical debate."}, {"id": "Erhard Weigel", "year": 1650, "color": "#ef4444", "bio": "Championed the 'mathematical method' in philosophy. He argued that all knowledge, even ethics, could be derived via geometric proofs."}, {"id": "Otto Mencke", "year": 1665, "color": "#f97316", "bio": "Founded the 'Acta Eruditorum', the first scientific journal in German lands, creating a decentralized network for mathematical dissemination."}, {"id": "Gottfried Wilhelm Leibniz", "year": 1666, "color": "#3b82f6", "bio": "Co-inventor of the calculus. Conceived the 'characteristica universalis'—a vision of computational syntax and binary logic that anticipated formal verification by three centuries."}, {"id": "Nicolas Malebranche", "year": 1675, "color": "#3b82f6", "bio": "Synthesized Cartesian philosophy with rigorous rationalism. Investigated the laws of motion and optics through an algebraic lens."}, {"id": "Johann Pasch", "year": 1683, "color": "#f97316", "bio": "Logician who refined the rules of syllogistic reasoning, preparing the ground for the algebraicization of logic."}, {"id": "Johann Andreas Planer", "year": 1709, "color": "#f97316", "bio": "Mathematician and philosopher at Tübingen. Worked on the formalization of mathematical axioms."}, {"id": "Johann Christoph Wichmannshausen", "year": 1685, "color": "#f97316", "bio": "Orientalist and philosopher whose work on linguistics subtly influenced the understanding of formal syntactic structures."}, {"id": "Jacob Bernoulli", "year": 1684, "color": "#3b82f6", "bio": "Pioneer in calculus and founder of modern probability theory (Ars Conjectandi). Introduced the law of large numbers and the concept of expected value."}, {"id": "Paul of Venice", "year": 1400, "color": "#3b82f6", "bio": "Teacher of Gaetano da Thiene and root of Bernoulli medical lineage. Taught the terminist logic of the Oxford Calculators in Italy."}, {"id": "Gaetano da Thiene", "year": 1420, "color": "#3b82f6", "bio": "Paduan master who combined Aristotelian logic with clinical observation, treating the body as a mechanical and logical system."}, {"id": "Pietro Roccabonella", "year": 1440, "color": "#3b82f6", "bio": "Professor of medicine who insisted on rigorous, documented, case-by-case analysis, an early precursor to empirical data collection."}, {"id": "Niccolò Leoniceno", "year": 1453, "color": "#3b82f6", "bio": "Corrected the botanical errors in Pliny's natural history, insisting that scientific authority must yield to empirical structural proof."}, {"id": "G. B. della Monte", "year": 1520, "color": "#3b82f6", "bio": "Pioneer of clinical medicine. Shifted instruction from the lecture hall to the patient's bedside, an early form of 'applied' physical science."}, {"id": "Bassiano Landi", "year": 1542, "color": "#3b82f6", "bio": "Anatomist who applied strict geometric and structural understanding to the musculature and mechanics of the human body."}, {"id": "Theodor Zwinger (Elder)", "year": 1559, "color": "#3b82f6", "bio": "Polymath who authored the 'Theatrum Vitae Humanae', an attempt to logically categorize all human knowledge."}, {"id": "Petrus Ryff", "year": 1584, "color": "#3b82f6", "bio": "Mathematician and physician. Treated public health and epidemiology as problems of statistical and structural magnitude."}, {"id": "Emmanuel Stupanus", "year": 1613, "color": "#3b82f6", "bio": "Professor of medicine at Basel. He fostered an environment where medical physics and pure mathematics heavily overlapped."}, {"id": "Johann Caspar Bauhin", "year": 1649, "color": "#3b82f6", "bio": "Botanist who created massive, highly structured taxonomies, a biological analog to the classification of geometric spaces."}, {"id": "Nikolaus Eglinger", "year": 1661, "color": "#3b82f6", "bio": "Physicist and physician. Acted as the crucial node that transferred the highly structured Paduan/Basel medical tradition into pure mathematical physics."}, {"id": "Johann Bernoulli", "year": 1694, "color": "#3b82f6", "bio": "The 'Archimedes of his age'. Expanded calculus to solve the brachistochrone problem, initiating the calculus of variations and the study of functional spaces."}, {"id": "Christian August Hausen", "year": 1713, "color": "#f97316", "bio": "Researched electricity and mechanics. Demonstrated the mathematical relationship between physical forces and geometric projection."}, {"id": "Leonhard Euler", "year": 1726, "color": "#3b82f6", "bio": "The master of formal manipulation. Unified the continuous and the discrete, mapping complex variables and establishing the analytic grammar that governs modern operator theory."}, {"id": "Abraham Gotthelf Kästner", "year": 1739, "color": "#f97316", "bio": "Author of influential mathematical textbooks. Re-evaluated Euclidean axioms, planting the earliest psychological seeds for non-Euclidean geometry."}, {"id": "Karl Christian von Langsdorf", "year": 1781, "color": "#f97316", "bio": "Industrial engineer and mathematician. Applied deep calculus to hydraulics, translating continuous mathematical models into physical systems."}, {"id": "Joseph-Louis Lagrange", "year": 1760, "color": "#eab308", "bio": "Redefined mechanics analytically. Stripped classical mechanics of its geometric diagrams, reducing the physical world to pure algebraic operators and differential equations."}, {"id": "Pierre-Simon Laplace", "year": 1795, "color": "#eab308", "bio": "Formulated the deterministic universe. His 'Mécanique Céleste' and work on the Laplace transform created the foundational operators for predicting system state evolution."}, {"id": "Johann Friedrich Pfaff", "year": 1786, "color": "#f97316", "bio": "Pioneered the theory of partial differential equations. His work on 'Pfaffian forms' anticipated modern exterior calculus and symplectic geometry."}, {"id": "Carl Friedrich Gauss", "year": 1799, "color": "#f97316", "bio": "The Princeps Mathematicorum. Uncovered the intrinsic geometry of surfaces, demonstrating that mathematical spaces possess inherent, unalterable structural truths independent of their embedding."}, {"id": "Siméon Denis Poisson", "year": 1800, "color": "#eab308", "bio": "Developed the Poisson bracket and Poisson distribution. His work formalized the calculus of probabilities and defined the algebraic structure of Hamiltonian mechanics."}, {"id": "Joseph Fourier", "year": 1808, "color": "#eab308", "bio": "Showed that complex periodic functions could be represented as infinite series of sines and cosines. His transform is the ultimate basis of frequency domain analysis."}, {"id": "Martin Ohm", "year": 1811, "color": "#ef4444", "bio": "Brother of Georg Ohm. Attempted to build a fully rigorous, logically deduced structure for all of mathematics, focusing on complex numbers."}, {"id": "Christian Ludwig Gerling", "year": 1812, "color": "#f97316", "bio": "Astronomer and physicist. Applied Gaussian least-squares optimization to massive geodesic surveys, blending pure math with planetary-scale data."}, {"id": "Julius Plücker", "year": 1823, "color": "#f97316", "bio": "Pioneered analytic geometry and line geometry. Showed that lines (rather than points) could be treated as the fundamental elements of space."}, {"id": "Gustav Peter Lejeune Dirichlet", "year": 1827, "color": "#ef4444", "bio": "Formalized the modern definition of a function. His Dirichlet principle established harmonic analysis as a primary tool for probing the boundary conditions of analytic spaces."}, {"id": "Rudolf Lipschitz", "year": 1853, "color": "#ef4444", "bio": "Established the Lipschitz continuity condition. His work on quadratic differential forms directly anticipated Riemannian geometry and general relativity."}, {"id": "Felix Klein", "year": 1868, "color": "#ef4444", "bio": "Author of the Erlangen Program. Redefined geometry entirely as the study of properties invariant under a given group of transformations—a profound structural insight linking symmetry to spatial truth."}, {"id": "Oskar Bolza", "year": 1886, "color": "#06b6d4", "bio": "Transplanted German rigor to the American Midwest. Expanded the calculus of variations to problems with inequality constraints."}, {"id": "Gilbert Ames Bliss", "year": 1900, "color": "#06b6d4", "bio": "Architect of the Chicago School. Elevated the calculus of variations from a study of isolated curves to a topological investigation of entire functional spaces."}, {"id": "Edward J. McShane", "year": 1930, "color": "#06b6d4", "bio": "Expanded the calculus of variations into integration theory and stochastic models. Formulated the McShane integral, unifying the continuous and the discrete in probability."}, {"id": "Billy James Pettis", "year": 1937, "color": "#14b8a6", "bio": "Pioneer of abstract functional analysis. The Pettis integral mapped weak topologies onto vector spaces, treating operators themselves as geometric entities."}, {"id": "Heron S. Collins", "year": 1953, "color": "#14b8a6", "bio": "Dedicated to topological vector spaces and strict topologies. Analyzed the structural dualities of function spaces, laying groundwork for operator algebras."}, {"id": "John B. Conway", "year": 1965, "color": "#14b8a6", "bio": "A transformative force in functional analysis. His definitive texts mapped the complex, multi-dimensional topography of operator algebras and topological vector spaces for a generation."}, {"id": "Jim Agler", "year": 1980, "color": "#3b82f6", "bio": "A preeminent pioneer at the intersection of operator theory and analytic function spaces. His deep algebraic insights seeded the ground for modern free analysis and dilation theory."}, {"id": "Ryan Tully-Doyle", "year": 2015, "color": "#6366f1", "bio": "Specializes in operator theory and free analysis. Maps the properties of Herglotz-Nevanlinna functions across multiple variables. (PhD UCSD, 2015)."}, {"id": "James Eldred Pascoe", "year": 2015, "color": "#6366f1", "bio": "Architect of modern noncommutative function theory. Formulated the invisible index theorem. His work acts as a critical structural bridge, encoding pure operator algebras into solvable macroscopic models. (PhD UCSD, 2015)."}, {"id": "Tapesh Yadav", "year": 2023, "color": "#8b5cf6", "bio": "Expert in Structured Random Matrices. Expands the domain of probability theory into the noncommutative sphere, dealing with the asymptotic spectra of complex systems."}, {"id": "Austin Jacobs", "year": 2024, "color": "#8b5cf6", "bio": "Applies pure matrix theory to international macroeconomics. Co-authored 'The geometry of inconvenience', using graph theory and matrices to untangle perverse equilibria in global trade networks."}, {"id": "Julian Bushelli", "year": 2024, "color": "#8b5cf6", "bio": "Extended the boundaries of the field by defining the 'Free Functional Calculus in General'. Utilizes categorical free maps to navigate non-square matrices and the Schur complement."}, {"id": "Michael Coopman", "year": 2024, "color": "#8b5cf6", "bio": "Applies rigorous functional analysis and optimization theory to the assessment of perverse equilibria and complex constraints in real-world network topologies."}, {"id": "Johann Elert Bode", "year": 1770, "color": "#f97316", "bio": "German astronomer who popularized Bode's Law. Advised Johann Pfaff, linking early celestial mechanics to foundational geometry."}, {"id": "Johann Georg Büsch", "year": 1752, "color": "#f97316", "bio": "Magister at Göttingen. Prominent educator who transmitted Segner's mathematical physics to the next generation."}, {"id": "Siegmund Jakob Baumgarten", "year": 1730, "color": "#f97316", "bio": "Theologian who championed rationalism, integrating the Wolffian mathematical method into theology."}, {"id": "Johann Andreas Segner", "year": 1725, "color": "#f97316", "bio": "Physicist and mathematician. Bridged medicine and mathematics; formulated concepts in fluid dynamics and rigid body rotations."}, {"id": "Georg Erhard Hamberger", "year": 1715, "color": "#f97316", "bio": "Professor of medicine and botany. Applied mechanical and physical principles to human physiology."}, {"id": "Anton Bernhard Lauterbach", "year": 1716, "color": "#f97316", "bio": "Mathematician at Jena. Taught the continuous proportions that bridged earlier geometric methods with emerging analysis."}, {"id": "Simon Paul Hilscher", "year": 1704, "color": "#3b82f6", "bio": "Physician who continued the medical-mathematical tradition from Krause, advising Segner in his medical doctorate."}, {"id": "Rudolf Wilhelm Krause", "year": 1667, "color": "#3b82f6", "bio": "Physician and academic. Studied under Franciscus Sylvius and Blasius, carrying the Leiden tradition into Germany."}, {"id": "Gerardus Leonardus Blasius", "year": 1640, "color": "#3b82f6", "bio": "Dutch anatomist. Early pioneer in comparative anatomy, anchoring Krause's empirical foundations."}, {"id": "Franciscus de le Boë Sylvius", "year": 1634, "color": "#3b82f6", "bio": "Pioneered the iatrochemical school of medicine. Synthesized biological processes as chemical and structural systems."}, {"id": "Adolph Vorstius", "year": 1610, "color": "#3b82f6", "bio": "Botanist and professor at Leiden. Mentored Franciscus Sylvius, grounding medicine in rigorous botanical taxonomy."}, {"id": "Felix Plater", "year": 1557, "color": "#3b82f6", "bio": "Swiss physician. Revolutionized understanding of the eye as an optical and geometric instrument."}, {"id": "Guillaume Rondelet", "year": 1529, "color": "#3b82f6", "bio": "French anatomist and naturalist. Insisted on empirical observation and structural morphology in marine biology."}, {"id": "Johannes Winter von Andernach", "year": 1527, "color": "#3b82f6", "bio": "Humanist and translator of Galen. Fostered a highly analytical approach to anatom function sourcesHTML(n){return n.sources.length?n.sources.map(s=>`<div class="source"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a><small>${esc(new URL(s.url).hostname)}</small></div>`).join(''):'<p class="muted">A securely matched reference remains to be established. This record preserves the source-file identity and marks the gap.</p>';}
function edgeHTML(e,other){const n=byId.get(other);return `<button class="relationship" data-person="${n.id}">${esc(n.name)}<small>${esc(e.type)}${e.verified?' · checked record':''}</small></button><div class="muted" style="font-size:10px;margin:0 5px 13px">${esc(e.note)}</div>`;}
function showProfile(id,open=true){current=id;const n=byId.get(id);$('profile-content').innerHTML=`<span class="badge ${n.status==='Needs research'?'review':''}">${esc(n.status)}</span><h2>${esc(n.name)}</h2><div class="muted" style="font-size:11px">${esc(n.sourceType)} · Record ${n.id+1} · Reviewed November 2026</div><div class="notice" style="margin-top:18px"><strong>${n.timeline.estimated?'c. ':''}${n.timeline.year}</strong> · ${esc(n.timeline.kind)}<br>${esc(n.timeline.basis)}</div><p class="bio">${esc(n.bio)}</p>${n.aliases.some(a=>a!==n.name)?`<div class="aliases">Original labels / aliases: ${n.aliases.map(esc).join(' · ')}</div>`:''}<h3>Research references</h3>${sourcesHTML(n)}<h3>Teachers & earlier connections</h3>${D.edges.filter(e=>e.target===id).map(e=>edgeHTML(e,e.source)).join('')||'<p class="muted">No earlier connection is included in the supplied graph. This does not establish that the person had no teachers.</p>'}<h3>Students & later connections</h3>${D.edges.filter(e=>e.source===id).map(e=>edgeHTML(e,e.target)).join('')||'<p class="muted">No later connection is included in the supplied graph. This is not an exhaustive student list.</p>'}<div class="notice">Biographical facts and relationship evidence are separate. A source about a person does not automatically verify every edge.</div>`;if(open){autoFrame=false;$('profile').classList.add('open');$('people-nav').classList.remove('open');$('browse').setAttribute('aria-expanded','false');}$('profile').scrollTop=0;filterPeople();if(mode==='tree'){const old={...transform};drawGraph();if(open&&scope==='all'){const pos=positions.get(id),r=$('graph').getBoundingClientRect(),available=r.width>760?r.width-410:r.width;transform={k:1,x:available/2-pos.x,y:r.height*.44-pos.y};applyTransform();highlightFamily();}}}
function walk(id,direction,maxDepth=Infinity){const found=new Set([id]),q=[[id,0]];for(let j=0;j<q.length;j++){const [a,d]=q[j];if(d>=maxDepth)continue;for(const b of byId.get(a)[direction])if(!found.has(b)){found.add(b);q.push([b,d+1]);}}return found;}
function visible(){if(scope==='all')return new Set(byId.keys());if(scope==='ancestors')return walk(current,'incoming');if(scope==='descendants')return walk(current,'outgoing');return new Set([...walk(current,'incoming',2),...walk(current,'outgoing',1)]);}
function svgEl(tag,attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,v);return el;}
function clearHighlight(){document.querySelectorAll('.graph-node,.edge').forEach(el=>{el.classList.remove('faded');el.classList.remove('lineage');});}
function highlightFamily(){const family=new Set([...walk(current,'incoming'),...walk(current,'outgoing')]);document.querySelectorAll('[data-node]').forEach(el=>el.classList.toggle('faded',!family.has(+el.getAttribute('data-node'))));document.querySelectorAll('[data-source]').forEach(el=>{const on=family.has(+el.getAttribute('data-source'))&&family.has(+el.getAttribute('data-target'));el.classList.toggle('lineage',on);el.classList.toggle('faded',!on);});}
function drawGraph(){if(physicsFrame)cancelAnimationFrame(physicsFrame);physicsFrame=0;const previous=positions;const keep=visible();drawn=D.nodes.filter(n=>keep.has(n.id));const rows=new Map();for(const n of drawn){const band=Math.floor(n.timeline.year/10);if(!rows.has(band))rows.set(band,[]);rows.get(band).push(n);}const ranks=[...rows.keys()].sort((a,b)=>a-b);const max=Math.max(...[...rows.values()].map(a=>a.length));positions=new Map();bounds={w:max*190+100,h:ranks.length*200+100};ranks.forEach((rank,row)=>{let arr=rows.get(rank);arr.sort((a,b)=>{const avg=n=>n.incoming.filter(i=>positions.has(i)).map(i=>positions.get(i).x).reduce((a,b)=>a+b,0)/(n.incoming.filter(i=>positions.has(i)).length||1);return avg(a)-avg(b)||a.name.localeCompare(b.name);});arr.forEach((n,col)=>positions.set(n.id,{x:previous.get(n.id)?.x??((bounds.w-arr.length*190)/2+col*190+35),y:yearToY(n.timeline.year),vx:0,vy:0,targetY:yearToY(n.timeline.year),id:n.id}));});physicsNodes=[...positions.values()];physicsEdges=D.edges.filter(e=>keep.has(e.source)&&keep.has(e.target)).map(e=>({a:positions.get(e.source),b:positions.get(e.target)}));nodeElements=[];edgeElements=[];const scene=$('scene');scene.replaceChildren();for(const e of D.edges){if(!keep.has(e.source)||!keep.has(e.target))continue;let a=positions.get(e.source),b=positions.get(e.target);const p=svgEl('path',{d:`M ${a.x} ${a.y} C ${a.x} ${a.y+75},${b.x} ${b.y-75},${b.x} ${b.y}`,class:'edge'+(e.verified?' checked':''),'data-source':e.source,'data-target':e.target});const title=svgEl('title',{});title.textContent=`${byId.get(e.source).name} → ${byId.get(e.target).name}: ${e.type}. ${e.note}`;p.append(title);scene.append(p);edgeElements.push({el:p,a,b});}for(const n of drawn){const p=positions.get(n.id),g=svgEl('g',{transform:`translate(${p.x},${p.y})`,class:'graph-node'+(n.id===current?' selected':''),role:'button',tabindex:0,'aria-label':n.name,'data-node':n.id});g.append(svgEl('circle',{cx:0,cy:0,r:n.id===current?8:6,fill:n.color,'stroke-dasharray':n.timeline.kind==='Inferred placement'?'2 2':''}));const t=svgEl('text',{x:12,y:4});t.textContent=n.name.length>30?n.name.slice(0,28)+'…':n.name;g.append(t);const title=svgEl('title',{});title.textContent=n.name+' · '+(n.timeline.estimated?'c. ':'')+n.timeline.year+' · '+n.timeline.kind;g.append(title);g.addEventListener('click',()=>{if(Date.now()>suppressNodeClickUntil)showProfile(n.id);});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showProfile(n.id);}});scene.append(g);nodeElements.push({el:g,p});}physicsAlpha=.8;fit();wakePhysics();$('caption').textContent=`${drawn.length} people shown · Calendar years · c. = approximate; dotted node = inferred date · Solid: checked degree link; dashed: other / unverified · Drag a person sideways to stretch the tree · Drag empty space to pan · Scroll to zoom`;}
function applyTransform(){$('scene').setAttribute('transform',`translate(${transform.x} ${transform.y}) scale(${transform.k})`);drawYearAxis();}
function drawYearAxis(){const axis=$('year-axis');axis.replaceChildren();const r=$('graph').getBoundingClientRect(),pixelsPerYear=12*transform.k;let step=[1,2,5,10,20,25,50,100,200,500].find(v=>v*pixelsPerYear>=55)||500;const lo=900+((-transform.y)/transform.k-80)/12,hi=900+((r.height-transform.y)/transform.k-80)/12;axis.append(svgEl('rect',{x:0,y:0,width:74,height:r.height,fill:'#050505','fill-opacity':.88}));for(let year=Math.ceil(lo/step)*step;year<=hi;year+=step){if(year<0||year>2300)continue;const y=transform.y+yearToY(year)*transform.k;axis.append(svgEl('line',{x1:65,x2:r.width,y1:y,y2:y,stroke:'#d4af37','stroke-opacity':.09,'stroke-width':1}));axis.append(svgEl('line',{x1:58,x2:70,y1:y,y2:y,stroke:'#8b763a','stroke-width':1}));const label=svgEl('text',{x:51,y:y+4,'text-anchor':'end',fill:'#c3a951','font-family':'monospace','font-size':11});label.textContent=year;axis.append(label);} }

function fit(){const r=$('graph').getBoundingClientRect();if(positions.size){const pts=[...positions.values()];bounds={x:Math.min(...pts.map(p=>p.x))-40,y:Math.min(...pts.map(p=>p.y))-40,w:Math.max(...pts.map(p=>p.x))-Math.min(...pts.map(p=>p.x))+260,h:Math.max(...pts.map(p=>p.y))-Math.min(...pts.map(p=>p.y))+100};}transform.k=Math.min(1.25,Math.max(.018,Math.min((r.width-35)/bounds.w,(r.height-35)/bounds.h)));transform.x=(r.width-bounds.w*transform.k)/2-(bounds.x||0)*transform.k;transform.y=(r.height-bounds.h*transform.k)/2-(bounds.y||0)*transform.k;applyTransform();}
function zoomBy(f,x,y){autoFrame=false;const r=$('graph').getBoundingClientRect();x??=r.width/2;y??=r.height/2;const k=Math.max(.012,Math.min(4,transform.k*f)),ratio=k/transform.k;transform.x=x-(x-transform.x)*ratio;transform.y=y-(y-transform.y)*ratio;transform.k=k;applyTransform();}
function stepPhysics(){
 const nodes=physicsNodes,alpha=physicsAlpha;
 if(!nodes.length)return;
 let cx=0;for(const p of nodes)cx+=p.x;cx/=nodes.length;
 for(const p of nodes){p.vx+=(cx-p.x)*.0015*alpha;p.vy+=(p.targetY-p.y)*.055*alpha;}
 for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
  const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y;
  if(Math.abs(dx)>1200||Math.abs(dy)>1000)continue;
  let d2=dx*dx+dy*dy;if(d2<1){dx=(i%2?1:-1);dy=.3;d2=1;}
  const d=Math.sqrt(d2),force=Math.min(8,5000/d2)*alpha;
  a.vx-=dx/d*force;b.vx+=dx/d*force;a.vy-=dy/d*force;b.vy+=dy/d*force;
  if(Math.abs(dy)<24&&Math.abs(dx)<160){const f=(160-Math.abs(dx))*.035*alpha*(dx>=0?1:-1);a.vx-=f;b.vx+=f;}
 }
 for(const {a,b} of physicsEdges){
  const dx=b.x-a.x,dy=b.y-a.y,dist=Math.max(1,Math.hypot(dx,dy));
  const rest=Math.max(120,Math.abs(b.targetY-a.targetY)*.9),force=(dist-rest)*.012*alpha;
  const fx=dx/dist*force,fy=dy/dist*force;
  a.vx+=fx;b.vx-=fx;a.vy+=fy;b.vy-=fy;
 }
 for(const p of nodes){if(nodeDrag&&nodeDrag.id===p.id&&nodeDrag.moved){p.x=nodeDrag.wx;p.y=p.targetY;p.vx=p.vy=0;}else{p.vx=Math.max(-40,Math.min(40,p.vx*.76));p.vy=Math.max(-40,Math.min(40,p.vy*.76));p.x+=p.vx;p.y=p.targetY;p.vy=0;}}
 physicsAlpha=Math.max(nodeDrag?.moved ? .35 : 0,physicsAlpha*.986);
}
function paintPhysics(){for(const {el,p} of nodeElements)el.setAttribute('transform',`translate(${p.x},${p.y})`);for(const {el,a,b} of edgeElements){const mid=(a.y+b.y)/2;el.setAttribute('d',`M ${a.x} ${a.y} C ${a.x} ${mid},${b.x} ${mid},${b.x} ${b.y}`);}}
function animatePhysics(){physicsFrame=0;if(mode!=='tree')return;stepPhysics();paintPhysics();if(autoFrame)fit();if(physicsAlpha>.003||nodeDrag?.moved)physicsFrame=requestAnimationFrame(animatePhysics);}
function wakePhysics(){physicsAlpha=Math.max(physicsAlpha,.4);if(!physicsFrame&&mode==='tree')physicsFrame=requestAnimationFrame(animatePhysics);}
function worldPoint(e){const r=$('graph').getBoundingClientRect();return{x:(e.clientX-r.left-transform.x)/transform.k,y:(e.clientY-r.top-transform.y)/transform.k};}
$('graph').addEventListener('wheel',e=>{e.preventDefault();autoFrame=false;const r=$('graph').getBoundingClientRect();zoomBy(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null;
$('graph').addEventListener('pointerdown',e=>{
 if(e.button!==undefined&&e.button!==0)return;autoFrame=false;
 const hit=e.target.closest('[data-node]');
 if(hit){const id=+hit.getAttribute('data-node'),p=positions.get(id),w=worldPoint(e);nodeDrag={id,startX:e.clientX,startY:e.clientY,offsetX:p.x-w.x,offsetY:p.y-w.y,wx:p.x,wy:p.y,moved:false};e.preventDefault();}
 else drag={x:e.clientX,y:e.clientY,tx:transform.x,ty:transform.y};
 $('graph').setPointerCapture(e.pointerId);
});
$('graph').addEventListener('pointermove',e=>{
 if(nodeDrag){if(Math.hypot(e.clientX-nodeDrag.startX,e.clientY-nodeDrag.startY)>4)nodeDrag.moved=true;
  if(nodeDrag.moved){const w=worldPoint(e);nodeDrag.wx=w.x+nodeDrag.offsetX;const p=positions.get(nodeDrag.id);nodeDrag.wy=p.targetY;p.x=nodeDrag.wx;p.y=p.targetY;paintPhysics();wakePhysics();}}
 else if(drag){transform.x=drag.tx+e.clientX-drag.x;transform.y=drag.ty+e.clientY-drag.y;applyTransform();}
});
function endPointer(e,cancel=false){const ended=nodeDrag;nodeDrag=null;drag=null;if(ended){suppressNodeClickUntil=Date.now()+350;if(ended.moved)wakePhysics();else if(!cancel)showProfile(ended.id);}if($('graph').hasPointerCapture?.(e.pointerId))$('graph').releasePointerCapture(e.pointerId);}
$('graph').addEventListener('pointerup',e=>endPointer(e));$('graph').addEventListener('pointercancel',e=>endPointer(e,true));

function drawDirectory(){$('directory').innerHTML=`<div class="eyebrow">Biographical directory · ${matches.length} records</div><h2>People behind the connections</h2><p class="muted">Search by name, subject, or institution. Every original label remains traceable. A diamond marks a record needing further research.</p><div class="directory-grid">${matches.map(n=>`<article class="card"><span class="badge ${n.status==='Needs research'?'review':''}">${esc(n.status)}</span><h2>${esc(n.name)}</h2><p>${esc(n.bio)}</p><button data-person="${n.id}">Sources & connections →</button></article>`).join('')||'<div class="empty">No matching people.</div>'}</div>`;$('caption').textContent='All entries are original biographical or identity-research notes. Sources and relationship details open in the record panel.';}
function setMode(m){mode=m;$('tree-tab').classList.toggle('active',m==='tree');$('directory-tab').classList.toggle('active',m==='directory');$('graph').style.display=m==='tree'?'block':'none';$('directory').classList.toggle('active',m==='directory');for(const id of ['scope','fit','plus','minus'])$(id).style.display=m==='tree'?'':'none';if(m==='tree')drawGraph();else drawDirectory();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-person]');if(b)showProfile(+b.dataset.person);});$('search').addEventListener('input',filterPeople);$('filter').addEventListener('change',filterPeople);$('scope').addEventListener('change',()=>{scope=$('scope').value;drawGraph();});$('tree-tab').onclick=()=>setMode('tree');$('directory-tab').onclick=()=>setMode('directory');$('fit').onclick=()=>{$('profile').classList.remove('open');autoFrame=true;clearHighlight();fit();wakePhysics();};$('plus').onclick=()=>zoomBy(1.4);$('minus').onclick=()=>zoomBy(1/1.4);$('close-mobile').onclick=()=>{$('profile').classList.remove('open');clearHighlight();};$('browse').onclick=()=>{const nav=$('people-nav');nav.classList.toggle('open');$('browse').setAttribute('aria-expanded',nav.classList.contains('open')?'true':'false');if(nav.classList.contains('open'))$('search').focus();};$('about').onclick=()=>$('audit').showModal();$('close-audit').onclick=()=>$('audit').close();$('show-gaps').onclick=()=>{$('audit').close();$('filter').value='review';$('search').value='';filterPeople();setMode('directory');};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Mathematical_Lineage_v2_records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
function makePrint(){$('print-document').innerHTML=`<h1>Mathematical Lineage — Biographical Edition 2</h1><p>17 November 2026 · ${D.nodes.length} person records · ${D.counts.originalLabels} original name labels</p>${D.notes.map(p=>`<p>${esc(p)}</p>`).join('')}`+D.nodes.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(n=>`<article class="print-entry"><h2>${esc(n.name)}</h2><small>${esc(n.status)} · Original labels: ${n.aliases.map(esc).join('; ')}</small><p>${esc(n.bio)}</p><p>Earlier connections: ${n.incoming.map(i=>esc(byId.get(i).name)).join('; ')||'None recorded'}<br>Later connections: ${n.outgoing.map(i=>esc(byId.get(i).name)).join('; ')||'None recorded'}</p>${n.sources.map(s=>`<p><a href="${esc(s.url)}">${esc(s.title)}</a></p>`).join('')}</article>`).join('');}
$('print').onclick=()=>{makePrint();window.print();};window.addEventListener('beforeprint',makePrint);window.addEventListener('resize',()=>{if(mode==='tree')fit();});showProfile(92,false);
window.LINEAGE_TEST={data:D,stepPhysics,yearToY,showProfile,setMode,drawGraph,get visibleCount(){return drawn.length}};
</script></body></html>
