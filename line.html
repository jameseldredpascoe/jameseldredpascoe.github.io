"Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 70, "name": "Abraham Gotthelf Kästner", "aliases": ["Abraham Gotthelf Kästner"], "bio": "Abraham Gotthelf Kästner (1719–1800) taught at Leipzig and Göttingen and wrote influential textbooks in mathematics and its history. He was also known for literary and satirical writing. His students and associates connect the Göttingen educational tradition to several later branches of mathematics and astronomy.", "status": "Biographical entry", "sources": [{"title": "Abraham Kästner (1719 - 1800) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Kaestner/"}, {"title": "Kästner, Abraham Gotthelf - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz70303.html"}, {"title": "Kästner, Abraham Gotthelf - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd118714570.html?language=en"}, {"title": "Abraham Gotthelf Kästner", "url": "https://en.wikipedia.org/wiki/Abraham_Gotthelf_K%C3%A4stner"}], "color": "#f97316", "incoming": [68], "outgoing": [71, 74, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212], "originalYear": 1739, "sourceType": "Main roster", "rank": 28, "timeline": {"year": 1739, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 71, "name": "Karl Christian von Langsdorf", "aliases": ["Karl Christian von Langsdorf"], "bio": "Karl Christian von Langsdorf (1757–1834) was a German mathematician and technologist whose academic work connected mathematics with engineering and practical sciences. He held positions at several European universities, including Heidelberg. His place in the chart should be understood in the institutional context of applied mathematics around 1800.", "status": "Biographical entry", "sources": [{"title": "Langsdorff, Karl Christian von (seit 1806) - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd116728701.html"}, {"title": "Langsdorff, Karl Christian von (seit 1806) - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz57421.html"}, {"title": "Langsdorff, Karl Christian von (seit 1806) - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/ppn116728701.html"}, {"title": "Langsdorff, Karl Christian von (seit 1806) - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/116728701.html"}], "color": "#f97316", "incoming": [70], "outgoing": [78], "originalYear": 1781, "sourceType": "Main roster", "rank": 29, "timeline": {"year": 1781, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 72, "name": "Joseph-Louis Lagrange", "aliases": ["Joseph-Louis Lagrange"], "bio": "Joseph-Louis Lagrange (1736–1813) worked in Turin, Berlin, and Paris. His contributions to mechanics, variational calculus, algebra, and number theory made him a central figure of eighteenth-century mathematics. The Mécanique analytique presented mechanics through a systematic analytical framework. He did not follow a modern doctoral training pathway.", "status": "Biographical entry", "sources": [{"title": "Joseph-Louis Lagrange (1736 - 1813) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Lagrange/"}, {"title": "Joseph-Louis Lagrange (1736 - 1813) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Lagrange/"}, {"title": "Joseph Louis Lagrange English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/lagrange.pdf"}, {"title": "Joseph Louis Lagrange | A Short Account of the History of Mathematics | W.W. Rouse Ball | Lit2Go ETC", "url": "https://etc.usf.edu/lit2go/218/a-short-account-of-the-history-of-mathematics/5536/joseph-louis-lagrange/"}], "color": "#eab308", "incoming": [69], "outgoing": [76, 213, 214, 215], "originalYear": 1760, "sourceType": "Main roster", "rank": 31, "timeline": {"year": 1760, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 73, "name": "Pierre-Simon Laplace", "aliases": ["Pierre-Simon Laplace"], "bio": "Pierre-Simon Laplace (1749–1827) worked on celestial mechanics, probability, and mathematical physics. His Mécanique céleste and Théorie analytique des probabilités were major syntheses. His career also involved scientific administration and public office in France; teaching and institutional patronage need to be distinguished in interpreting his descendants.", "status": "Needs research", "sources": [{"title": "Pierre-Simon Laplace (1749 - 1827) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Laplace/"}, {"title": "Pierre Simon Laplace English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/laplace.pdf"}, {"title": "Pierre-Simon Laplace (1749 - 1827) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Laplace/"}, {"title": "Pierre-Simon Laplace (1749 - 1827) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Laplace/"}], "color": "#eab308", "incoming": [], "outgoing": [76], "originalYear": 1795, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1795, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 74, "name": "Johann Friedrich Pfaff", "aliases": ["Johann Friedrich Pfaff"], "bio": "Johann Friedrich Pfaff (1765–1825) was a German mathematician known for work on differential equations and the systems that bear his name. He taught at Helmstedt and Halle and was associated with Gauss's doctoral examination. The precise role of an examiner in that period differs from modern dissertation supervision.", "status": "Biographical entry", "sources": [{"title": "Johann Friedrich Pfaff (1765 - 1825) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Pfaff/"}, {"title": "Johann Friedrich Pfaff", "url": "https://mathshistory.st-andrews.ac.uk/Strick/pfaff.pdf"}, {"title": "Johann Friedrich Pfaff - CHIC", "url": "https://chic.caltech.edu/genealogy/johann-friedrich-pfaff/"}, {"title": "Johann Friedrich Pfaff | A Short Account of the History of Mathematics | W.W. Rouse Ball | Lit2Go ETC", "url": "https://etc.usf.edu/lit2go/218/a-short-account-of-the-history-of-mathematics/5537/johann-friedrich-pfaff/"}], "color": "#f97316", "incoming": [70, 97], "outgoing": [75, 216, 217, 218, 219, 220, 221, 222, 223], "originalYear": 1786, "sourceType": "Main roster", "rank": 29, "timeline": {"year": 1786, "kind": "Recorded milestone", "basis": "Doctoral year recorded in original roster", "estimated": false}}, {"id": 75, "name": "Carl Friedrich Gauss", "aliases": ["Carl Friedrich Gauss"], "bio": "Carl Friedrich Gauss (1777–1855) made foundational contributions to number theory, geometry, astronomy, geodesy, and mathematical physics. His 1799 doctorate was awarded at Helmstedt, and he later directed the Göttingen observatory. The many connections attributed to him include students, assistants, visitors, and correspondents, not one uniform form of mentorship.", "status": "Biographical entry", "sources": [{"title": "Carl Friedrich Gauss (1777 - 1855) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Gauss/"}, {"title": "Carl Friedrich Gauss English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/Gauss.pdf"}, {"title": "Carl Friedrich Gauss English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/gauss.pdf"}, {"title": "Carl Friedrich Gauss", "url": "https://en.wikipedia.org/wiki/Carl_Friedrich_Gauss"}], "color": "#f97316", "incoming": [74], "outgoing": [79, 224, 225, 226, 227, 228, 229, 230, 231, 232, 233, 234, 235, 236, 237, 238, 239, 240], "originalYear": 1799, "sourceType": "Main roster", "rank": 30, "timeline": {"year": 1799, "kind": "Recorded milestone", "basis": "Doctorate, Helmstedt", "estimated": false}}, {"id": 76, "name": "Siméon Denis Poisson", "aliases": ["Siméon Denis Poisson"], "bio": "Siméon Denis Poisson (1781–1840) was educated at the École Polytechnique and worked in analysis, mechanics, probability, and mathematical physics. His name is attached to the Poisson distribution, Poisson brackets, and Poisson's equation. His institutional roles placed him at the center of French mathematical education in the early nineteenth century.", "status": "Biographical entry", "sources": [{"title": "Siméon-Denis Poisson (1781 - 1840) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Poisson/"}, {"title": "Simeón-Denis Poisson (1781-1840)", "url": "https://people.uncw.edu/hermanr/mat346/Lectures/Lectures2023/CombinedLectures.pdf"}, {"title": "# Simeon-Denis Poisson", "url": "https://web.stanford.edu/class/archive/cs/cs109/cs109.1208/lectures/08_poisson_and_more.pdf"}, {"title": "# Simeon-Denis Poisson", "url": "https://web.stanford.edu/class/archive/cs/cs109/cs109.1212/lectures/08_poisson_and_more.pdf"}], "color": "#eab308", "incoming": [72, 73], "outgoing": [81, 31, 241, 242], "originalYear": 1800, "sourceType": "Main roster", "rank": 32, "timeline": {"year": 1800, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 77, "name": "Joseph Fourier", "aliases": ["Joseph Fourier"], "bio": "Joseph Fourier (1768–1830) developed the mathematical theory of heat and the representation of functions by trigonometric series. He also served in scientific administration and accompanied Napoleon's expedition to Egypt. His work became a foundation for harmonic analysis and partial differential equations.", "status": "Biographical entry", "sources": [{"title": "Joseph Fourier (1768 - 1830) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Fourier/"}, {"title": "Joseph Fourier English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/Fourier.pdf"}, {"title": "Joseph Fourier on his teachers - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Extras/Fourier_teachers/"}, {"title": "Joseph Fourier (1768 - 1830) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Fourier/"}], "color": "#eab308", "incoming": [], "outgoing": [81], "originalYear": 1808, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1808, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 78, "name": "Martin Ohm", "aliases": ["Martin Ohm"], "bio": "Martin Ohm (1792–1872) was a German mathematician associated with Berlin and the teaching and organization of mathematics. His writings sought a systematic development of mathematical subjects. He was the brother of physicist Georg Simon Ohm; the two should not be conflated.", "status": "Biographical entry", "sources": [{"title": "Martin Ohm (1792 - 1872) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Ohm_Martin/"}, {"title": "Martin Ohm (1792 - 1872) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Ohm_Martin/"}, {"title": "Martin Ohm (1792 - 1872) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Ohm_Martin/"}, {"title": "Poster of Martin Ohm", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Ohm_Martin/poster/lived/"}], "color": "#ef4444", "incoming": [71], "outgoing": [82], "originalYear": 1811, "sourceType": "Main roster", "rank": 30, "timeline": {"year": 1811, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 79, "name": "Christian Ludwig Gerling", "aliases": ["Christian Ludwig Gerling"], "bio": "Christian Ludwig Gerling (1788–1864) was a mathematician, astronomer, and geodesist associated with Marburg. He studied with Gauss and corresponded with him extensively. His work included practical surveying and astronomical observation, connecting mathematical theory with measurement.", "status": "Biographical entry", "sources": [{"title": "Christian Ludwig Gerling", "url": "https://en.wikipedia.org/wiki/Christian_Ludwig_Gerling"}, {"title": "Christian Ludwig Gerling (Mathematiker)", "url": "https://de.wikipedia.org/wiki/Christian_Ludwig_Gerling_%28Mathematiker%29"}, {"title": "Christian Ludwig Gerling", "url": "https://fr.wikipedia.org/wiki/Christian_Ludwig_Gerling"}], "color": "#f97316", "incoming": [75], "outgoing": [80, 253, 254], "originalYear": 1812, "sourceType": "Main roster", "rank": 31, "timeline": {"year": 1812, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 80, "name": "Julius Plücker", "aliases": ["Julius Plücker"], "bio": "Julius Plücker (1801–1868) worked on analytic and projective geometry and later on experimental physics. At Bonn, his research connected algebraic curves, line geometry, and investigations of electrical discharges. Felix Klein worked with him, linking this geometric tradition to the Erlangen program.", "status": "Biographical entry", "sources": [{"title": "Julius Plücker (1801 - 1868) - Biography - MacTutor History of Mathematics", "url": "https:// Bliss", "aliases": ["Gilbert Ames Bliss"], "bio": "Gilbert Ames Bliss (1876–1951) completed his doctorate at Chicago in 1900 under Oskar Bolza. He became a leading figure in the calculus of variations and a major teacher at Chicago. His students included Edward McShane and many researchers whose dissertations developed variational methods.", "status": "Biographical entry", "sources": [{"title": "Gilbert Bliss (1876 - 1951) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Bliss/"}, {"title": "Gilbert Bliss (1876 - 1951) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Bliss/"}, {"title": "Gilbert Ames Bliss", "url": "https://en.wikipedia.org/wiki/Gilbert_Ames_Bliss"}, {"title": "Gilbert Ames Bliss", "url": "https://de.wikipedia.org/wiki/Gilbert_Ames_Bliss"}], "color": "#06b6d4", "incoming": [84], "outgoing": [86, 374, 375, 376, 377, 378, 379, 380, 381, 382, 383, 384, 385, 386, 387, 388, 389, 390, 391, 392, 393, 394, 395, 396, 397, 398, 399, 400, 401, 402], "originalYear": 1900, "sourceType": "Main roster", "rank": 37, "timeline": {"year": 1900, "kind": "Recorded milestone", "basis": "Doctorate, Chicago", "estimated": false}}, {"id": 86, "name": "Edward J. McShane", "aliases": ["Edward J. McShane"], "bio": "Edward James McShane (1904–1989) earned his Chicago doctorate in 1930 under Gilbert Ames Bliss. His work included the calculus of variations, integration, and functional analysis, and he taught for many years at the University of Virginia. The McShane integral is one lasting connection to his research.", "status": "Biographical entry", "sources": [{"title": "Edward McShane (1904 - 1989) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/McShane/"}, {"title": "Mathematical Association of America", "url": "https://en.wikipedia.org/wiki/Mathematical_Association_of_America"}, {"title": "Mathematical Association of America", "url": "https://it.wikipedia.org/wiki/Mathematical_Association_of_America"}], "color": "#06b6d4", "incoming": [85], "outgoing": [87, 403, 404, 405, 406, 407, 408, 409, 410, 411], "originalYear": 1930, "sourceType": "Main roster", "rank": 38, "timeline": {"year": 1930, "kind": "Recorded milestone", "basis": "Doctorate, Chicago", "estimated": false}}, {"id": 87, "name": "Billy James Pettis", "aliases": ["Billy James Pettis"], "bio": "Billy James Pettis (1913–1979) completed his doctorate at Virginia under Edward McShane. His research in functional analysis includes the Pettis integral and results on measurability and topological groups. His educational descendants connect the variational-analysis branch to later operator theory.", "status": "Biographical entry", "sources": [{"title": "Billy James Pettis", "url": "https://en.wikipedia.org/wiki/Billy_James_Pettis"}, {"title": "Billy James Pettis", "url": "https://de.wikipedia.org/wiki/Billy_James_Pettis"}, {"title": "Billy James Pettis", "url": "https://fr.wikipedia.org/wiki/Billy_James_Pettis"}], "color": "#14b8a6", "incoming": [86], "outgoing": [88], "originalYear": 1937, "sourceType": "Main roster", "rank": 39, "timeline": {"year": 1937, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 88, "name": "Heron S. Collins", "aliases": ["Heron S. Collins"], "bio": "Heron S. Collins was a functional analyst whose research and teaching were associated with Louisiana State University. LSU's doctoral records identify him as John B. Conway's adviser and list students working on measures, strict topologies, and related analysis. Personal dates are not supplied here without an adequately matched biographical source.", "status": "Biographical entry", "sources": [{"title": "In Memoriam", "url": "https://www.wofford.edu/about/news/wofford-today/archive/2014/winter/in-memoriam"}, {"title": "Wofford Today - Winter 2014", "url": "https://www.wofford.edu/wofford.edu/documents/about/news/wofford-today/WT-2014-Winter.pdf"}, {"title": "John B. Conway", "url": "https://en.wikipedia.org/wiki/John_B._Conway"}], "color": "#14b8a6", "incoming": [87], "outgoing": [89, 412, 413], "originalYear": 1953, "sourceType": "Main roster", "rank": 40, "timeline": {"year": 1953, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 89, "name": "John B. Conway", "aliases": ["John B. Conway"], "bio": "John Bligh Conway (1939–2024) earned his doctorate at Louisiana State University in 1965 under Heron Collins. He worked in operator theory and complex analysis and wrote influential graduate textbooks. He advised Jim Agler. He is distinct from John Horton Conway, the Princeton mathematician known for the Game of Life.", "status": "Biographical entry", "sources": [{"title": "John B. Conway", "url": "https://en.wikipedia.org/wiki/John_B._Conway"}, {"title": "Colloquium - WCU of PA", "url": "https://recap.wcupa.edu/sciences-mathematics/mathematics/colloquium.aspx"}], "color": "#14b8a6", "incoming": [88], "outgoing": [90, 414, 415, 416, 417, 418, 419, 420, 421, 422, 423, 424, 425, 426, 427, 428, 429, 430, 431, 432, 433], "originalYear": 1965, "sourceType": "Main roster", "rank": 41, "timeline": {"year": 1965, "kind": "Recorded milestone", "basis": "Doctorate, Louisiana State", "estimated": false}}, {"id": 90, "name": "Jim Agler", "aliases": ["Jim Agler"], "bio": "Jim Agler earned his doctorate at Indiana University in 1980 under John B. Conway. His research connects operator theory, several complex variables, interpolation, and function theory. His students include James Pascoe, Ryan Tully-Doyle, and Scott McCullough. Agler decompositions and the Schur–Agler framework are central themes associated with his work.", "status": "Biographical entry", "sources": [{"title": "Jim Agler | Department of Mathematics", "url": "https://www.math.ucsd.edu/people/profiles/jim-agler"}, {"title": "Jim Agler - 2016 Fellow of the AMS | Department of Mathematics", "url": "https://math.ucsd.edu/news/jim-agler-2016-fellow-ams"}, {"title": "Jim Agler", "url": "https://en.wikipedia.org/wiki/Jim_Agler"}], "color": "#3b82f6", "incoming": [89], "outgoing": [91, 92, 434, 435, 436, 437, 438, 439, 440, 441], "originalYear": 1980, "sourceType": "Main roster", "rank": 42, "timeline": {"year": 1980, "kind": "Recorded milestone", "basis": "Doctorate, Indiana", "estimated": false}}, {"id": 91, "name": "Ryan Tully-Doyle", "aliases": ["Ryan Tully-Doyle"], "bio": "Ryan Tully-Doyle earned his doctorate at the University of California, San Diego under Jim Agler. His work concerns operator theory, complex analysis, and noncommutative function theory. His academic career includes teaching and research at Cal Poly, San Luis Obispo, where he also completed his undergraduate studies.", "status": "Biographical entry", "sources": [{"title": "FREE FUNCTIONS WITH SYMMETRY", "url": "https://www.math.wustl.edu/~pascoe/freesymmetry.pdf"}, {"title": "James Eldred Pascoe: Curriculum Vitae", "url": "https://www.math.wustl.edu/~pascoe/cv.pdf"}, {"title": "All in a Day's Work - Research and Publications - Mathematics Department - Cal Poly, San Luis Obispo", "url": "https://math.calpoly.edu/news/all-days-work-research-and-publications"}], "color": "#6366f1", "incoming": [90], "outgoing": [], "originalYear": 2015, "sourceType": "Main roster", "rank": 43, "timeline": {"year": 2015, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 92, "name": "James Eldred Pascoe", "aliases": ["James Eldred Pascoe"], "bio": "James Eldred Pascoe earned his Ph.D. in mathematics at UC San Diego in 2015 under Jim Agler. His research includes operator theory, noncommutative function theory, matrix inequalities, and analytic continuation. His academic path includes a Chauvenet appointment, an NSF postdoctoral fellowship, and work at Florida and Drexel. The imported graph combines doctoral, mentoring, and collaborative relationships around him.", "status": "Biographical entry", "sources": [{"title": "James Eldred Pascoe, PhD | CoAS | Drexel University", "url": "https://drexel.edu/coas/faculty-research/faculty-directory/mathematics/pascoe-james/"}, {"title": "James Eldred Pascoe: Curriculum Vitae", "url": "https://drexel.edu/~/media/Files/coas2/math/cv/drexel-pascoe-james-cv.ashx?la=en"}, {"title": "James Eldred Pascoe: Curriculum Vitae", "url": "https://www.math.wustl.edu/~pascoe/cv.pdf"}, {"title": "James Eldred Pascoe - Drexel University - Overview", "url": "https://researchdiscovery.drexel.edu/esploro/profile/james_pascoe"}], "color": "#6366f1", "incoming": [90], "outgoing": [93, 94, 95, 96], "originalYear": 2015, "sourceType": "Main roster", "rank": 43, "timeline": {"year": 2015, "kind": "Recorded milestone", "basis": "Doctorate, UC San Diego", "estimated": false}}, {"id": 93, "name": "Tapesh Yadav", "aliases": ["Tapesh Yadav"], "bio": "Tapesh Yadav completed his Ph.D. at the University of Florida in spring 2023; the university lists James Pascoe as adviser. His mathematical work is connected with random matrix theory. Current employment is not asserted here because searches return conflicting profiles and should not be used to merge namesakes.", "status": "Biographical entry", "sources": [{"title": "\"SELF-WEIGHTED INPUT-GUIDED (SWING) KERNEL FOR MACHINE LEARNING CLASSIF\" by Tapesh Yadav", "url": "https://digitalcommons.memphis.edu/etd/4076/"}, {"title": "PhD alumni - Mathematics", "url": "https://math.ufl.edu/alumni/phd-alumni/"}, {"title": "Curriculum Vitæ", "url": "https://people.clas.ufl.edu/amarsiglietti/files/CV_Arnaud_Marsiglietti.pdf"}, {"title": "Professional Development Seminar - Graduate Mathematics Association", "url": "https://gma.math.ufl.edu/professional-development-seminar/"}], "color": "#8b5cf6", "incoming": [92], "outgoing": [], "originalYear": 2023, "sourceType": "Main roster", "rank": 44, "timeline": {"year": 2023, "kind": "Recorded milestone", "basis": "Doctorate, Florida", "estimated": false}}, {"id": 94, "name": "Austin Jacobs", "aliases": ["Austin Jacobs"], "bio": "Austin Robert Jacobs earned a mathematics doctorate at the University of Florida, with J. E. Pascoe as dissertation chair. His dissertation concerns integral operators and spectral metric theory. The retrieved spring 2024 commencement program and alumni page (which lists fall 2025) disagree on the date, so the year is flagged rather than silently chosen. His work with Pascoe includes kernel embeddings of measures.", "status": "Biographical entry", "sources": [{"title": "University of Florida — PhD alumni", "url": "https://math.ufl.edu/alumni/phd-alumni/"}, {"title": "Hayden William Hunter", "url": "https://commencement.ufl.edu/media/commencementufledu/past-commencement-pdf/past-commencement-programs/commencement-pdf/sp24-uf-doctoral-commencement.pdf"}, {"title": "The geometry of inconvenience and perverse equilibria in trade networks", "url": "https://researchdiscovery.drexel.edu/esploro/outputs/preprint/The-geometry-of-inconvenience-and-perverse/991022047145804721"}], "color": "#8b5cf6", "incoming": [92], "outgoing": [], "originalYear": 2024, "sourceType": "Main roster", "rank": 44, "timeline": {"year": 2024, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 95, "name": "Julian Bushelli", "aliases": ["Julian Bushelli"], "bio": "Julian Bushelli is associated with the mathematics graduate program at Drexel. A 2025 Drexel seminar announcement describes his work on an extended free functional calculus, including functions on domains beyond operators on a single Hilbert space. He previously studied at Eastern University. No completed doctorate stius"], "bio": "Adolphus Vorstius (1597–1663) was a physician and botanist at Leiden. He taught medicine and worked with the university's botanical garden. His career belongs to the intertwined history of medical education, botany, and the study of medicinal plants.", "status": "Biographical entry", "sources": [{"title": "Vorstius, Adolphus - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/128830891.html"}, {"title": "Vorstius, Adolph (1597–1663)", "url": "https://www.cambridge.org/core/books/abs/cambridge-descartes-lexicon/vorstius-adolph-15971663/D63ED9EFE14081328889A66FBCF52DD1"}], "color": "#3b82f6", "incoming": [], "outgoing": [106], "originalYear": 1610, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1610, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 108, "name": "Felix Plater", "aliases": ["Felix Plater"], "bio": "Felix Platter, also spelled Plater (1536–1614), was a Basel physician trained in Montpellier. His writings describe anatomy, disease, and medical practice, and he kept an important autobiographical record. His career links French and Swiss medical education in the imported network.", "status": "Biographical entry", "sources": [{"title": "Felix Platter", "url": "https://en.wikipedia.org/wiki/Felix_Platter"}, {"title": "Plater", "url": "https://en.wikipedia.org/wiki/Plater"}, {"title": "Felix Platter | Wellcome Collection", "url": "https://content.www.wellcomecollection.org/concepts/ymawcpw8"}], "color": "#3b82f6", "incoming": [109], "outgoing": [63], "originalYear": 1557, "sourceType": "Main roster", "rank": 6, "timeline": {"year": 1557, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 109, "name": "Guillaume Rondelet", "aliases": ["Guillaume Rondelet"], "bio": "Guillaume Rondelet (1507–1566) taught medicine at Montpellier and is especially known for his work on fishes and other aquatic animals. His natural history drew on anatomical observation and comparison. He was an important teacher in the sixteenth-century medical community.", "status": "Biographical entry", "sources": [{"title": "Rondelet, Guillaume - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz106798.html"}, {"title": "Rondelet, Guillaume - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/117593966.html?language=en"}, {"title": "Guillaume Rondelet", "url": "https://en.wikipedia.org/wiki/Guillaume_Rondelet"}, {"title": "Guillaume Rondelet", "url": "https://it.wikipedia.org/wiki/Guillaume_Rondelet"}], "color": "#3b82f6", "incoming": [110], "outgoing": [108], "originalYear": 1529, "sourceType": "Main roster", "rank": 5, "timeline": {"year": 1529, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 110, "name": "Johannes Winter von Andernach", "aliases": ["Johannes Winter von Andernach"], "bio": "Johann Winter of Andernach (1505–1574), also known as Guinterius, was a physician, anatomist, and translator. He taught in Paris and later worked in Strasbourg. His translations of Greek medical texts and anatomical teaching were part of the humanist reconstruction of medicine.", "status": "Biographical entry", "sources": [{"title": "Johann Winter von Andernach", "url": "https://fr.wikipedia.org/wiki/Johann_Winter_von_Andernach"}, {"title": "Johann Winter", "url": "https://de.wikipedia.org/wiki/Johann_Winter"}], "color": "#3b82f6", "incoming": [111, 112], "outgoing": [109, 355, 356, 143], "originalYear": 1527, "sourceType": "Main roster", "rank": 4, "timeline": {"year": 1527, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 111, "name": "Rutger
