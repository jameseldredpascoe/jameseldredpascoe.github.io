g></svg><div id="directory" class="directory"></div><div class="graph-caption" id="caption"></div></section><aside id="profile" aria-label="Biographical record"><button id="close-mobile">Close biography ×</button><div id="profile-content"></div></aside></main><dialog id="audit"><button id="close-audit" style="float:right">Close</button><div class="eyebrow">Editorial record · 17 November 2026</div><h2>Complete roster. Explicit limits.</h2><div class="audit-counts" id="audit-counts"></div><div id="audit-text"></div><button id="show-gaps">Browse research gaps</button></dialog><div class="print-only" id="print-document"></div><script id="data" type="application/json">{"version": "2.0", "reviewDate": "2026-11-17", "counts": {"originalLabels": 607, "people": 605, "mergedAliases": 2, "originalLinks": 633, "relationships": 620, "narratives": 605, "withSources": 564, "needsResearch": 82}, "nodes": [{"id": 0, "name": "Abu Abdallah al-Natili", "aliases": ["Abu Abdallah al-Natili"], "bio": "An early teacher of Ibn Sina (Avicenna), associated with his study of logic and elementary mathematical texts. Avicenna's autobiographical account makes al-Natili part of his youthful education; it does not establish a modern doctoral relationship. The surviving biographical record is much thinner than Avicenna's.", "status": "Biographical entry", "sources": [{"title": "NEH Central Asia in World History 2016 Summer Institute", "url": "https://slaviccenter.osu.edu/sites/slaviccenter.osu.edu/files/Outreach-teacher-training-neh-ca-the-life-of-ibn-sina-judi-lee.pdf"}], "color": "#10b981", "incoming": [], "outgoing": [3], "originalYear": 980, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 980, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 1, "name": "Abu Mansur al-Qumri", "aliases": ["Abu Mansur al-Qumri"], "bio": "A physician associated with the Samanid world and with Avicenna's medical education. His name is attached to medical writings, including a compendium commonly translated as The Book of Wealth and Poverty. Dates and the precise circumstances of his teaching require care; the original file's book title was not retained as an established fact.", "status": "Biographical entry", "sources": [{"title": "Qumri", "url": "https://en.wikipedia.org/wiki/Qumri"}, {"title": "Arabic Medical Handbooks in the Matenadaran Collection", "url": "https://www.academia.edu/143824917/Arabic_Medical_Handbooks_in_the_Matenadaran_Collection"}], "color": "#10b981", "incoming": [], "outgoing": [3], "originalYear": 985, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 985, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 2, "name": "Abu Sahl al-Masihi", "aliases": ["Abu Sahl al-Masihi"], "bio": "A Christian Persian physician and philosopher from Gorgan, active in the intellectual world of Khwarazm around the turn of the eleventh century. His medical encyclopedia, the Hundred Books on the Art of Medicine, belongs to the learned tradition surrounding Avicenna. Describing him simply as a physician at the Ghaznavid court obscures that setting.", "status": "Biographical entry", "sources": [{"title": "ʿISĀ B. YAḤYĀ MASIḤI JORJĀNI - Encyclopaedia Iranica", "url": "https://www.iranicaonline.org/articles/isa-b-yahya-masihi-jorjani/"}, {"title": "Abu Sahl 'Isa ibn Yahya al-Masihi", "url": "https://en.wikipedia.org/wiki/Abu_Sahl_%27Isa_ibn_Yahya_al-Masihi"}, {"title": "Abu Sahl Masihí", "url": "https://es.wikipedia.org/wiki/Abu_Sahl_Masih%C3%AD"}], "color": "#10b981", "incoming": [], "outgoing": [3], "originalYear": 990, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 990, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 3, "name": "Avicenna", "aliases": ["Avicenna"], "bio": "Ibn Sina (980–1037), known in Latin as Avicenna, worked as a physician, philosopher, and administrator in the eastern Islamic world. His Canon of Medicine became a major medical reference, while The Book of Healing treated logic, natural philosophy, mathematics, and metaphysics. His influence spread through Arabic, Persian, and Latin scholarly traditions.", "status": "Biographical entry", "sources": [{"title": "Avicenna (980 - 1037) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Avicenna/"}, {"title": "Ibn Sina [Avicenna]", "url": "https://plato.stanford.edu/entries/ibn-sina/"}, {"title": "Ibn Sina [Avicenna]", "url": "https://plato.stanford.edu/archives/spr2022/entries/ibn-sina/"}, {"title": "Ibn Sina [Avicenna]", "url": "https://plato.stanford.edu/entries/ibn-sina/index.html"}], "color": "#10b981", "incoming": [0, 1, 2], "outgoing": [4, 153, 154, 155], "originalYear": 1000, "sourceType": "Main roster", "rank": 1, "timeline": {"year": 1000, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 4, "name": "Bahmanyār ibn al-Marzubān", "aliases": ["Bahmanyār ibn al-Marzubān"], "bio": "An eleventh-century philosopher and prominent student of Avicenna, Bahmanyar helped transmit and develop Avicennian philosophy. His principal work, al-Tahsil, addresses logic, metaphysics, and natural philosophy. His place in this network concerns philosophical teaching and textual transmission, rather than a university doctorate.", "status": "Biographical entry", "sources": [{"title": "Bahmanyār’s al-Taḥṣīl: A study and translation of Book Two – Metaphysics", "url": "https://www.academia.edu/100422732/Bahmany%C4%81r_s_al_Ta%E1%B8%A5%E1%B9%A3%C4%ABl_A_study_and_translation_of_Book_Two_Metaphysics"}, {"title": "Bahmanyar", "url": "https://en.wikipedia.org/wiki/Bahmanyar"}], "color": "#10b981", "incoming": [3], "outgoing": [5, 156], "originalYear": 1040, "sourceType": "Main roster", "rank": 2, "timeline": {"year": 1040, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 5, "name": "Omar Khayyam", "aliases": ["Omar Khayyam"], "bio": "Omar Khayyam (1048–1131) was a Persian mathematician, astronomer, and poet associated with Nishapur. He classified cubic equations and treated them geometrically using conic sections; he also worked on Euclid and calendar reform. His mathematical reputation should be distinguished from the later international reception of the poetic Rubaiyat attributed to him.", "status": "Biographical entry", "sources": [{"title": "Omar Khayyam (1048 - 1131) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Khayyam/"}, {"title": "Omar Khayyam (1048 - 1131) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Khayyam/"}, {"title": "KHAYYAM, OMAR i. LIFE - Encyclopaedia Iranica", "url": "https://www.iranicaonline.org/articles/khayyam-omar/khayyam-omar-i-life/?generate_pdf=1"}, {"title": "KHAYYAM, OMAR xiv. AS MATHEMATICIAN - Encyclopaedia Iranica", "url": "https://www.iranicaonline.org/articles/khayyam-omar/khayyam-omar-xiv-as-mathematician/"}], "color": "#10b981", "incoming": [4], "outgoing": [6, 7, 157, 158], "originalYear": 1068, "sourceType": "Main roster", "rank": 3, "timeline": {"year": 1068, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 6, "name": "Sharaf al-Dīn al-Ṭūsī", "aliases": ["Sharaf al-Dīn al-Ṭūsī"], "bio": "Sharaf al-Din al-Tusi (c. 1135–1213) studied equations, especially cubic equations, and methods for determining when positive solutions exist. His analysis of maxima is an important episode in the history of algebra. Calling it simply an invention of the derivative imports later terminology and conceals the specific techniques of his treatise.", "status": "Biographical entry", "sources": [{"title": "Sharaf al-Din al-Tusi (1135 - 1213) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Al-Tusi_Sharaf/"}, {"title": "Nasir al-Din al-Tusi (1201 - 1274) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Al-Tusi_Nasir/"}, {"title": "Biographical Encyclopedia of Astronomers", "url": "https://mathshistory.st-andrews.ac.uk/BEA/al_tusi_sharaf_bea.pdf"}, {"title": "encyclopedia.com", "url": "https://mathshistory.st-andrews.ac.uk/DSB/Al-Tusi_Sharaf.pdf"}], "color": "#10b981", "incoming": [5], "outgoing": [9], "originalYear": 1160, "sourceType": "Main roster", "rank": 4, "timeline": {"year": 1160, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 7, "name": "Saraf al-Dīn Muhammad al-Masʿūdī al-Marwazī", "aliases": ["Saraf al-Dīn Muhammad al-Masʿūdī al-Marwazī"], "bio": "A twelfth-century scholar associated with mathematical astronomy and philosophical debate in the eastern Islamic world. The name has several transliteration variants, and the original label begins with the unusual spelling “Saraf.” His identity is retained here, but the particular teacher–student links in the imported graph need independent historical documentation.", "status": "Biographical entry", "sources": [{"title": "Šaraf al-Dīn Muḥammad ibn Masʿūd ibn Muḥammad al-Masʿūdī al-Marwazī | ISMI", "url": "https://ismi.mpiwg-berlin.mpg.de/node/3890380"}], "color": "#10b981", "incoming": [5], "outgoing": [9, 8], "originalYear": 1180, "sourceType": "Main roster", "rank": 4, "timeline": {"year": 1180, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 8, "name": "Fakhr al-Dīn al-Rāzī", "aliases": ["Fakhr al-Dīn al-Rāzī"], "bio": "Fakhr al-Din al-Razi (1149–1209) was a major theologian, philosopher, and Quranic commentator, born in Rayy. He engaged critically with Avicennian philosophy and wrote across theology, logic, and natural philosophy. The original graph's date of 1222 falls after his death and cannot be treated as his graduation year.", "status": "Biographical entry", "sources": [{"title": "Fakhr al-Din al-Razi", "url": "https://plato.stanford.edu/archives/sum2024/entries/al-din-al-razi/"}, {"title": "Fakhr al-Din al-Razi", "url": "https://plato.stanford.edu/entries/al-din-al-razi/"}, {"title": "Fakhr al-Din al-Razi", "url": "https://plato.stanford.edu/archives/spr2026/entries/al-din-al-razi/"}, {"title": "CHAPTER I\n\n# FAKHR AL-DĪN AL-RĀZĪ'S LIFE AND WORKS", "url": "https://era.ed.ac.uk/server/api/core/bitstreams/83871d07-0ef5-45a3-b715-ad0c1951009e/content"}], "color": "#10b981", "incoming": [7], "outgoing": [10, 159, 160], "originalYear": 1222, "sourceType": "Main roster", "rank": 5, "timeline": {"year": 1179, "kind": "Estimated active period", "basis": "Approximate active period, inferred from the lifespan in the biography.", "estimated": true}}, {"id": 9, "name": "Kamal al-Din ibn Yunus", "aliases": ["Kamal al-Din ibn Yunus"], "bio": "Kamal al-Din ibn Yunus (1156–1242) taught in Mosul and was known for a broad command of mathematics, astronomy, medicine, and philosophy. Accounts of his teaching place him within the scholarly networks preceding the Maragha observatory. These medieval educational relationships are not equivalent to doctoral supervision.", "status": "Biographical entry", "sources": [{"title": "Document3", "url": "https://mathshistory.st-andrews.ac.uk/DSB/Al-Tusi_Nasir.pdf"}, {"title": "Sharaf al-Din al-Tusi (1135 - 1213) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Al-Tusi_Sharaf/"}, {"title": "Kamal al-Din ibn Yunus", "url": "https://en.wikipedia.org/wiki/Kamal_al-Din_ibn_Yunus"}], "color": "#10b981", "incoming": [6, 7], "outgoing": [11, 161], "originalYear": 1200, "sourceType": "Main roster", "rank": 5, "timeline": {"year": 1200, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 10, "name": "Qutb al-Dīn al-Mīṣrī", "aliases": ["Qutb al-Dīn al-Mīṣrī"], "bio": "A physician and philosophical scholar associated in historical accounts with Fakhr al-Din al-Razi and the intellectual setting of Nishapur. His name must not be confused with other scholars called Qutb al-Din. The details of his life and the exact succession of teaching relationships remain a research question in this edition.", "status": "Biographical entry", "sources": [{"title": "Karimullah  \n*Emergence of Verification* [v.9]\n\nus", "url": "https://pure.manchester.ac.uk/ws/files/85912437/KARIMULLAH_Emergence_Verification_v10.pdf"}], "color": "#10b981", "incoming": [8], "outgoing": [11], "originalYear": 1222, "sourceType": "Main roster", "rank": 6, "timeline": {"year": 1222, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 11, "name": "Athīr al-Dīn al-Mufaḍḍal al-Abharī", "aliases": ["Athīr al-Dīn al-Mufaḍḍal al-Abharī"], "bio": "Athir al-Din al-Abhari was a thirteenth-century philosopher, logician, and astronomer. His short logical handbook, often called the Isagoge, and his philosophical teaching texts had a long life in subsequent education. The imported graph's exact sequence of advisers is retained as a claim requiring source-level checking.", "status": "Biographical entry", "sources": [{"title": "Abharī: Athīr al‐Dīn al‐Mufaḍḍal ibn ʿUmar ibn al‐Mufaḍḍal al‐Samarqandī al‐Abharī | ISMI", "url": "https://ismi.mpiwg-berlin.mpg.de/biography/Abhari_BEA.htm"}], "color": "#10b981", "incoming": [10, 9], "outgoing": [12], "originalYear": 1240, "sourceType": "Main roster", "rank": 7, "timeline": {"year": 1240, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 12, "name": "Nasir al-Din al-Tusi", "aliases": ["Nasir al-Din al-Tusi"], "bio": "Nasir al-Din al-Tusi (1201–1274) worked in mathematics, astronomy, philosophy, and ethics and directed the Maragha observatory under Mongol patronage. He developed mathematical astronomy, including the device now called the Tusi couple, and wrote influential treatments of trigonometry. His ancestry in a modern genealogy database should not be mistaken for a complete historical educational record.", "status": "Biographical entry", "sources": [{"title": "Nasir al-Din al-Tusi (1201 - 1274) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Al-Tusi_Nasir/"}, {"title": "Nasir al-Din al-Tusi (1201 - 1274) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Al-Tusi_Nasir/"}, {"title": "ṬUSI, NAṢIR-AL-DIN ii. AS MATHEMATICIAN AND ASTRONOMER - Encyclopaedia Iranica", "url": "https://www.iranicaonline.org/articles/tusi-nasir-al-din-mathematician-astronomer/"}, {"title": "Nasir al-Din al-Tusi and Astronomy", "url": "https://www.iis.ac.uk/wp-content/uploads/2024/10/nasir-al-din-tusi-and-astronomy-final-918772811.pdf"}], "color": "#10b981", "incoming": [11], "outgoing": [13, 162, 163, 164], "originalYear": 1250, "sourceType": "Main roster", "rank": 8, "timeline": {"year": 1250, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 13, "name": "Shams ad-Din Al-Bukhari", "aliases": ["Shams ad-Din Al-Bukhari"], "bio": "An astronomer associated with the Persian astronomical tradition encountered by Gregory Chioniades. He is important to accounts of the transfer of astronomical learning from Tabriz to Byzantium. Biographical details are sparse; the dates and institutional labels supplied in modern genealogy diagrams need separate historical verification.", "status": "Biographical entry", "sources": [{"title": "Shams al‐Dīn al‐Bukhārī | ISMI", "url": "https://ismi.mpiwg-berlin.mpg.de/biography/Shams_al-Din_al-Bukhari_BEA.htm"}], "color": "#10b981", "incoming": [12], "outgoing": [14], "originalYear": 1280, "sourceType": "Main roster", "rank": 9, "timeline": {"year": 1280, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 14, "name": "Gregory Chioniades", "aliases": ["Gregory Chioniadis"], "bio": "Gregory Chioniades was a Byzantine scholar who traveled to Tabriz to study astronomy and translated astronomical material into Greek. His activity links Persian astronomical learning with late Byzantine scholarship. The spelling “Chioniadis” in the original is preserved as a search alias, not treated as a second person.", "status": "Needs research", "sources": [{"title": "Chioniades, Gregor [George] | ISMI", "url": "https://ismi.mpiwg-berlin.mpg.de/biography/Chioniades_BEA.htm"}], "color": "#8b5cf6", "incoming": [13], "outgoing": [15, 167], "originalYear": 1300, "sourceType": "Main roster", "rank": 10, "timeline": {"year": 1300, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 15, "name": "Manuel Bryennios", "aliases": ["Manuel Bryennios"], "bio": "Manuel Bryennios was a Byzantine scholar active around 1300, known especially for his Harmonics. That work presents Greek mathematical music theory and preserves material from earlier authors. He also taught astronomy, including to Theodore Metochites; musical ratios and astronomical learning form the relevant context of his place in this network.", "status": "Biographical entry", "sources": [{"title": "Manuel Bryennios", "url": "https://web.olivet.edu/hathaway/genealogy.pdf"}, {"title": "Manuel Bryennios", "url": "https://en.wikipedia.org/wiki/Manuel_Bryennios"}, {"title": "Manuel Bryennios", "url": "https://de.wikipedia.org/wiki/Manuel_Bryennios"}], "color": "#8b5cf6", "incoming": [14], "outgoing": [16], "originalYear": 1310, "sourceType": "Main roster", "rank": 11, "timeline": {"year": 1310, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 16, "name": "Theodore Metochites", "aliases": ["Theodore Metochites"], "bio": "Theodore Metochites (1270–1332) combined high office in the Byzantine government with scholarship in astronomy, philosophy, and literature. He studied astronomy with Manuel Bryennios and became a teacher of Nikephoros Gregoras. His patronage of the Chora monastery is another important part of his intellectual and cultural biography.", "status": "Biographical entry", "sources": [{"title": "Theodore Metochites", "url": "https://en.wikipedia.org/wiki/Theodore_Metochites"}, {"title": "Metochites [Metoxites], Theodore [Theodoros, Theoleptos] | ISMI", "url": "https://ismi.mpiwg-berlin.mpg.de/biography/Metochites_BEA.htm"}, {"title": "Theodore Metochites | ISMI", "url": "https://ismi.mpiwg-berlin.mpg.de/node/3890450"}], "color": "#8b5cf6", "incoming": [15], "outgoing": [17, 168], "originalYear": 1320, "sourceType": "Main roster", "rank": 12, "timeline": {"year": 1320, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 17, "name": "Gregory Palamas", "aliases": ["Gregory Palamas"], "bio": "Gregory Palamas (1296–1357 or 1359, depending on the chronology used) was a Byzantine monk and theologian, later archbishop of Thessalonica. He is especially associated with hesychasm and the distinction between divine essence and energies. His presence here reflects a theological and philosophical network, not a mathematical research doctorate.", "status": "Biographical entry", "sources": [{"title": "\"Being and Naming God: Essence and Energies in St. Gregory Palamas\" by Tikhon Alexander Pino", "url": "https://epublications.marquette.edu/dissertations_mu/1054/"}, {"title": "Gregory Palamas", "url": "https://en.wikipedia.org/wiki/Gregory_Palamas"}], "color": "#8b5cf6", "incoming": [16], "outgoing": [18], "originalYear": 1340, "sourceType": "Main roster", "rank": 13, "timeline": {"year": 1340, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 18, "name": "Nilos Kabasilas", "aliases": ["Nilos Kabasilas"], "bio": "Nilus Cabasilas was a fourteenth-century Byzantine theologian associated with Thessalonica and debates between Greek and Latin Christianity. He should not be conflated with Nicholas Cabasilas. His appearance in the supplied lineage concerns teaching and theological scholarship, and those relationships need to be read in their medieval context.", "status": "Needs research", "sources": [{"title": "Nilus, Cabasilas - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd119555840.html?language=en"}, {"title": "Makarov. NILUS CABASILAS, From the Encyclopedia of Bible and Its Reception, vol. 21, 2023", "url": "https://www.academia.edu/100150405/Makarov_NILUS_CABASILAS_From_the_Encyclopedia_of_Bible_and_Its_Reception_vol_21_2023"}], "color": "#8b5cf6", "incoming": [17], "outgoing": [19], "originalYear": 1350, "sourceType": "Main roster", "rank": 14, "timeline": {"year": 1350, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 19, "name": "Demetrios Kydones", "aliases": ["Demetrios Kydones"], "bio": "Demetrios Kydones (c. 1324–1397/98) was a Byzantine statesman, scholar, and translator. His Greek translations of Latin theology, notably Thomas Aquinas, helped make scholastic arguments available in Byzantium. His career also involved diplomacy and the contentious question of relations between the Greek and Latin churches.", "status": "Biographical entry", "sources": [{"title": "An Unedited Homily on the Ascension of the Lord Attributed to Demetrios Kydones", "url": "https://www.academia.edu/165194614/An_Unedited_Homily_on_the_Ascension_of_the_Lord_Attributed_to_Demetrios_Kydones"}, {"title": "Demetrios Kydones", "url": "https://en.wikipedia.org/wiki/Demetrios_Kydones"}, {"title": "Demetrios Kydones", "url": "https://de.wikipedia.org/wiki/Demetrios_Kydones"}, {"title": "Kydones, Demetrios", "url": "https://ccel.org/ccel/schaff/encyc/encyc06/htm/iii.lxx.xl.htm"}], "color": "#8b5cf6", "incoming": [18], "outgoing": [20, 169], "originalYear": 1370, "sourceType": "Main roster", "rank": 15, "timeline": {"year": 1370, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 20, "name": "George Gemistos Plethon", "aliases": ["Georgios Plethon Gemistos"], "bio": "George Gemistos Plethon (c. 1355–1452) was a Byzantine philosopher associated with Mistra and the revival of Platonism. His visit to Italy during the Council of Ferrara–Florence brought him into contact with Italian humanists. His teaching and writings influenced Renaissance debates over Plato and Aristotle.", "status": "Biographical entry", "sources": [{"title": "Gemistus Plethon, George, active 15th century | The Online Books Page", "url": "https://onlinebooks.library.upenn.edu/webbin/who/Gemistus%20Plethon%2C%20George%2C%20active%2015th%20century"}, {"title": "Plethon, Gemistos | Encyclopedia.com", "url": "https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/plethon-gemistos"}, {"title": "CATHOLIC ENCYCLOPEDIA: Georgius Gemistus Plethon", "url": "https://www.newadvent.org/cathen/12166a.htm"}], "color": "#8b5cf6", "incoming": [19], "outgoing": [21, 170, 171, 172], "originalYear": 1410, "sourceType": "Main roster", "rank": 16, "timeline": {"year": 1410, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 21, "name": "Basilios Bessarion", "aliases": ["Basilios Bessarion"], "bio": "Bessarion (1403–1472) was a Greek scholar and churchman who became a cardinal after participating in the Council of Ferrara–Florence. He supported translators, scholars, and the preservation of Greek manuscripts. His donation of books to Venice became foundational to the Biblioteca Marciana; his Italian career began before Constantinople fell in 1453.", "status": "Biographical entry", "sources": [{"title": "BESSARION, Basilios or Johannes", "url": "https://dbcs.rutgers.edu/all-scholars/9321-bessarion-basilios"}], "color": "#ec4899", "incoming": [20], "outgoing": [22, 27, 173, 174], "originalYear": 1440, "sourceType": "Main roster", "rank": 17, "timeline": {"year": 1440, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 22, "name": "John Argyropoulos", "aliases": ["Johannes Argyropoulos"], "bio": "John Argyropoulos (c. 1415–1487) was a Byzantine humanist who taught in Italy and translated Aristotle into Latin. His teaching in Florence and Rome contributed to Renaissance study of Greek philosophy. The original file's claim that he lectured to Leonardo da Vinci is not treated here as established evidence.", "status": "Needs research", "sources": [{"title": "THE ITALIAN RENAISSANCE AND BYZANTIUM:", "url": "https://dmr.bsu.edu/digital/api/collection/ConspectusH/id/512/download"}, {"title": "Argyropoulos, John | Encyclopedia.com", "url": "https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/argyropoulos-john"}, {"title": "John Argyropoulos", "url": "https://en.wikipedia.org/wiki/John_Argyropoulos"}], "color": "#ec4899", "incoming": [21], "outgoing": [23, 175, 176, 177, 178], "originalYear": 1444, "sourceType": "Main roster", "rank": 18, "timeline": {"year": 1444, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 23, "name": "Johannes Reuchlin", "aliases": ["Johannes Kapnion Reuchlin"], "bio": "Johannes Reuchlin (1455–1522) was a German humanist, jurist, and scholar of Greek and Hebrew. His Hebrew studies and defense of Jewish books made him a central figure in early sixteenth-century intellectual controversy. His connection to Melanchthon belongs to humanist education, rather than a lineage of modern mathematics doctorates.", "status": "Biographical entry", "sources": [{"title": "CATHOLIC ENCYCLOPEDIA: Johannes Reuchlin", "url": "https://www.newadvent.org/cathen/12798a.htm"}], "color": "#ec4899", "incoming": [22, 140], "outgoing": [24, 116, 121], "originalYear": 1481, "sourceType": "Main roster", "rank": 19, "timeline": {"year": 1481, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 24, "name": "Philipp Melanchthon", "aliases": ["Philipp Melanchthon"], "bio": "Philipp Melanchthon (1497–1560) was a humanist, Protestant reformer, and educator at Wittenberg. He helped shape school and university curricula and wrote widely used textbooks, while supporting the teaching of mathematics and astronomy. His educational influence extended well beyond theology through students and institutional reforms.", "status": "Biographical entry", "sources": [{"title": "Philipp Melanchthon | Special Collections | Library | University of Leeds", "url": "https://library.leeds.ac.uk/special-collections/collection/1163/philipp_melanchthon"}, {"title": "Philipp Melanchthon", "url": "https://en.wikipedia.org/wiki/Philipp_Melanchthon"}, {"title": "Philippe Mélanchthon", "url": "https://fr.wikipedia.org/wiki/Philippe_M%C3%A9lanchthon"}], "color": "#ec4899", "incoming": [23, 141], "outgoing": [25, 116, 149, 179, 180, 181, 182, 183], "originalYear": 1514, "sourceType": "Main roster", "rank": 20, "timeline": {"year": 1514, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 25, "name": "Johannes Caselius", "aliases": ["Johannes Caselius"], "bio": "Johannes Caselius (1533–1613) was a German humanist associated with Rostock and Helmstedt. He taught classical languages and philosophy and participated in the learned culture of Protestant universities. His connection to later scholars is principally educational and philological, rather than evidence that he produced mathematical results of their kind.", "status": "Biographical entry", "sources": [{"title": "Caselius, Johannes - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz8007.html"}, {"title": "Caselius, Johannes - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd116118547.html?language=en"}, {"title": "Caselius, Johannes - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd116118547.html"}, {"title": "Johannes Caselius", "url": "https://de.wikipedia.org/wiki/Johannes_Caselius"}], "color": "#ec4899", "incoming": [24], "outgoing": [26], "originalYear": 1566, "sourceType": "Main roster", "rank": 21, "timeline": {"year": 1566, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 26, "name": "Georg Calixt", "aliases": ["Georg Calixt"], "bio": "Georg Calixt (1586–1656) was a Lutheran theologian at Helmstedt who advocated forms of Christian reconciliation grounded in early church history. His position provoked the syncretistic controversy. He belongs to the theological portion of the imported lineage and should not be described as a mathematician by association alone.", "status": "Biographical entry", "sources": [{"title": "Calixt, Georg - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz60834.html"}, {"title": "Calixt, Georg - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd118518437.html"}, {"title": "Calixt, Georg - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz60834.html?language=en"}, {"title": "Georg Calixtus", "url": "https://en.wikipedia.org/wiki/Georg_Calixtus"}], "color": "#ec4899", "incoming": [25], "outgoing": [46], "originalYear": 1607, "sourceType": "Main roster", "rank": 22, "timeline": {"year": 1607, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 27, "name": "Regiomontanus (Johannes Müller)", "aliases": ["Johannes Müller Regiomontanus"], "bio": "Regiomontanus (Johannes Müller, 1436–1476) was a mathematician and astronomer who worked in Vienna, Italy, Hungary, and Nuremberg. His trigonometric writings, astronomical tables, and printing plans supported later astronomical computation. He worked closely with Bessarion and with the Nuremberg observer Bernhard Walther.", "status": "Biographical entry", "sources": [{"title": "Regiomontanus (1436 - 1476) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Regiomontanus/"}, {"title": "encyclopedia.com", "url": "https://mathshistory.st-andrews.ac.uk/DSB/Regiomontanus.pdf"}], "color": "#ec4899", "incoming": [21], "outgoing": [28, 184], "originalYear": 1460, "sourceType": "Main roster", "rank": 18, "timeline": {"year": 1460, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 28, "name": "Domenico Maria Novara da Ferrara", "aliases": ["Domenico Maria Novara da Ferrara"], "bio": "Domenico Maria Novara (1454–1504) taught astronomy at Bologna. Copernicus studied and observed with him while in Italy, an important episode in Copernicus's astronomical education. Novara's role should be described through documented teaching and observations rather than by attributing all of his student's later ideas to him.", "status": "Biographical entry", "sources": [{"title": "Domenico Maria Novara da Ferrara", "url": "https://en.wikipedia.org/wiki/Domenico_Maria_Novara_da_Ferrara"}, {"title": "Domenico Maria Novara da Ferrara", "url": "https://it.wikipedia.org/wiki/Domenico_Maria_Novara_da_Ferrara"}], "color": "#ec4899", "incoming": [27], "outgoing": [29], "originalYear": 1490, "sourceType": "Main roster", "rank": 19, "timeline": {"year": 1490, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 29, "name": "Nicolaus Copernicus", "aliases": ["Nicolaus Copernicus"], "bio": "Nicolaus Copernicus (1473–1543) was a cathedral canon, mathematician, and astronomer educated in Krakow and Italy. His De revolutionibus placed the Earth in motion around the Sun and gave a systematic mathematical presentation of heliocentric astronomy. He received a doctorate in canon law at Ferrara in 1503, not a mathematics doctorate in 1520.", "status": "Biographical entry", "sources": [{"title": "Nicolaus Copernicus", "url": "https://plato.stanford.edu/entries/copernicus/"}, {"title": "Nicolaus Copernicus", "url": "https://plato.stanford.edu/archives/spr2017/entries/copernicus/"}, {"title": "Nicolaus Copernicus", "url": "https://plato.stanford.edu/archives/spr2019/entries/copernicus/"}, {"title": "Nicolaus Copernicus (1473 - 1543) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Copernicus/"}], "color": "#ec4899", "incoming": [28], "outgoing": [30], "originalYear": 1520, "sourceType": "Main roster", "rank": 20, "timeline": {"year": 1503, "kind": "Recorded milestone", "basis": "Canon-law doctorate, Ferrara", "estimated": false}}, {"id": 30, "name": "Georg Joachim Rheticus", "aliases": ["Georg Joachim von Leuchen Rheticus"], "bio": "Georg Joachim Rheticus (1514–1574) studied and taught at Wittenberg before working with Copernicus. His Narratio prima publicized Copernican astronomy before De revolutionibus appeared. He also undertook major trigonometric computations, continued and published after his death by Valentin Otho.", "status": "Biographical entry", "sources": [{"title": "Georg Joachim Rheticus (1514 - 1574) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Rheticus/"}, {"title": "Rheticus, Georg Joachim - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/119499215.html"}, {"title": "Rheticus, Georg Joachim - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/119499215.html?language=en"}], "color": "#ec4899", "incoming": [29], "outgoing": [40, 185, 186], "originalYear": 1540, "sourceType": "Main roster", "rank": 21, "timeline": {"year": 1540, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 31, "name": "Michel Chasles", "aliases": ["Michel Chasles"], "bio": "Michel Chasles (1793–1880) was a French geometer educated at the École Polytechnique. His work helped develop projective and enumerative geometry, and his historical writings shaped nineteenth-century accounts of geometry. The school's completion date in the original graph is not evidence of a modern Ph.D.", "status": "Biographical entry", "sources": [{"title": "Michel Chasles (1793 - 1880) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Chasles/"}, {"title": "MICHEL CHASLES   (December 15, 1793 – December 18, 1880)", "url": "https://mathshistory.st-andrews.ac.uk/Strick/chasles.pdf"}, {"title": "https://royalsocietypublishing.org/doi/pdf/10.1098/rspl.1881.0002", "url": "https://mathshistory.st-andrews.ac.uk/RS/chasles_rs.pdf"}, {"title": "encyclopedia.com", "url": "https://mathshistory.st-andrews.ac.uk/DSB/Chasles.pdf"}], "color": "#eab308", "incoming": [76], "outgoing": [32, 442, 443], "originalYear": 1814, "sourceType": "Main roster", "rank": 33, "timeline": {"year": 1814, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 32, "name": "Hubert Anson Newton", "aliases": ["H. A. (Hubert Anson) Newton"], "bio": "Hubert Anson Newton (1830–1896) was a Yale mathematician and astronomer, especially known for work on meteor showers and their relation to comets. He helped develop American mathematical scholarship and taught at Yale for decades. He is distinct from Isaac Newton; the abbreviated label in the original made identification unnecessarily difficult.", "status": "Biographical entry", "sources": [{"title": "Biography: Hubert Anson Newton | JSTOR", "url": "https://www.jstor.org/stable/2971471"}, {"title": "Newton, Hubert Anson | Encyclopedia.com", "url": "https://www.encyclopedia.com/science/dictionaries-thesauruses-pictures-and-press-releases/newton-hubert-anson"}], "color": "#06b6d4", "incoming": [31], "outgoing": [33, 444, 445, 446], "originalYear": 1850, "sourceType": "Main roster", "rank": 34, "timeline": {"year": 1850, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 33, "name": "Eliakim Hastings Moore", "aliases": ["E. H. (Eliakim Hastings) Moore"], "bio": "Eliakim Hastings Moore (1862–1932) earned his doctorate at Yale in 1885 and became a central builder of the University of Chicago mathematics department. His work ranged from algebra to foundations and general analysis. His students helped establish major American traditions in algebra, topology, and analysis.", "status": "Biographical entry", "sources": [{"title": "Eliakim Moore (1862 - 1932) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Moore_Eliakim/"}, {"title": "Eliakim Moore (1862 - 1932) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Moore_Eliakim/"}, {"title": "Guide to the Eliakim Hastings Moore Papers 1899-1931", "url": "https://www.lib.uchicago.edu/e/scrc/findingaids/view.php?eadid=ICU.SPCL.MOOREEH&q=University+of+Chicago"}], "color": "#06b6d4", "incoming": [32], "outgoing": [34, 447, 448, 449, 450, 451, 452, 453, 454, 455, 456, 457, 458, 459, 460, 461, 462, 463, 464, 465, 466, 467, 468, 469, 470, 471, 472, 473, 474, 475, 476], "originalYear": 1885, "sourceType": "Main roster", "rank": 35, "timeline": {"year": 1885, "kind": "Recorded milestone", "basis": "Doctorate, Yale", "estimated": false}}, {"id": 34, "name": "Oswald Veblen", "aliases": ["Oswald Veblen"], "bio": "Oswald Veblen (1880–1960) completed his doctorate at Chicago in 1903 under E. H. Moore. He worked on the foundations of geometry, topology, and differential geometry, and played an important institutional role at Princeton and the Institute for Advanced Study. His doctoral students included Alonzo Church.", "status": "Biographical entry", "sources": [{"title": "Oswald Veblen (1880 - 1960) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Veblen/"}, {"title": "Oswald Veblen (1880 - 1960) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Veblen/"}, {"title": "Oswald Veblen", "url": "https://mathshistory.st-andrews.ac.uk/LMS/veblen_lms_obit.pdf"}, {"title": "Oswald Veblen | Scholars | Institute for Advanced Study", "url": "https://www.ias.edu/scholars/veblen"}], "color": "#06b6d4", "incoming": [33], "outgoing": [35, 477, 478, 479, 480, 481, 482, 483, 484, 485, 486, 487, 488, 489, 490], "originalYear": 1903, "sourceType": "Main roster", "rank": 36, "timeline": {"year": 1903, "kind": "Recorded milestone", "basis": "Doctorate, Chicago", "estimated": false}}, {"id": 35, "name": "Alonzo Church", "aliases": ["Alonzo Church"], "bio": "Alonzo Church (1903–1995) earned his doctorate at Princeton under Oswald Veblen in 1927. His work on lambda calculus and undecidability became central to mathematical logic and theoretical computer science. He taught generations of logicians at Princeton and later UCLA and helped establish the Journal of Symbolic Logic.", "status": "Biographical entry", "sources": [{"title": "Alonzo Church (1903 - 1995) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Church/"}, {"title": "Alonzo Church", "url": "https://plato.stanford.edu/entries/church/index.html"}, {"title": "Alonzo Church", "url": "https://plato.stanford.edu/entries/church/"}, {"title": "Alonzo Church ’24 *27 | Princeton Alumni Weekly", "url": "https://paw.princeton.edu/memorial/alonzo-church-24-27"}], "color": "#06b6d4", "incoming": [34], "outgoing": [36, 491, 492, 493, 494, 495, 496, 497, 498, 499, 500, 501, 502, 503, 504, 505, 506, 507, 508, 509, 510, 511, 512, 513, 514, 515, 516, 517, 518, 519, 520, 521, 522, 523, 524, 525], "originalYear": 1927, "sourceType": "Main roster", "rank": 37, "timeline": {"year": 1927, "kind": "Recorded milestone", "basis": "Doctorate, Princeton", "estimated": false}}, {"id": 36, "name": "Dana Stewart Scott", "aliases": ["Dana Stewart Scott"], "bio": "Dana Scott, born in 1932, completed his Princeton doctorate under Alonzo Church in 1958. His research connects logic, set theory, automata, and the mathematical semantics of programming languages. His work with Michael Rabin on automata received the Turing Award; domain theory is another major strand of his mathematical legacy.", "status": "Needs research", "sources": [], "color": "#06b6d4", "incoming": [35], "outgoing": [37, 526, 527, 528, 529, 530, 531, 532, 533, 534, 535, 536, 537, 538, 539, 540, 541, 542, 543, 544, 545, 546, 547, 548, 549, 550, 551, 552, 553, 554, 555, 556, 557, 558, 559, 560, 561, 562, 563, 564, 565, 566, 567, 568, 569, 570, 571, 572, 573, 574, 575, 576], "originalYear": 1958, "sourceType": "Main roster", "rank": 38, "timeline": {"year": 1958, "kind": "Recorded milestone", "basis": "Doctorate, Princeton", "estimated": false}}, {"id": 37, "name": "Angus John Macintyre", "aliases": ["Angus John Macintyre"], "bio": "Angus Macintyre, born in 1941, earned his Stanford doctorate in 1968 under Dana Scott. His work in model theory connects logical methods with algebra, number theory, and exponential fields. The many branches descending from him in the supplied graph reflect this interaction between logic and mainstream algebraic mathematics.", "status": "Biographical entry", "sources": [{"title": "Angus John Macintyre | Scholars | Institute for Advanced Study", "url": "https://www.ias.edu/scholars/angus-john-macintyre"}, {"title": "Angus Macintyre", "url": "https://en.wikipedia.org/wiki/Angus_Macintyre"}, {"title": "Angus Macintyre", "url": "https://de.wikipedia.org/wiki/Angus_Macintyre"}], "color": "#14b8a6", "incoming": [36], "outgoing": [38, 577, 578, 579, 580, 581, 582, 583, 584, 585, 586, 587, 588, 589, 590, 591, 592, 593, 594, 595, 596, 597], "originalYear": 1968, "sourceType": "Main roster", "rank": 39, "timeline": {"year": 1968, "kind": "Recorded milestone", "basis": "Doctorate, Stanford", "estimated": false}}, {"id": 38, "name": "Peter Mann Winkler", "aliases": ["Peter Mann Winkler"], "bio": "Peter Winkler, born in 1946, earned his doctorate at Yale in 1975 under Angus Macintyre. He works in combinatorics, probability, and discrete mathematics and is also widely known for mathematical puzzles. His research and teaching connect the model-theory branch to the later combinatorial work represented here.", "status": "Biographical entry", "sources": [{"title": "Peter Winkler", "url": "https://en.wikipedia.org/wiki/Peter_Winkler"}], "color": "#14b8a6", "incoming": [37], "outgoing": [39, 598, 599, 600, 601, 602, 603, 604, 605], "originalYear": 1975, "sourceType": "Main roster", "rank": 40, "timeline": {"year": 1975, "kind": "Recorded milestone", "basis": "Doctorate, Yale", "estimated": false}}, {"id": 39, "name": "Zachary Hamaker", "aliases": ["Zachary Hamaker"], "bio": "Zachary Hamaker earned his doctorate at Dartmouth in 2014 under Peter Winkler. His research is in algebraic and enumerative combinatorics, including permutation statistics and combinatorial models. University of Florida records identify him as the doctoral adviser of Michael Coopman and Adam Gregory, both of whom completed doctorates in 2025.", "status": "Biographical entry", "sources": [{"title": "University of Florida — PhD alumni", "url": "https://math.ufl.edu/alumni/phd-alumni/"}, {"title": "Zachary Hamaker – College of Liberal Arts and Sciences", "url": "https://people.clas.ufl.edu/zhamaker/"}, {"title": "MHF3202 | Zachary Hamaker", "url": "https://syllabus.math.ufl.edu/wp-content/uploads/sites/133/MHF3202-Hamaker-1.pdf"}, {"title": "https://people.clas.ufl.edu/zhamaker", "url": "https://people.clas.ufl.edu/zhamaker/files/HamakerCV.pdf"}], "color": "#6366f1", "incoming": [38], "outgoing": [96, 606], "originalYear": 2014, "sourceType": "Main roster", "rank": 41, "timeline": {"year": 2014, "kind": "Recorded milestone", "basis": "Doctorate, Dartmouth", "estimated": false}}, {"id": 40, "name": "Moritz Valentin Steinmetz", "aliases": ["Moritz Valentin Steinmetz"], "bio": "Valentin Steinmetz was a sixteenth-century German scholar associated with Leipzig and the mathematical-astronomical tradition linked to Rheticus. The imported name includes “Moritz,” but variant names and dates need to be checked against a biographical authority. The original description of his influence is not sufficient evidence for a precise mentorship claim.", "status": "Needs research", "sources": [{"title": "Valentin Steinmetz", "url": "https://de.wikipedia.org/wiki/Valentin_Steinmetz"}, {"title": "Liste der Biografien/Steinm", "url": "https://de.wikipedia.org/wiki/Liste_der_Biografien/Steinm"}], "color": "#ec4899", "incoming": [30], "outgoing": [41], "originalYear": 1560, "sourceType": "Main roster", "rank": 22, "timeline": {"year": 1560, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 41, "name": "Christoph Meurer", "aliases": ["Christoph Meurer"], "bio": "Christoph Meurer (1558–1616) was a physician and mathematician associated with Leipzig. His career illustrates the close institutional connection between medicine and the mathematical sciences in early modern universities. He must be distinguished from later theologians with similar names, several of whom appear in general name searches.", "status": "Biographical entry", "sources": [{"title": "Me", "url": "https://philological.cal.bham.ac.uk/bibliography/me.html"}], "color": "#ec4899", "incoming": [40], "outgoing": [42], "originalYear": 1580, "sourceType": "Main roster", "rank": 23, "timeline": {"year": 1580, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 42, "name": "Philipp Müller", "aliases": ["Philipp Müller"], "bio": "Philipp Müller (1585–1659) was a physician, mathematician, and astronomer at Leipzig. His teaching belongs to the early modern university setting in which medicine, natural philosophy, and mathematical astronomy overlapped. He is not the contemporary historian or computer scientist of the same name.", "status": "Biographical entry", "sources": [{"title": "Müller, Philipp - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz66779.html"}, {"title": "Die Entwicklung der Mathematik an der Universität Leipzig", "url": "https://www.math.uni-leipzig.de/old/prp/2007/p1-2007.pdf"}], "color": "#ec4899", "incoming": [41], "outgoing": [48], "originalYear": 1610, "sourceType": "Main roster", "rank": 24, "timeline": {"year": 1610, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 43, "name": "Friedrich Leibniz", "aliases": ["Friedrich Leibniz"], "bio": "Friedrich Leibniz (1597–1652) was a lawyer and professor of moral philosophy at Leipzig and the father of Gottfried Wilhelm Leibniz. He died while his son was a child. His family relationship and the influence of his library should be distinguished from a formal academic-supervision relationship.", "status": "Biographical entry", "sources": [{"title": "Gottfried Wilhelm Leibniz", "url": "https://plato.stanford.edu/entries/leibniz/"}, {"title": "Gottfried Wilhelm Leibniz", "url": "https://plato.stanford.edu/archives/fall2009/entries/leibniz/"}, {"title": "Gottfried Leibniz (1646 - 1716) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Leibniz/"}, {"title": "Gottfried Wilhelm Leibniz", "url": "https://plato.stanford.edu/archives/spr2011/entries/leibniz/"}], "color": "#f97316", "incoming": [], "outgoing": [44], "originalYear": 1622, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1622, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 44, "name": "Jakob Thomasius", "aliases": ["Jakob Thomasius"], "bio": "Jakob Thomasius (1622–1684) was a philosopher and classical scholar at Leipzig and a teacher of Gottfried Wilhelm Leibniz. His writings addressed ancient philosophy and the interpretation of Aristotle. His educational importance in Leibniz's formation is more securely expressed through teaching and correspondence than through modern doctoral terminology.", "status": "Biographical entry", "sources": [{"title": "Thomasius, Jakob - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz82571.html"}, {"title": "Thomasius, Jakob - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/119238098.html?language=en"}, {"title": "Jakob Thomasius - CHIC", "url": "https://chic.caltech.edu/genealogy/jakob-thomasius/"}, {"title": "18th Century German Philosophy Prior to Kant (Stanford Encyclopedia of Philosophy/Fall 2003 Edition)", "url": "https://plato.stanford.edu/archives/fall2003/entries/18thGerman-preKant/"}], "color": "#f97316", "incoming": [43], "outgoing": [49, 187], "originalYear": 1643, "sourceType": "Main roster", "rank": 1, "timeline": {"year": 1643, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 45, "name": "Christoph Notnagel", "aliases": ["Christoph Notnagel"], "bio": "Christoph Notnagel (1607–1666) taught mathematics at Wittenberg and worked in astronomy and related mathematical subjects. His career belongs to a university culture in which theology and mathematical teaching were closely connected. The year assigned by the original visualization is not independently established here as a graduation date.", "status": "Biographical entry", "sources": [{"title": "Nottnagel, Christoph - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz72552.html"}, {"title": "Christoph Nothnagels Lehr- und Forschungstätigkeit", "url": "https://opendata.uni-halle.de/bitstream/1981185920/8171/1/Volltext_Krohn_Thomas.pdf"}], "color": "#f97316", "incoming": [], "outgoing": [46], "originalYear": 1640, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1640, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 46, "name": "Johann Andreas Quenstedt", "aliases": ["Johann Andreas Quenstedt"], "bio": "Johann Andreas Quenstedt (1617–1688) was a Lutheran theologian at Wittenberg. His Theologia didactico-polemica became an important statement of Lutheran orthodoxy. His place in this network is theological and educational; formal organization in theology is not by itself evidence of mathematical research.", "status": "Biographical entry", "sources": [{"title": "Quenstedt, Johann Andreas - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz10768.html"}, {"title": "Quenstedt, Johann Andreas - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd118743112.html?language=en"}, {"title": "Quenstedt, Johann Andreas - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd118743112.html?language=de"}, {"title": "Quenstedt, Johann Andreas - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd118743112.html"}], "color": "#f97316", "incoming": [26, 45], "outgoing": [47], "originalYear": 1644, "sourceType": "Main roster", "rank": 23, "timeline": {"year": 1644, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 47, "name": "Michael Walther, Jr.", "aliases": ["Michael Walther, Jr."], "bio": "Michael Walther the Younger (1638–1692) was a German scholar whose academic career included mathematics and theology. He is distinct from his father, the theologian Michael Walther the Elder. The original chart mixes educational dates, so no single year is presented here as a verified mathematics doctorate.", "status": "Biographical entry", "sources": [{"title": "Walther, Michael - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd117132217.html?language=en"}, {"title": "Michael Walther der Jüngere", "url": "https://de.wikipedia.org/wiki/Michael_Walther_der_J%C3%BCngere"}, {"title": "Deutsche Biographie – Onlinefassung", "url": "https://www.deutsche-biographie.de/downloadPDF?url=sfz26876.pdf"}], "color": "#f97316", "incoming": [46], "outgoing": [52], "originalYear": 1661, "sourceType": "Main roster", "rank": 24, "timeline": {"year": 1661, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 48, "name": "Erhard Weigel", "aliases": ["Erhard Weigel"], "bio": "Erhard Weigel (1625–1699) was a mathematician, astronomer, and philosopher at Jena. He promoted mathematical approaches to education and philosophical reasoning and taught the young Leibniz. His projects also included instruments and calendar reform, reflecting the practical as well as philosophical dimensions of seventeenth-century mathematics.", "status": "Biographical entry", "sources": [{"title": "Weigel, Erhard - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz26881.html"}, {"title": "Erhard Weigel", "url": "https://en.wikipedia.org/wiki/Erhard_Weigel"}, {"title": "Erhard Weigel", "url": "https://it.wikipedia.org/wiki/Erhard_Weigel"}, {"title": "Erhard Weigel", "url": "https://de.wikipedia.org/wiki/Erhard_Weigel"}], "color": "#ef4444", "incoming": [42], "outgoing": [50, 188, 189], "originalYear": 1650, "sourceType": "Main roster", "rank": 25, "timeline": {"year": 1650, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 49, "name": "Otto Mencke", "aliases": ["Otto Mencke"], "bio": "Otto Mencke (1644–1707) was a Leipzig scholar and the founding editor of Acta Eruditorum in 1682. The journal became an important vehicle for mathematical and scientific communication, including the publication of Leibniz's calculus. His significance in the network includes editorial and institutional activity as well as teaching.", "status": "Biographical entry", "sources": [{"title": "Mencke, Otto - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd119120984.html?language=de"}, {"title": "Mencke - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd13836110X.html"}, {"title": "Mencke - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd13836110X.html"}, {"title": "Otto Mencke", "url": "https://en.wikipedia.org/wiki/Otto_Mencke"}], "color": "#f97316", "incoming": [44], "outgoing": [54], "originalYear": 1665, "sourceType": "Main roster", "rank": 2, "timeline": {"year": 1665, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 50, "name": "Gottfried Wilhelm Leibniz", "aliases": ["Gottfried Wilhelm Leibniz"], "bio": "Gottfried Wilhelm Leibniz (1646–1716) developed differential and integral calculus independently of Newton and introduced enduring notation. He also worked in logic, philosophy, law, mechanics, and calculating machines. His correspondence linked many European scholars; correspondence, influence, and formal teaching should not be collapsed into a single doctoral edge.", "status": "Biographical entry", "sources": [{"title": "Gottfried Wilhelm Leibniz", "url": "https://plato.stanford.edu/entries/leibniz/index.html"}, {"title": "Gottfried Wilhelm Leibniz", "url": "https://plato.stanford.edu/entries/leibniz/"}, {"title": "Gottfried Wilhelm Leibniz", "url": "https://plato.stanford.edu/archives/fall2009/entries/leibniz/"}, {"title": "Gottfried Wilhelm Leibniz", "url": "https://plato.stanford.edu/archives/spr2011/entries/leibniz/"}], "color": "#3b82f6", "incoming": [48], "outgoing": [51, 55, 190, 191], "originalYear": 1666, "sourceType": "Main roster", "rank": 26, "timeline": {"year": 1666, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 51, "name": "Nicolas Malebranche", "aliases": ["Nicolas Malebranche"], "bio": "Nicolas Malebranche (1638–1715) was a French Oratorian philosopher who developed occasionalism and a distinctive reading of Cartesian philosophy. His best-known work is The Search After Truth. He also engaged with contemporary mathematics and natural philosophy, but his relationship to Leibniz was intellectual exchange, not doctoral supervision.", "status": "Biographical entry", "sources": [{"title": "Nicolas Malebranche", "url": "https://plato.stanford.edu/entries/malebranche/"}, {"title": "Nicolas Malebranche (1638 - 1715) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Malebranche/"}, {"title": "Nicolas Malebranche", "url": "https://plato.stanford.edu/archives/spr2015/entries/malebranche/"}, {"title": "Nicolas Malebranche (1638 - 1715) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Malebranche/"}], "color": "#3b82f6", "incoming": [50], "outgoing": [55], "originalYear": 1675, "sourceType": "Main roster", "rank": 27, "timeline": {"year": 1675, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 52, "name": "Johann Pasch", "aliases": ["Johann Pasch"], "bio": "Johann Pasch (1661–1709) is identified in authority and bibliographic records as a Wittenberg scholar. Publications name him as a presiding academic. He must be distinguished from Johann Pasch (1653–1710), the fencing and dancing master. The original unsupported claim about his special role in the algebraization of logic has been removed.", "status": "Biographical entry", "sources": [{"title": "Johann Pasch - Wikidata", "url": "https://www.wikidata.org/wiki/Q98768282"}, {"title": "Genealogy_Martin_Milo", "url": "https://pages.cs.wisc.edu/~markhill/Academic/Genealogy_Martin_Milo.pdf"}], "color": "#f97316", "incoming": [47], "outgoing": [53], "originalYear": 1683, "sourceType": "Main roster", "rank": 25, "timeline": {"year": 1683, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 53, "name": "Johann Andreas Planer", "aliases": ["Johann Andreas Planer"], "bio": "Johann Andreas Planer (c. 1665–1714) was a German mathematician associated with Wittenberg. Archival evidence identifies him there as a professor of mathematics in 1712. The original description located him at Tübingen; that location has not been retained. His publications also intersected with philosophical and historical subjects.", "status": "Biographical entry", "sources": [{"title": "Johannes Andreas Planer", "url": "https://de.wikipedia.org/wiki/Johannes_Andreas_Planer"}, {"title": "Johann Andreas Planer", "url": "https://pt.wikipedia.org/wiki/Johann_Andreas_Planer"}, {"title": "Planer", "url": "https://de.wikipedia.org/wiki/Planer"}, {"title": "Pl - Py", "url": "https://philological.cal.bham.ac.uk/bibliography/pl.html"}], "color": "#f97316", "incoming": [52], "outgoing": [68], "originalYear": 1709, "sourceType": "Main roster", "rank": 26, "timeline": {"year": 1709, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 54, "name": "Johann Christoph Wichmannshausen", "aliases": ["Johann Christoph Wichmannshausen"], "bio": "Johann Christoph Wichmannshausen (1663–1727) was a German philologist and scholar of oriental languages at Wittenberg. He earned a master's degree at Leipzig in 1685. His place in an academic genealogy records educational connections; the original suggestion that his linguistic work anticipated formal syntax was interpretive, not a documented biographical fact.", "status": "Biographical entry", "sources": [{"title": "Wichmannshausen, Johann Christoph - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd1142258467.html"}, {"title": "Wichmannshausen, Johann Christian - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd124605397.html"}, {"title": "Wichmannshausen, Johann Christian - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz64844.html"}, {"title": "Wichmannshausen, Johann Christian - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd124605397.html?language=en"}], "color": "#f97316", "incoming": [49], "outgoing": [68], "originalYear": 1685, "sourceType": "Main roster", "rank": 3, "timeline": {"year": 1685, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 55, "name": "Jacob Bernoulli", "aliases": ["Jacob Bernoulli"], "bio": "Jacob Bernoulli (1655–1705) taught mathematics at Basel and helped establish the new calculus. His posthumous Ars conjectandi developed probability, including the theorem now associated with the law of large numbers. He also studied curves and infinite series. His mathematical relationship with his younger brother Johann included both teaching and rivalry.", "status": "Biographical entry", "sources": [{"title": "Jacob Bernoulli (1655 - 1705) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Bernoulli_Jacob/"}, {"title": "Jacob Bernoulli English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/Bernoulli_Jacob.pdf"}, {"title": "Jacob Bernoulli (1655 - 1705) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Bernoulli_Jacob/"}, {"title": "Biographical Encyclopedia of Astronomers", "url": "https://mathshistory.st-andrews.ac.uk/BEA/bernoulli_jacob_bea.pdf"}], "color": "#3b82f6", "incoming": [50, 51, 142, 66], "outgoing": [67, 192, 193], "originalYear": 1684, "sourceType": "Main roster", "rank": 28, "timeline": {"year": 1684, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 56, "name": "Paul of Venice", "aliases": ["Paul of Venice"], "bio": "Paul of Venice (c. 1369–1429) was an Augustinian philosopher and logician who studied in the scholastic traditions of Oxford and Italian universities. His logical writings, including the Logica magna, were influential in late medieval education. His presence marks a philosophical and medical antecedent of later academic genealogy.", "status": "Biographical entry", "sources": [{"title": "Paul of Venice", "url": "https://plato.stanford.edu/entries/paul-venice/"}, {"title": "Paul of Venice (Stanford Encyclopedia of Philosophy/Spring 2004 Edition)", "url": "https://plato.stanford.edu/archives/spr2004/entries/paul-venice/"}, {"title": "Paul of Venice (Stanford Encyclopedia of Philosophy/Summer 2004 Edition)", "url": "https://plato.stanford.edu/archives/sum2004/entries/paul-venice/"}, {"title": "Paul of Venice (Stanford Encyclopedia of Philosophy/Spring 2002 Edition)", "url": "https://plato.stanford.edu/archives/spr2002/entries/paul-venice/"}], "color": "#3b82f6", "incoming": [], "outgoing": [57], "originalYear": 1400, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1400, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 57, "name": "Gaetano da Thiene", "aliases": ["Gaetano da Thiene"], "bio": "Gaetano da Thiene (1387–1465) was a philosopher and physician associated with Padua. His work belongs to the Aristotelian and logical teaching traditions of fifteenth-century Italy. He must be distinguished from the later Catholic saint of the same name.", "status": "Biographical entry", "sources": [{"title": "Gaetano da Thiene (philosopher)", "url": "https://en.wikipedia.org/wiki/Gaetano_da_Thiene_%28philosopher%29"}, {"title": "Gaetano da Thiene", "url": "https://en.wikipedia.org/wiki/Gaetano_da_Thiene"}, {"title": "Gaetano da Thiene (filosofo)", "url": "https://it.wikipedia.org/wiki/Gaetano_da_Thiene_%28filosofo%29"}, {"title": "Gaetano Thiene", "url": "https://it.wikipedia.org/wiki/Gaetano_Thiene"}], "color": "#3b82f6", "incoming": [56], "outgoing": [58], "originalYear": 1420, "sourceType": "Main roster", "rank": 1, "timeline": {"year": 1420, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 58, "name": "Pietro Roccabonella", "aliases": ["Pietro Roccabonella"], "bio": "Pietro Roccabonella was a fifteenth-century Italian physician associated with medical teaching in Padua. His funerary monument and historical medical records provide evidence of his career. The family included other physicians with similar names, making precise identification important when reconstructing teacher–student chains.", "status": "Biographical entry", "sources": [{"title": "Il monumento funebre di Pietro Roccabonella di Bartolomeo Bellano nella chiesa di San Francesco Grande, pp. 407-436", "url": "https://www.academia.edu/165827455/Il_monumento_funebre_di_Pietro_Roccabonella_di_Bartolomeo_Bellano_nella_chiesa_di_San_Francesco_Grande_pp_407_436"}, {"title": "Erudition, Devotion and Salvation in the Pietro Roccabonella Tomb in Padua", "url": "https://www.academia.edu/13846995/Erudition_Devotion_and_Salvation_in_the_Pietro_Roccabonella_Tomb_in_Padua"}, {"title": "Pietro Pomponazzi", "url": "https://en.wikipedia.org/wiki/Pietro_Pomponazzi"}, {"title": "Academic Genealogy - James Bullock", "url": "https://dornsife.usc.edu/james-bullock/academic-genealogy/"}], "color": "#3b82f6", "incoming": [57], "outgoing": [59], "originalYear": 1440, "sourceType": "Main roster", "rank": 2, "timeline": {"year": 1440, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 59, "name": "Niccolò Leoniceno", "aliases": ["Niccolò Leoniceno"], "bio": "Niccolò Leoniceno (1428–1524) was a physician and humanist at Ferrara. He used Greek scholarship to criticize errors in inherited medical and botanical authorities, including Pliny. His career illustrates how textual scholarship and medical teaching shaped Renaissance scientific learning.", "status": "Biographical entry", "sources": [{"title": "Niccolò Leoniceno", "url": "https://en.wikipedia.org/wiki/Niccol%C3%B2_Leoniceno"}, {"title": "Niccolò Leoniceno (1428–1524)", "url": "https://doi.org/10.1002/9780470015902.a0028953"}], "color": "#3b82f6", "incoming": [58], "outgoing": [60], "originalYear": 1453, "sourceType": "Main roster", "rank": 3, "timeline": {"year": 1453, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 60, "name": "Giovanni Battista da Monte", "aliases": ["G. B. della Monte"], "bio": "Giovanni Battista da Monte (1498–1551), also known as Johannes Baptista Montanus, was an Italian physician who taught at Padua. He is associated with clinical teaching at the patient's bedside and with influential medical commentaries. The abbreviated original label “G. B. della Monte” has been expanded to make the intended identity clear.", "status": "Biographical entry", "sources": [{"title": "DA MONTE, Giovanni Battista, dettò Montano - Enciclopedia - Treccani", "url": "https://www.treccani.it/enciclopedia/da-monte-giovanni-battista-detto-montano_%28Dizionario-Biografico%29/"}], "color": "#3b82f6", "incoming": [59], "outgoing": [61], "originalYear": 1520, "sourceType": "Main roster", "rank": 4, "timeline": {"year": 1520, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 61, "name": "Bassiano Landi", "aliases": ["Bassiano Landi"], "bio": "Bassiano Landi was a sixteenth-century physician associated with Padua. University and genealogy records connect him with medical education in the circle of Giovanni Battista da Monte and Theodor Zwinger. Detailed life dates and the precise form of supervision should be established from those records rather than inferred from the diagram.", "status": "Biographical entry", "sources": [{"title": "Bassiano Landi e Andrea Vesalio / Giuseppe Ongaro. | Wellcome Collection", "url": "https://wellcomecollection.org/works/kxbqhnex"}, {"title": "Bassiano Landi - Wikidata", "url": "https://www.wikidata.org/wiki/Q95317151"}], "color": "#3b82f6", "incoming": [60, 115], "outgoing": [62], "originalYear": 1542, "sourceType": "Main roster", "rank": 5, "timeline": {"year": 1542, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 62, "name": "Theodor Zwinger (Elder)", "aliases": ["Theodor Zwinger (Elder)"], "bio": "Theodor Zwinger the Elder (1533–1588) was a Basel physician and humanist who studied in France and Italy. His Theatrum humanae vitae was a major encyclopedic enterprise. He belongs to a family containing several later scholars of the same name; the Elder must not be conflated with the seventeenth-century theologian.", "status": "Biographical entry", "sources": [{"title": "Zwinger, Theodor - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd118773313.html"}, {"title": "Zwinger, Theodor - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz31255.html"}, {"title": "Theodor Zwinger", "url": "https://en.wikipedia.org/wiki/Theodor_Zwinger"}], "color": "#3b82f6", "incoming": [61, 145], "outgoing": [63, 146], "originalYear": 1559, "sourceType": "Main roster", "rank": 8, "timeline": {"year": 1559, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 63, "name": "Petrus Ryff", "aliases": ["Petrus Ryff"], "bio": "Petrus Ryff (1552–1629) was a Basel physician, mathematician, and chronicler. His medical degree at Basel dates to 1584, and his publications included mathematical teaching material. His career illustrates the breadth of academic roles in early modern Basel rather than a modern separation of mathematics and medicine.", "status": "Biographical entry", "sources": [{"title": "Ryff, Petrus | Archives & Special Collections", "url": "https://archives.dickinson.edu/norris-author/ryff-petrus"}, {"title": "Petrus Ryff", "url": "https://en.wikipedia.org/wiki/Petrus_Ryff"}], "color": "#3b82f6", "incoming": [62, 108], "outgoing": [64], "originalYear": 1584, "sourceType": "Main roster", "rank": 9, "timeline": {"year": 1584, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 64, "name": "Emmanuel Stupanus", "aliases": ["Emmanuel Stupanus"], "bio": "Emmanuel Stupanus (1587–1664), also known as Emanuel Stuppan, was a Basel physician and professor. He was the son of Johannes Nicolaus Stupanus. The distinction between family connection and academic teaching matters here, as does avoiding confusion with earlier members of the Basel medical community.", "status": "Biographical entry", "sources": [{"title": "Emmanuel Stupanus", "url": "https://en.wikipedia.org/wiki/Emmanuel_Stupanus"}, {"title": "Vanallen_genealogy2024", "url": "https://spacalum.rice.edu/genealogy/VanAllen_genealogy.pdf"}], "color": "#3b82f6", "incoming": [63, 146], "outgoing": [65, 66, 106, 354], "originalYear": 1613, "sourceType": "Main roster", "rank": 10, "timeline": {"year": 1613, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 65, "name": "Johann Caspar Bauhin", "aliases": ["Johann Caspar Bauhin"], "bio": "Johann Caspar Bauhin (1606–1685) belonged to the Basel Bauhin family of physicians and naturalists. He pursued medical teaching and practice. He is distinct from the botanist Caspar Bauhin and from Johann Bauhin; the repeated family names create a particular risk of false mergers in genealogical charts.", "status": "Biographical entry", "sources": [{"title": "Bauhin, Johann Caspar", "url": "https://hls-dhs-dss.ch/de/articles/025840/2002-04-09/"}, {"title": "Bauhin, Caspar - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz2287.html"}, {"title": "Bauhin, Caspar - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz2287.html?language=en"}, {"title": "Bauhin, Caspar - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd11884962X.html?language=en"}], "color": "#3b82f6", "incoming": [64], "outgoing": [66], "originalYear": 1649, "sourceType": "Main roster", "rank": 11, "timeline": {"year": 1649, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 66, "name": "Nikolaus Eglinger", "aliases": ["Nikolaus Eglinger"], "bio": "Nikolaus Eglinger (1645–1711) was a Swiss physician based in Basel. His name appears in the medical education of the Bernoulli generation. His connection to mathematical descendants comes through their medical and university training, not through a claim that his own principal work was in calculus.", "status": "Biographical entry", "sources": [{"title": "Nikolaus Eglinger", "url": "https://en.wikipedia.org/wiki/Nikolaus_Eglinger"}, {"title": "Nikolaus Eglinger", "url": "https://de.wikipedia.org/wiki/Nikolaus_Eglinger"}, {"title": "Nikolaus Eglinger", "url": "https://pt.wikipedia.org/wiki/Nikolaus_Eglinger"}], "color": "#3b82f6", "incoming": [64, 65], "outgoing": [67, 55], "originalYear": 1661, "sourceType": "Main roster", "rank": 12, "timeline": {"year": 1661, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 67, "name": "Johann Bernoulli", "aliases": ["Johann Bernoulli"], "bio": "Johann Bernoulli (1667–1748) trained in medicine before becoming a leading mathematician. He taught at Groningen and Basel and made major contributions to calculus, differential equations, and variational problems. His pupils and correspondents included Euler and l'Hôpital; these relationships had different institutional forms.", "status": "Biographical entry", "sources": [{"title": "Johann Bernoulli (1667 - 1748) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Bernoulli_Johann/"}, {"title": "Johann (II) Bernoulli (1710 - 1790) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Bernoulli_Johann%28II%29/"}, {"title": "Johann Bernoulli English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/bernoulli_johann.pdf"}, {"title": "Johann Bernoulli (1667 - 1748) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Bernoulli_Johann/"}], "color": "#3b82f6", "incoming": [66, 55], "outgoing": [69, 194, 195, 196, 197, 198], "originalYear": 1694, "sourceType": "Main roster", "rank": 29, "timeline": {"year": 1694, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 68, "name": "Christian August Hausen", "aliases": ["Christian August Hausen"], "bio": "Christian August Hausen (1693–1743) was a Leipzig mathematician and physicist. He is remembered for early experiments and publications on electricity as well as university teaching. His role in the lineage connects early modern mathematical education with the later Göttingen tradition through Kästner.", "status": "Biographical entry", "sources": [{"title": "Christian August Hausen", "url": "https://en.wikipedia.org/wiki/Christian_August_Hausen"}, {"title": "Christian A. Hausen - CHIC", "url": "https://chic.caltech.edu/genealogy/christian-august-hausen/"}], "color": "#f97316", "incoming": [53, 54], "outgoing": [70], "originalYear": 1713, "sourceType": "Main roster", "rank": 27, "timeline": {"year": 1713, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 69, "name": "Leonhard Euler", "aliases": ["Leonhard Euler"], "bio": "Leonhard Euler (1707–1783) worked in St Petersburg and Berlin and wrote across analysis, number theory, geometry, mechanics, and astronomy. His prolific publications helped establish modern mathematical notation and methods. His relationship with Lagrange was chiefly correspondence and scientific patronage, not a modern supervised doctorate.", "status": "Biographical entry", "sources": [{"title": "Leonhard Euler (1707 - 1783) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Euler/?level=1"}, {"title": "Leonhard Euler (1707 - 1783) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Euler/"}, {"title": "Leonhard Euler English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/euler.pdf"}, {"title": "Leonhard Euler | Princeton University Press", "url": "https://press.princeton.edu/books/hardcover/9780691119274/leonhard-euler"}], "color": "#3b82f6", "incoming": [67], "outgoing": [72, 199, 200, 201, 202], "originalYear": 1726, "sourceType": "Main roster", "rank": 30, "timeline": {"year": 1726, "kind": "Imported estimate", "basis":
