e. Not a degree date.", "estimated": true}}, {"id": 197, "name": "Gabriel Cramer", "aliases": ["Gabriel Cramer"], "bio": "Gabriel Cramer (1704–1752) was a Genevan mathematician who worked on algebraic curves and linear equations. His Introduction à l'analyse des lignes courbes algébriques is a major eighteenth-century treatment of algebraic curves. Cramer's rule preserves his name in elementary linear algebra.", "status": "Biographical entry", "sources": [{"title": "Gabriel Cramer (1704 - 1752) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Cramer/"}, {"title": "Gabriel Cramer (1704 - 1752) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Cramer/"}, {"title": "Gabriel Cramer", "url": "https://mathshistory.st-andrews.ac.uk/Strick/cramer.pdf"}, {"title": "encyclopedia.com", "url": "https://mathshistory.st-andrews.ac.uk/DSB/Cramer.pdf"}], "color": "#3b82f6", "incoming": [67], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 30, "timeline": {"year": 1728, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 198, "name": "Guillaume de l'Hôpital", "aliases": ["Guillaume de l'Hôpital"], "bio": "Guillaume de l'Hôpital (1661–1704) studied the new calculus with Johann Bernoulli and published an influential early calculus textbook. The rule bearing his name emerged in that teaching relationship. Private instruction and contractual arrangements are more accurate descriptions here than doctoral supervision.", "status": "Biographical entry", "sources": [{"title": "Guillaume de l'Hôpital (1661 - 1704) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/De_LHopital/"}, {"title": "Poster of Guillaume de l'Hôpital", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/De_LHopital/poster/lived/"}, {"title": "Poster of Guillaume de l'Hôpital", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/De_LHopital/poster/died/"}, {"title": "l'Hopital", "url": "https://mathshistory.st-andrews.ac.uk/Strick/de_lhopital.pdf"}], "color": "#3b82f6", "incoming": [67], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 30, "timeline": {"year": 1682, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 199, "name": "Johann Albrecht Euler", "aliases": ["Johann Albrecht Euler"], "bio": "Johann Albrecht Euler (1734–1800) was a mathematician and astronomer and the eldest son of Leonhard Euler. He worked within the Berlin and St Petersburg academic environments. His career should be recorded separately from his father's, even where family and scientific collaboration overlapped.", "status": "Biographical entry", "sources": [{"title": "Euler, Johann Albrecht", "url": "https://hls-dhs-dss.ch/fr/articles/043113/2015-12-22/"}, {"title": "Leonhard Euler (1707 - 1783) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Euler/"}, {"title": "Johann Albrecht Euler", "url": "https://de.wikipedia.org/wiki/Johann_Albrecht_Euler"}], "color": "#3b82f6", "incoming": [69], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 31, "timeline": {"year": 1767, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 200, "name": "Nicolas Fuss", "aliases": ["Nicolas Fuss"], "bio": "Nicolas Fuss (1755–1826), also known as Nikolai Fuss, was a Swiss mathematician who worked for much of his life in St Petersburg. He assisted Euler and contributed to mathematics and the work of the academy. His role combined collaboration, calculation, and institutional service.", "status": "Biographical entry", "sources": [{"title": "Nicolas Fuss", "url": "https://en.wikipedia.org/wiki/Nicolas_Fuss"}, {"title": "Nicolas Fuss", "url": "https://fr.wikipedia.org/wiki/Nicolas_Fuss"}, {"title": "Nicolas Fuss | Wellcome Collection", "url": "https://wellcomecollection.org/concepts/prdkuk8d"}], "color": "#3b82f6", "incoming": [69], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 31, "timeline": {"year": 1790, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 201, "name": "Stepan Rumovsky", "aliases": ["Stepan Rumovsky"], "bio": "Stepan Yakovlevich Rumovsky (1734–1812) was a Russian astronomer and mathematician who studied with Euler in Berlin. His work included astronomical observation and scientific education. His career illustrates the development of Russian scientific institutions in the eighteenth century.", "status": "Biographical entry", "sources": [{"title": "Stepan Rumovsky", "url": "https://en.wikipedia.org/wiki/Stepan_Rumovsky"}, {"title": "Rumovsky, Stepan Yakovlevich | Encyclopedia.com", "url": "https://www.encyclopedia.com/science/dictionaries-thesauruses-pictures-and-press-releases/rumovsky-stepan-yakovlevich"}], "color": "#3b82f6", "incoming": [69], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 31, "timeline": {"year": 1769, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 202, "name": "Anders Johan Lexell", "aliases": ["Anders Johan Lexell"], "bio": "Anders Johan Lexell (1740–1784) was an astronomer and mathematician who worked at the St Petersburg Academy. He studied celestial mechanics and cometary orbits and collaborated within Euler's scientific circle. His work connected analytical methods with astronomical observation.", "status": "Biographical entry", "sources": [{"title": "Anders Lexell (1740 - 1784) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Lexell/"}, {"title": "Anders Johan Lexell", "url": "https://en.wikipedia.org/wiki/Anders_Johan_Lexell"}, {"title": "Anders Johan Lexell", "url": "https://it.wikipedia.org/wiki/Anders_Johan_Lexell"}, {"title": "Biographical Encyclopedia of Astronomers", "url": "https://mathshistory.st-andrews.ac.uk/BEA/lexell_bea.pdf"}], "color": "#3b82f6", "incoming": [69], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 31, "timeline": {"year": 1762, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 203, "name": "Georg Christoph Lichtenberg", "aliases": ["Georg Christoph Lichtenberg"], "bio": "Georg Christoph Lichtenberg (1742–1799) taught experimental physics at Göttingen. He is remembered both for scientific work, including electrical figures, and for his notebooks and aphorisms. His career illustrates the overlap of mathematical education, experimental science, and literary culture.", "status": "Biographical entry", "sources": [{"title": "Georg Christoph Lichtenberg", "url": "https://en.wikipedia.org/wiki/Georg_Christoph_Lichtenberg"}, {"title": "Georg Christoph Lichtenberg (1742 to 1799) - Georg-August-Universität Göttingen", "url": "https://www.uni-goettingen.de/en/74905.html"}], "color": "#f97316", "incoming": [70], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 29, "timeline": {"year": 1770, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 204, "name": "Wenceslaus Johann Gustav Karsten", "aliases": ["Wenceslaus Johann Gustav Karsten"], "bio": "Wenceslaus Johann Gustav Karsten (1732–1787) was a German mathematician and university teacher. He wrote substantial mathematical teaching works and worked in the eighteenth-century university tradition represented by Kästner. His biography is distinct from later scholars of the Karsten family.", "status": "Biographical entry", "sources": [{"title": "Wenceslaus Johann Gustav Karsten (1732 - 1787) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Karsten/"}, {"title": "Wenceslaus Johann Gustav Karsten", "url": "https://en.wikipedia.org/wiki/Wenceslaus_Johann_Gustav_Karsten"}, {"title": "Wenceslaus Johann Gustav Karsten", "url": "https://de.wikipedia.org/wiki/Wenceslaus_Johann_Gustav_Karsten"}], "color": "#f97316", "incoming": [70], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 29, "timeline": {"year": 1759, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 205, "name": "Farkas Bolyai", "aliases": ["Farkas Bolyai"], "bio": "Farkas Bolyai (1775–1856) was a Hungarian mathematician and teacher and the father of János Bolyai. He pursued foundational questions in geometry and published the Tentamen. His friendship with Gauss and his son's work on non-Euclidean geometry give his biography several distinct mathematical connections.", "status": "Biographical entry", "sources": [{"title": "Farkas Bolyai (1775 - 1856) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Bolyai_Farkas/"}, {"title": "Farkas Bolyai (1775 - 1856) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Bolyai_Farkas/"}, {"title": "Farkas Bolyai (1775 - 1856) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Bolyai_Farkas/"}, {"title": "Bolyai English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/bolyai.pdf"}], "color": "#f97316", "incoming": [70], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 29, "timeline": {"year": 1810, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 206, "name": "Heinrich Brandes", "aliases": ["Heinrich Brandes"], "bio": "Heinrich Wilhelm Brandes (1777–1834) was a German physicist, astronomer, and mathematician. His work included meteorological observations and the systematic representation of weather. The expanded name distinguishes him from other people called Heinrich Brandes.", "status": "Biographical entry", "sources": [{"title": "Brandes, Heinrich Wilhelm - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz5535.html?language=en"}, {"title": "Brandes, Heinrich Wilhelm - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz5535.html"}, {"title": "Brandes, Heinrich Wilhelm (1777-1834) [HistVV]", "url": "https://histvv.uni-leipzig.de/dozenten/brandes_hw.html"}], "color": "#f97316", "incoming": [70], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 29, "timeline": {"year": 1805, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 207, "name": "Johann Erxleben", "aliases": ["Johann Erxleben"], "bio": "Johann Christian Polycarp Erxleben (1744–1777) was a Göttingen natural scientist and teacher. He wrote instructional works in physics, natural history, and veterinary subjects. His career links the mathematical educational network to the organization of the natural sciences.", "status": "Biographical entry", "sources": [{"title": "Erxleben, Johann Christian Polykarp - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd119161664.html?language=de"}, {"title": "Erxleben, Johann Christian Polykarp - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd119161664.html"}, {"title": "Johann Christian Polycarp Erxleben", "url": "https://de.wikipedia.org/wiki/Johann_Christian_Polycarp_Erxleben"}, {"title": "Johann Christian Polycarp Erxleben", "url": "https://en.wikipedia.org/wiki/Johann_Christian_Polycarp_Erxleben"}], "color": "#f97316", "incoming": [70], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 29, "timeline": {"year": 1760, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 208, "name": "Georg Klügel", "aliases": ["Georg Klügel"], "bio": "Georg Simon Klügel (1739–1812) was a German mathematician known for his mathematical dictionary and historical investigation of the parallel postulate. He taught in Helmstedt and Halle. His work helped organize both mathematical knowledge and its terminology.", "status": "Biographical entry", "sources": [{"title": "Georg Klügel (1739 - 1812) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Klugel/"}, {"title": "Georg Klügel (1739 - 1812) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Klugel/"}, {"title": "Georg Klügel (1739 - 1812) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Klugel/"}, {"title": "Klügel, Georg Simon - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd116240210.html"}], "color": "#f97316", "incoming": [70], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 29, "timeline": {"year": 1774, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 209, "name": "Johann Lambert", "aliases": ["Johann Lambert"], "bio": "Johann Heinrich Lambert (1728–1777) worked in mathematics, astronomy, optics, and philosophy. His proof of the irrationality of pi and his studies of geometry are among his best-known mathematical achievements. He was largely self-educated, so an imported adviser edge should not be read as evidence of a conventional doctorate.", "status": "Biographical entry", "sources": [{"title": "Johann Heinrich Lambert (1728 - 1777) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Lambert/"}, {"title": "Biographical Encyclopedia of Astronomers", "url": "https://mathshistory.st-andrews.ac.uk/BEA/lambert_bea.pdf"}, {"title": "Lambert, Johann Heinrich, in Gary Banham, Dennis Schulting and Nigel Hems (eds.), The Continuum Companion to Kant (London: Continuum, 2012), 99–100", "url": "https://www.academia.edu/2257471/Lambert_Johann_Heinrich_in_Gary_Banham_Dennis_Schulting_and_Nigel_Hems_eds_The_Continuum_Companion_to_Kant_London_Continuum_2012_99_100"}, {"title": "Johann Heinrich Lambert", "url": "https://en.wikipedia.org/wiki/Johann_Heinrich_Lambert"}], "color": "#f97316", "incoming": [70], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 29, "timeline": {"year": 1752, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 210, "name": "Johann Mayer", "aliases": ["Johann Mayer"], "bio": "The intended Johann Mayer is likely Johann Tobias Mayer (1752–1830), a mathematician and physicist associated with Göttingen. He must be distinguished from his father, the astronomer Tobias Mayer, and from theologians with similar names. The abbreviated original label is retained as an alias, with identification treated cautiously.", "status": "Biographical entry", "sources": [{"title": "Mayer, Johann Tobias - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd100373267.html"}, {"title": "Deutsche Biographie – Onlinefassung", "url": "https://www.deutsche-biographie.de/downloadPDF?url=sfz59513.pdf"}], "color": "#f97316", "incoming": [70], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 29, "timeline": {"year": 1787, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 211, "name": "Johann Müller", "aliases": ["Johann Müller"], "bio": "The Kästner branch's “Johann Müller” should not be identified with Regiomontanus, who lived centuries earlier. Genealogy results associate the intended node with Göttingen in 1784, and a related authority record uses Johann Nikolaus Müller. A fully matched dissertation record is still needed before attaching a detailed personal biography.", "status": "Biographical entry", "sources": [{"title": "Mathematicians Born In Germany - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Countries/Germany/"}, {"title": "Johann Nikolaus Müller - Wikidata", "url": "https://www.wikidata.org/wiki/Q102440367"}, {"title": "Abraham Kästner - The Mathematics Genealogy Project", "url": "https://genealogy.ams.org/id.php?id=66476"}], "color": "#f97316", "incoming": [70], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 29, "timeline": {"year": 1764, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 212, "name": "Bernhard Thibaut", "aliases": ["Bernhard Thibaut"], "bio": "Bernhard Friedrich Thibaut (1775–1832) was a German mathematician associated with Göttingen. His work included mathematical teaching and exposition. The genealogy record provides a starting point for a fuller reconstruction of his education and publications.", "status": "Biographical entry", "sources": [{"title": "Bernhard Friedrich Thibaut", "url": "https://de.wikipedia.org/wiki/Bernhard_Friedrich_Thibaut"}, {"title": "Bernhard Thibaut", "url": "https://pt.wikipedia.org/wiki/Bernhard_Thibaut"}, {"title": "Bernhard Thibaut - The Mathematics Genealogy Project", "url": "https://genealogy.ams.org/id.php?id=57667"}], "color": "#f97316", "incoming": [70], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 29, "timeline": {"year": 1803, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 213, "name": "Giovanni Plana", "aliases": ["Giovanni Plana"], "bio": "Giovanni Plana (1781–1864) was an Italian astronomer and mathematician associated with Turin. He studied celestial mechanics and developed a substantial theory of the Moon's motion. His education and work connect the French analytical tradition with nineteenth-century Italian astronomy.", "status": "Biographical entry", "sources": [{"title": "Giovanni Plana (1781 - 1864) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Plana/"}, {"title": "Giovanni Plana (1781 - 1864) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Plana/"}, {"title": "Giovanni Plana (1781 - 1864) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Plana/"}, {"title": "Biographical Encyclopedia of Astronomers", "url": "https://mathshistory.st-andrews.ac.uk/BEA/plana_bea.pdf"}], "color": "#eab308", "incoming": [72], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 32, "timeline": {"year": 1816, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 214, "name": "Sylvestre Lacroix", "aliases": ["Sylvestre Lacroix"], "bio": "Sylvestre François Lacroix (1765–1843) was a French mathematician and educator whose textbooks helped disseminate analysis and calculus. His books were influential internationally and presented material in a systematic instructional form. His importance is particularly visible in the history of mathematical education.", "status": "Biographical entry", "sources": [{"title": "Sylvestre Lacroix (1765 - 1843) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Lacroix/"}, {"title": "Sylvestre Lacroix (1765 - 1843) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Lacroix/"}, {"title": "The Teachers and Methods - The French Grandes Écoles - Projects - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Projects/Ayel/chapter-4/"}, {"title": "encyclopedia.com", "url": "https://mathshistory.st-andrews.ac.uk/DSB/Peacock.pdf"}], "color": "#eab308", "incoming": [72], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 32, "timeline": {"year": 1800, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 215, "name": "Sophie Germain", "aliases": ["Sophie Germain"], "bio": "Sophie Germain (1776–1831) pursued mathematics despite restrictions on women's access to formal education. She worked on number theory and elasticity and corresponded with Lagrange and Gauss. Her correspondence and intellectual mentorship should be distinguished from the doctoral degrees she was not permitted to pursue.", "status": "Biographical entry", "sources": [{"title": "Sophie Germain (1776 - 1831) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Germain/"}, {"title": "Sophie Germain (1776 - 1831) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Germain/"}, {"title": "Sophie Germain : a mathematical biography", "url": "https://scholarsbank.uoregon.edu/items/11326355-0a89-4e3f-b637-9b666defe10d"}, {"title": "Sophie Germain : a mathematical biography", "url": "https://scholarsbank.uoregon.edu/items/11326355-0a89-4e3f-b637-9b666defe10d/full"}], "color": "#eab308", "incoming": [72], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 32, "timeline": {"year": 1803, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 216, "name": "August Ferdinand Möbius", "aliases": ["August Ferdinand Möbius"], "bio": "August Ferdinand Möbius (1790–1868) was a German mathematician and astronomer associated with Leipzig. His work included projective geometry, barycentric coordinates, and number theory. The Möbius strip is one of several mathematical objects associated with his name.", "status": "Biographical entry", "sources": [{"title": "August Möbius (1790 - 1868) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Mobius/"}, {"title": "August Möbius English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/mobius.pdf"}, {"title": "Möbius, August Ferdinand - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz70729.html"}, {"title": "August Möbius English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/Mobius.pdf"}], "color": "#f97316", "incoming": [74], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 30, "timeline": {"year": 1825, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 217, "name": "Karl Mollweide", "aliases": ["Karl Mollweide"], "bio": "Karl Brandan Mollweide (1774–1825) worked in mathematics and astronomy and taught at Leipzig. He is remembered for the equal-area map projection bearing his name and for work in trigonometry. His contributions link abstract calculation with geographical representation.", "status": "Biographical entry", "sources": [{"title": "Karl Mollweide (1774 - 1825) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Mollweide/"}, {"title": "KARL B. MOLLWEIDE  (February 3, 1774 – March 10, 1825)", "url": "https://mathshistory.st-andrews.ac.uk/Strick/mollweide.pdf"}, {"title": "Mollweide, Karl Brandan - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz64947.html"}, {"title": "Mollweide, Karl Brandan - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz64947.html?language=de"}], "color": "#f97316", "incoming": [74], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 30, "timeline": {"year": 1799, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 218, "name": "Johann Christian Martin Bartels", "aliases": ["Johann Christian Martin Bartels"], "bio": "Martin Bartels (1769–1836) taught mathematics in several European settings, including Kazan and Dorpat. He was a teacher of Lobachevsky and had earlier connections with Gauss. His career illustrates the movement of mathematical instruction across national and institutional boundaries.", "status": "Biographical entry", "sources": [{"title": "Martin Bartels (1769 - 1836) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Bartels/"}, {"title": "Johann Christian Martin Bartels", "url": "https://en.wikipedia. es, Johann Georg - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/117421995.html?language=en"}, {"title": "Tralles, Johann Georg - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd117421995.html?language=en"}, {"title": "Tralles, Johann Georg", "url": "https://hls-dhs-dss.ch/de/articles/026246/2011-05-27/"}], "color": "#f97316", "incoming": [74], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 30, "timeline": {"year": 1792, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 221, "name": "Heinrich Wilhelm Droste zu Vischering", "aliases": ["Heinrich Wilhelm Droste zu Vischering"], "bio": "The name “Heinrich Wilhelm Droste zu Vischering” could not be securely matched to the mathematical student intended by the Pfaff branch. Searches return members of noble and clerical families with similar names. The original node is retained for audit purposes, but no such person's biography is silently substituted.", "status": "Needs research", "sources": [], "color": "#f97316", "incoming": [74], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 30, "timeline": {"year": 1811, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 222, "name": "Johann Grunert", "aliases": ["Johann Grunert"], "bio": "Johann August Grunert (1797–1872) was a German mathematician known for teaching and mathematical publishing, including the Archiv der Mathematik und Physik. The shortened “Johann Grunert” can retrieve unrelated earlier scholars, so those biographies are excluded.", "status": "Biographical entry", "sources": [{"title": "June 21, 2018", "url": "https://www.cl.cam.ac.uk/~lp15/Pages/Boyadzhiev%20-%20Stirling.pdf"}], "color": "#f97316", "incoming": [74], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 30, "timeline": {"year": 1832, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 223, "name": "Heinrich Schumacher", "aliases": ["Heinrich Schumacher"], "bio": "The astronomical branch appears to intend Heinrich Christian Schumacher (1780–1850), founder of Astronomische Nachrichten. He worked in astronomy and geodesy. He is distinct from Heinrich Christian Friedrich Schumacher, the botanist and physician, whose biography should not be attached to this node.", "status": "Biographical entry", "sources": [{"title": "Biographical Encyclopedia of Astronomers", "url": "https://mathshistory.st-andrews.ac.uk/BEA/clausen_bea.pdf"}], "color": "#f97316", "incoming": [74], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 30, "timeline": {"year": 1815, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 224, "name": "Friedrich Bessel", "aliases": ["Friedrich Bessel"], "bio": "Friedrich Wilhelm Bessel (1784–1846) was an astronomer and mathematician who directed the Königsberg observatory. His work included precise stellar measurements and one of the first successful determinations of stellar parallax. Bessel functions connect his mathematical investigations with later analysis and physics.", "status": "Biographical entry", "sources": [{"title": "Friedrich Wilhelm Bessel English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/Bessel.pdf"}, {"title": "Biographical Encyclopedia of Astronomers", "url": "https://mathshistory.st-andrews.ac.uk/BEA/bessel_bea.pdf"}, {"title": "Friedrich Wilhelm Bessel", "url": "https://en.wikipedia.org/wiki/Friedrich_Wilhelm_Bessel"}], "color": "#f97316", "incoming": [75], "outgoing":  geometry.", "status": "Biographical entry", "sources": [{"title": "Heinrich Scherk (1798 - 1885) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Scherk/"}, {"title": "Heinrich Scherk (1798 - 1885) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Scherk/"}, {"title": "Scherk, Heinrich Ferdinand - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd117220205.html"}, {"title": "Scherk, Heinrich Ferdinand - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/ppn117220205.html?language=en"}], "color": "#f97316", "incoming": [75], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 31, "timeline": {"year": 1833, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 227, "name": "Moritz Cantor", "aliases": ["Moritz Cantor"], "bio": "Moritz Cantor (1829–1920) was a historian of mathematics who taught at Heidelberg. His extensive historical writings helped establish the history of mathematics as an organized scholarly field. He is distinct from Georg Cantor, the creator of set theory.", "status": "Biographical entry", "sources": [{"title": "Moritz Cantor (1829 - 1920) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Cantor_Moritz/"}, {"title": "Moritz Cantor (1829 - 1920) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Cantor_Moritz/"}, {"title": "Moritz Cantor (1829 - 1920) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Cantor_Moritz/"}, {"title": "Moritz Cantor", "url": "https://en.wikipedia.org/wiki/Moritz_Cantor"}], "color": "#f97316", "incoming": [75], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 31, "timeline": {"year": 1864, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 228, "name": "Richard Dedekind", "aliases": ["Richard Dedekind"], "bio": "Richard Dedekind (1831–1916) made foundational contributions to algebra and the theory of number systems. His ideals, cuts, and structural treatment of arithmetic profoundly influenced modern mathematics. He studied at Göttingen and spent much of his career in Braunschweig.", "status": "Biographical entry", "sources": [{"title": "Richard Dedekind (1831 - 1916) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Dedekind/"}, {"title": "Richard Dedekind English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/dedekind.pdf"}, {"title": "Dedekind's Contributions to the Foundations of Mathematics", "url": "https://plato.stanford.edu/archives/spr2012/entries/dedekind-foundations/index.html"}, {"title": "Dedekind's Contributions to the Foundations of Mathematics", "url": "https://plato.stanford.edu/archives/fall2017/entries/dedekind-foundations/"}], "color": "#f97316", "incoming": [75], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 31, "timeline": {"year": 1866, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 229, "name": "Bernhard Riemann", "aliases": ["Bernhard Riemann"], "bio": "Bernhard Riemann (1826–1866) developed ideas central to complex analysis, geometry, and number theory. His doctoral work concerned complex function theory, and his later geometrical lecture transformed the study of spaces. His short career at Göttingen had consequences far beyond the size of his published corpus.", "status": "Biographical entry", "sources": [{"title": "Bernhard Riemann English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/riemann.pdf"}, {"title": "Bernhard Riemann (1826 - 1866) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Riemann/"}, {"title": "Georg Friedrich Bernhard Riemann", "url": "https://www.math.ucdavis.edu/~temple/MAT21B/Riemann-Biography.pdf"}, {"title": "Bernhard Riemann :: User Sites :: USNA", "url": "https://usna.edu/Users/math/meh/math/riemann.php"}], "color": "#f97316", "incoming": [75], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 31, "timeline": {"year": 1846, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 230, "name": "Christoph Gudermann", "aliases": ["Christoph Gudermann"], "bio": "Christoph Gudermann (1798–1851) taught mathematics at Münster and worked on special functions, particularly elliptic functions. Karl Weierstrass studied with him. His educational influence is important in the development of nineteenth-century analysis.", "status": "Biographical entry", "sources": [{"title": "Christoph Gudermann (1798 - 1851) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Gudermann/"}, {"title": "Gudermann, Christoph - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd117576042.html?language=en"}, {"title": "Gudermann, Christoph - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd117576042.html"}, {"title": "Gudermann, Christoph - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd117576042.html?language=en"}], "color": "#f97316", "incoming": [75], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 31, "timeline": {"year": 1824, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, o rt law. His career also involved theoretical physics and mathematical exposition.", "status": "Biographical entry", "sources": [{"title": "August Beer", "url": "https://en.wikipedia.org/wiki/August_Beer"}, {"title": "August Beer", "url": "https://de.wikipedia.org/wiki/August_Beer"}, {"title": "August Beer", "url": "https://fr.wikipedia.org/wiki/August_Beer"}], "color": "#f97316", "incoming": [80], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 33, "timeline": {"year": 1844, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 259, "name": "Friedrich Lange", "aliases": ["Friedrich Lange"], "bio": "Friedrich Albert Lange (1828–1875) was a philosopher and social thinker known for his History of Materialism and his role in the development of neo-Kantianism. The imported Plücker relationship needs a directly matched educational record; it should not transform his biography into that of a research mathematician.", "status": "Needs research", "sources": [{"title": "Friedrich Albert Lange", "url": "https://plato.stanford.edu/Entries/friedrich-lange/"}, {"title": "Friedrich Albert Lange", "url": "https://plato.stanford.edu/archives/spr2020/entries/friedrich-lange/index.html"}, {"title": "Friedrich Albert Lange", "url": "https://de.wikipedia.org/wiki/Friedrich_Albert_Lange"}, {"title": "Friedrich Albert Lange | Encyclopedia.com", "url": "https://www.encyclopedia.com/history/historians-and-chronicles/historians-miscellaneous-biographies/friedrich-albert-lange"}], "color": "#f97316", "incoming": [80], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 33, "timeline": {"year": 1851, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 260, "name": "Diederik Korteweg", "ali warz (1843 - 1921) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Schwarz/"}], "color": "#ef4444", "incoming": [82], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 35, "timeline": {"year": 1878, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 262, "name": "Carl Runge", "aliases": ["Carl Runge"], "bio": "Carl Runge (1856–1927) was a German mathematician whose work connected analysis, numerical methods, and spectroscopy. Runge–Kutta methods and Runge approximation are enduring parts of his legacy. He helped establish applied mathematics at Göttingen.", "status": "Biographical entry", "sources": [{"title": "Carl Runge (1856 - 1927) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Runge/"}, {"title": "Carl Runge (1856 - 1927) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Runge/"}, {"title": "Carl Runge: \"Graphical Methods\" - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Extras/Runge_Graphical_Methods/"}, {"title": "Biographical Encyclopedia of Astronomers", "url": "https://mathshistory.st-andrews.ac.uk/BEA/runge_bea.pdf"}], "color": "#ef4444", "incoming": [82], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 35, "timeline": {"year": 1891, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 263, "name": "Woldemar Voigt", "aliases": ["Woldemar Voigt"], "bio": "Woldemar Voigt (1850–1919) was a German mathematical physicist associated with Göttingen. His work included elasticity, crystal physics, and electromagnetic theory. His doctoral background must be distinguished from broader scientific contacts recorded in genealogy-style diagrams.", "status": "Biographical entry", "sources": [{"title": "Voigt, Woldemar - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/117478008.html?language=en"}, {"title": "Woldemar Voigt", "url": "https://en.wikipedia.org/wiki/Woldemar_Voigt"}, {"title": "Woldemar Voigt (engineer)", "url": "https://en.wikipedia.org/wiki/Woldemar_Voigt_%28engineer%29"}, {"title": "Woldemar Voigt (Physiker)", "url": "https://de.wikipedia.org/wiki/Woldemar_Voigt_%28Physiker%29"}], "color": "#ef4444", "incoming": [82], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 35, "timeline": {"year": 1884, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 264, "name": "Friedrich Robert Helmert", "aliases": ["Friedrich Robert Helmert"], "bio": "Friedrich Robert Helmert (1843–1917) was a German geodesist who worked on measurement, errors, and the mathematical foundations of surveying. His writings helped establish modern geodesy. His place in the tree reflects the role of mathematics in precision measurement of the Earth.", "status": "Biographical entry", "sources": [{"title": "Helmert, Robert - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/118773879.html"}, {"title": "Friedrich Robert Helmert", "url": "https://en.wikipedia.org/wiki/Friedrich_Robert_Helmert"}, {"title": "Friedrich Robert Helmert", "url": "https://it.wikipedia.org/wiki/Friedrich_Robert_Helmert"}, {"title": "Friedrich Robert Helmert", "url": "https://es.wikipedia.org/wiki/Friedrich_Robert_Helmert"}], "color": "#ef4444", "incoming": [82], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 35, "timeline": {"year": 1878, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 265, "name": "Albrecht Emmerich", "aliases": ["Albrecht Emmerich"], "bio": "Albrecht Emmerich wrote on triangle geometry, including a 1891 treatment of Brocard configurations and related points and circles. Bibliographic records establish this concrete mathematical activity. A fuller personal biography and verified doctoral relationship remain to be documented.", "status": "Needs research", "sources": [{"title": "Rudolf Lipschitz - Wikidata", "url": "https://www.wikidata.org/wiki/Q77322"}], "color": "#ef4444", "incoming": [82], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 35, "timeline": {"year": 1878, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 266, "name": "Oscar Knoblauch", "aliases": ["Oscar Knoblauch"], "bio": "Oskar Knoblauch (1862–1938) was a German physicist whose work included heat and the properties of steam. His publications connect mathematical methods with thermophysical measurement. He is distinct from the physicist Hermann Knoblauch.", "status": "Biographical entry", "sources": [{"title": "Oskar Knoblauch", "url": "https://de.wikipedia.org/wiki/Oskar_Knoblauch"}], "color": "#ef4444", "incoming": [82], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 35, "timeline": {"year": 1897, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 267, "name": "Ferdinand von Lindemann", "aliases": ["Ferdinand von Lindemann"], "bio": "Ferdinand von Lindemann (1852–1939) proved the transcendence of pi, settling the impossibility of squaring the circle with classical straightedge-and-compass constructions. He studied under Klein and later held professorships in Germany. His teaching connected him to several later mathematical generations.", "status": "Biographical entry", "sources": [{"title": "Ferdinand von Lindemann (1852 - 1939) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Lindemann/"}, {"title": "Ferdinand von Lindemann", "url": "https://mathshistory.st-andrews.ac.uk/Strick/lindemann.pdf"}, {"title": "Ferdinand von Lindemann (1852 - 1939) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Lindemann/"}, {"title": "Ferdinand von Lindemann", "url": "https://en.wikipedia.org/wiki/Ferdinand_von_Lindemann"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1887, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 268, "name": "Grace Chisholm Young", "aliases": ["Grace Chisholm Young"], "bio": "Grace Chisholm Young (1868–1944) earned a doctorate at Göttingen under Felix Klein in 1895. Her work in analysis included substantial collaboration with William Henry Young. Her career is important both mathematically and in the history of women's access to doctoral study.", "status": "Biographical entry", "sources": [{"title": "Grace Chisholm (1868 - 1944) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Chisholm_Young/"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1895, "kind": "Recorded milestone", "basis": "Doctorate, Göttingen", "estimated": false}}, {"id": 269, "name": "Ludwig Bieberbach", "aliases": ["Ludwig Bieberbach"], "bio": "Ludwig Bieberbach (1886–1982) worked in complex analysis, geometry, and crystallographic groups. His conjecture on univalent functions became a major twentieth-century problem. His biography also includes his support for National Socialism and his role in the persecution and exclusion of fellow mathematicians.", "status": "Biographical entry", "sources": [{"title": "Ludwig Bieberbach (1886 - 1982) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Bieberbach/"}, {"title": "Bieberbach, Ludwig - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/dbo012091-5.html"}, {"title": "Bieberbach, Ludwig - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/116162961.html"}, {"title": "Bieberbach, Ludwig - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd116162961.html?language=en"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1921, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 270, "name": "Maxime Bôcher", "aliases": ["Maxime Bôcher"], "bio": "Maxime Bôcher (1867–1918) was an American analyst who earned his doctorate at Göttingen under Klein. He taught at Harvard and worked on differential equations and related analysis. The American Mathematical Society's Bôcher Memorial Prize commemorates his mathematical contributions.", "status": "Biographical entry", "sources": [{"title": "Maxime Bôcher (1867 - 1918) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Bocher/"}, {"title": "Maxime Bôcher (1867 - 1918) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Bocher/"}, {"title": "M Bôcher: \"Integral equations\" - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Extras/Bocher_integral_equations/"}, {"title": "encyclopedia.com", "url": "https://mathshistory.st-andr matician known for work on automorphic and elliptic functions. He collaborated with Klein on major mathematical treatises. His publications helped develop and disseminate the function-theoretic side of Klein's program.", "status": "Biographical entry", "sources": [{"title": "Robert Fricke (1861 - 1930) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Fricke/"}, {"title": "Robert Fricke (1861 - 1930) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Fricke/"}, {"title": "Letters from William Burnside to Robert Fricke: automorphic functions, and the emergence of the Burnside Problem", "url": "https://www.academia.edu/21815734/Letters_from_William_Burnside_to_Robert_Fricke_automorphic_functions_and_the_emergence_of_the_Burnside_Problem"}, {"title": "Robert Fricke", "url": "https://en.wikipedia.org/wiki/Robert_Fricke"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1895, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 277, "name": "Axel Harnack", "aliases": ["Axel Harnack"], "bio": "Axel Harnack (1851–1888) was a mathematician who worked in real and complex analysis and algebraic geometry. Harnack's inequality and results on real algebraic curves bear his name. His career illustrates the close interaction of analysis and geometry in the late nineteenth century.", "status": "Biographical entry", "sources": [{"title": "Axel Harnack (1851 - 1888) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Harnack/"}, {"title": "Axel Harnack (1851 - 1888) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Harnack/"}, {"title": "Axel Harnack (1851 - 1888) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Harnack/"}, {"title": "Harnack, Axel - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz26069.html"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1869, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 278, "name": "Mellen Haskell", "aliases": ["Mellen Haskell"], "bio": "Mellen Woodman Haskell (1863–1948) was an American mathematician who taught at Berkeley from 1890 to 1933. His work included geometry and group theory. His training in Germany contributed to the development of mathematics on the American West Coast.", "status": "Biographical entry", "sources": [{"title": "Mellen Woodman Haskell (1863-1948)", "url": "https://siarchives.si.edu/collections/siris_arc_393474"}, {"title": "Mellen Woodman Haskell", "url": "https://en.wikipedia.org/wiki/Mellen_Woodman_Haskell"}, {"title": "inmemoriam1948", "url": "https://digicoll.lib.berkeley.edu/record/81372/files/inmemoriam1948.pdf"}, {"title": "Department Chairs | Department of Mathematics", "url": "https://math.berkeley.edu/node/525"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1898, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 279, "name": "Alexander Ostrowski", "aliases": ["Alexander Ostrowski"], "bio": "Alexander Ostrowski (1893–1986) made contributions to algebra, analysis, and numerical mathematics. He worked on valuations, functional equations, and questions of convergence. His career included a long professorship at Basel.", "status": "Biographical entry", "sources": [{"title": "Alexander Ostrowski (1893 - 1986) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Ostrowski/"}, {"title": "Alexander Ostrowski (1893 - 1986) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Ostrowski/"}, {"title": "Alexander Ostrowski (1893 - 1986) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Ostrowski/"}, {"title": "Alexander M. Ostrowski (1893–1986):", "url": "https://cs.purdue.edu/homes/wxg/AMOengl.pdf"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1928, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 280, "name": "Julio Rey Pastor", "aliases": ["Julio Rey Pastor"], "bio": "Julio Rey Pastor (1888–1962) was a Spanish mathematician who played a major role in the development of mathematics in Spain and Argentina. He worked in geometry and analysis and wrote influential textbooks. His studies in Germany were part of a broader international formation, not necessarily a doctorate with Klein.", "status": "Biographical entry", "sources": [{"title": "Julio Rey Pastor (1888 - 1962) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Rey_Pastor/"}, {"title": "Julio Rey Pastor (1888 - 1962) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Rey_Pastor/"}, {"title": "Julio Rey Pastor", "url": "https://en.wikipedia.org/wiki/Julio_Rey_Pastor"}, {"title": "Julio Rey Pastor", "url": "https://de.wikipedia.org/wiki/Julio_Rey_Pastor"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1923, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 281, "name": "Hermann Rothe", "aliases": ["Hermann Rothe"], "bio": "Hermann Rothe (1882–1923) was an Austrian mathematician whose work included geometry and Grassmann's theory of extension. He also taught mathematics and participated in Vienna's mathematical community. His biography belongs to the algebraic-geometric side of the network.", "status": "Biographical entry", "sources": [{"title": "Lectures to the Mathematical Society of Vienna - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Honours/Lectures_Vienna_Math_Soc/"}, {"title": "Hermann Rothe", "url": "https://en.wikipedia.org/wiki/Hermann_Rothe"}, {"title": "Hermann Rothe (Mathematiker)", "url": "https://de.wikipedia.org/wiki/Hermann_Rothe_%28Mathematiker%29"}, {"title": "Hermann Rothe", "url": "https://fr.wikipedia.org/wiki/Hermann_Rothe"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1902, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 282, "name": "Friedrich Schilling", "aliases": ["Friedrich Schilling"], "bio": "Friedrich Georg Schilling (1868–1950) was a German mathematician associated with geometry and mathematical models. His career included university teaching and the visualization of geometrical structures. The expanded given name helps distinguish him from namesakes.", "status": "Biographical entry", "sources": [{"title": "Friedrich Schilling", "url": "https://en.wikipedia.org/wiki/Friedrich_Schilling"}, {"title": "Friedrich Schilling (Mathematiker)", "url": "https://de.wikipedia.org/wiki/Friedri ch.", "status": "Biographical entry", "sources": [{"title": "Edward Van Vleck (1863 - 1943) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Van_Vleck/"}, {"title": "Edward Van Vleck (1863 - 1943) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Van_Vleck/"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1898, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 285, "name": "Walther von Dyck", "aliases": ["Walther von Dyck"], "bio": "Walther von Dyck (1856–1934) worked on groups, geometry, and mathematical education. His formulation of groups by generators and relations is particularly significant. His career at Munich also included major institutional and museum-related work.", "status": "Biographical entry", "sources": [{"title": "Walther von Dyck (1856 - 1934) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Von_Dyck/"}, {"title": "Walther von Dyck (1856 - 1934) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Von_Dyck/"}, {"title": "Walther von Dyck (1856 - 1934) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Von_Dyck/"}, {"title": "Search results for: Dyck, Walther von 1856-1934, page 1 | Collections Search Center, Smithsonian Institution", "url": "https://collections.si.edu/search/results.htm?q=%22Dyck%2C+Walther+von+1856-1934%22"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1891, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 286, "name": "Philipp Furtwängler", "aliases": ["Philipp Furtwängler"], "bio": "Philipp Furtwängler (1869–1940) was a German-Austrian mathematician who worked in number theory. He taught at Vienna and contributed to algebraic number theory and the study of reciprocity and ideal classes. He should not be confused with other prominent members of the Furtwängler family.", "status": "Biographical entry", "sources": [{"title": "Philipp Furtwängler (1869 - 1940) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Furtwangler/"}, {"title": "Furtwängler, Philipp - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz18109.html"}, {"title": "Furtwängler, Philipp - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd116878177.html?language=en"}, {"title": "Furtwängler, Philipp - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd116878177.html?language=de"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1904, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 287, "name": "Adolf Hurwitz", "aliases": ["Adolf Hurwitz"], "bio": "Adolf Hurwitz (1859–1919) worked in complex analysis, number theory, and algebra. His studies of Riemann surfaces and function theory produced several enduring theorems. He taught in Königsberg and Zürich and influenced a wide range of later mathematics.", "status": "Biographical entry", "sources": [{"title": "Adolf Hurwitz (1859 - 1919) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Hurwitz/"}, {"title": "Adolf Hurwitz English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/Hurwitz.pdf"}, {"title": "Adolf Hurwitz English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/hurwitz.pdf"}, {"title": "Adolf Hurwitz (1859 - 1919) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Hurwitz/"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1889, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 288, "name": "Edward Kasner", "aliases": ["Edward Kasner"], "bio": "Edward Kasner (1878–1955) was an American mathematician who taught at Columbia and worked in differential geometry. He also wrote for wider audiences and helped popularize the term “googol.” His formal doctorate was at Columbia under Frank Nelson Cole, so the imported Klein connection is not labeled a doctoral edge.", "status": "Biographical entry", "sources": [{"title": "Edward Kasner (1878 - 1955) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Kasner/"}, {"title": "Edward Kasner (1878 - 1955) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Kasner/"}, {"title": "Edward Kasner (1878 - 1955) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Kasner/"}, {"title": "Poster of Edward Kasner", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Kasner/poster/died/"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1913, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 289, "name": "William E. Story", "aliases": ["William E. Story"], "bio": "William Edward Story (1850–1930) was an American mathematician who helped develop mathematics at Johns Hopkins and Clark. His work included algebra and geometry. His institutional and teaching activity was important in establishing American graduate mathematics.", "status": "Biographical entry", "sources": [{"title": "William Story (1850 - 1930) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Story/"}, {"title": "Story Clark University - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Extras/Story_Clark_University/"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1885, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 290, "name": "Arnold Sommerfeld", "aliases": ["Arnold Sommerfeld"], "bio": "Arnold Sommerfeld (1868–1951) was a theoretical physicist whose work and teaching helped shape modern atomic physics. He trained a remarkable group of later physicists in Munich. His mathematical education is relevant to the chart, but his doctoral adviser was Ferdinand von Lindemann rather than Klein.", "status": "Biographical entry", "sources": [{"title": "Arnold Sommerfeld (1868 - 1951) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Sommerfeld/"}, {"title": "sci_hi", "url": "https://mathshistory.st-andrews.ac.uk/SH/sommerfeld_sh.pdf"}, {"title": "Some Reflections on Arnold Sommerfeld—Theoretical Physicist, Teacher, Influencer [Historically Speaking]", "url": "https://www.academia.edu/119777499/Some_Reflections_on_Arnold_Sommerfeld_Theoretical_Physicist_Teacher_Influencer_Historically_Speaking_"}, {"title": "Arnold Sommerfeld", "url": "https://en.wikipedia.org/wiki/Arnold_Sommerfeld"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1903, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 291, "name": "Eduard Study", "aliases": ["Eduard Study"], "bio": "Eduard Study (1862–1930) worked on geometry, invariant theory, and the algebraic representation of spatial motions. His use of algebraic systems in geometry anticipated later mathematical tools. His doctorate was at Munich, and the exact role of Klein in his education should be distinguished from formal supervision.", "status": "Biographical entry", "sources": [{"title": "Eduard Study (1862 - 1930) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Study/"}, {"title": "Eduard Study (1862 - 1930) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Study/"}, {"title": "Poster of Eduard Study", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Study/poster/lived/"}, {"title": "Poster of Eduard Study", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Study/poster/born/"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1896, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 292, "name": "William F. Osgood", "aliases": ["William F. Osgood"], "bio": "William Fogg Osgood (1864–1943) was an American analyst who studied in Germany and taught at Harvard. His work included complex analysis and function theory. His textbooks and teaching helped establish rigorous analysis in the United States.", "status": "Biographical entry", "sources": [{"title": "American Mathematical Society Colloquium - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Extras/AMS_Colloquium/"}, {"title": "William Fogg Osgood", "url": "https://en.wikipedia.org/wiki/William_Fogg_Osgood"}, {"title": "William Fogg Osgood", "url": "https://de.wikipedia.org/wiki/William_Fogg_Osgood"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1899, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 293, "name": "Arthur Schoenflies", "aliases": ["Arthur Schoenflies"], "bio": "Arthur Schoenflies (1853–1928) worked in geometry, crystallography, and topology. He contributed to the classification of crystallographic groups and to foundational questions about sets and plane topology. His name is associated with the Schoenflies theorem.", "status": "Biographical entry", "sources": [{"title": "Arthur Schönflies (1853 - 1928) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Schonflies/"}, {"title": "Arthur Schönflies (1853 - 1928) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Schonflies/"}, {"title": "Schoenflies, Arthur - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz97760.html?language=en"}, {"title": "Schoenflies, Arthur - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/ppn116868260.html?language=en"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1888, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 294, " atics Genealogy Project", "url": "https://genealogy.ams.org/id.php?id=7401"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1893, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 301, "name": "Josef Diekmann", "aliases": ["Josef Diekmann"], "bio": "Josef Diekmann wrote an introduction to determinants and their applications for use in schools and self-study, published in the nineteenth century. That bibliographic record supplies a specific contribution to mathematical teaching. Further personal details require identification through university or archival records.", "status": "Needs research", "sources": [], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1893, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 302, "name": "Paul Domsch", "aliases": ["Paul Domsch"], "bio": "Paul Domsch appears in Klein's mathematical genealogy and in Göttingen correspondence holdings under Paul Richard Domsch. Those records are the starting point for his biography. Modern family-history and similarly named faculty records are not used as substitutes.", "status": "Biographical entry", "sources": [{"title": "C. Felix Klein - The Mathematics Genealogy Project", "url": "https://genealogy.ams.org/id.php?id=7401"}, {"title": "Niedersächsische Staats- und Universitätsbibliothek Göttingen", "url": "https://www.sub.uni-goettingen.de/fileadmin/media/texte/spezialsammlungen/Nachl%C3%A4sse/Klein.pdf"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1893, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 303, "name": "Friedrich Engel", "aliases": ["Friedrich Engel"], "bio": "Friedrich Engel (1861–1941) worked on Lie groups and differential equations and collaborated closely with Sophus Lie. He helped organize and publish Lie's theory. His mathematical career included teaching in Leipzig, Greifswald, and Giessen.", "status": "Biographical entry", "sources": [{"title": "Friedrich Engel (1861 - 1941) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Engel/"}, {"title": "Friedrich Engel (1861 - 1941) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Engel/"}, {"title": "Friedrich Engel (mathematician)", "url": "https://en.wikipedia.org/wiki/Friedrich_Engel_%28mathematician%29"}, {"title": "Friedrich Engel", "url": "https://en.wikipedia.org/wiki/Friedrich_Engel"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1896, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 304, "name": "Ernst Fiedler", "aliases": ["Ernst Fiedler"], "bio": "Ernst Fiedler (1861–1954) was a Swiss mathematician and teacher associated with Zürich. He worked in geometry and mathematical education. His career belongs to the Swiss continuation of the nineteenth-century German-speaking geometrical tradition.", "status": "Biographical entry", "sources": [{"title": "Ernst Fiedler (1861 - 1954) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Fiedler_Ernst/"}, {"title": "Wilhelm Fiedler (1832 - 1912) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory. he Biographie", "url": "https://www.deutsche-biographie.de/sfz16552.html"}, {"title": "Föppl, August - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd11663510X.html"}, {"title": "August Föppl", "url": "https://en.wikipedia.org/wiki/August_F%C3%B6ppl"}, {"title": "August Föppl", "url": "https://de.wikipedia.org/wiki/August_F%C3%B6ppl"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1889, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 307, "name": "Georg Friedrich", "aliases": ["Georg Friedrich"], "bio": "“Georg Friedrich” is too ambiguous to support a reliable personal identification in the Klein branch. It may be an incomplete or transposed name. The original node remains visible, with its biography unresolved rather than conflated with the philosopher Georg Friedrich Meier.", "status": "Needs research", "sources": [{"title": "Felix Klein (1849 - 1925) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Klein/"}, {"title": "The Princeton Companion to Mathematics", "url": "https://sites.math.rutgers.edu/~zeilberg/akherim/PCM.pdf"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1893, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 308, "name": "Joseph Gierster", "aliases": ["Joseph Gierster"], "bio": "Joseph Gierster was a nineteenth-century mathematician connected with algebraic work in Klein's circle. Bibliographic references link him to the period's study of equations and groups. A fuller personal account requires a dedicated dissertation or authority
