 birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 320, "name": "Otto Pfitzner", "aliases": ["Otto Pfitzner"], "bio": "Otto Pfitzner appears in authority records under Otto Paul Pfitzner or Paul Pfitzner, with a Leipzig doctorate in 1884 linked to Klein. This is distinct from the composer Hans Pfitzner. A fuller life history remains to be established.", "status": "Needs research", "sources": [{"title": "Paul Pfitzner - Wikidata", "url": "https://www.wikidata.org/wiki/Q102203546"}, {"title": "C. Felix Klein - The Mathematics Genealogy Project", "url": "https://genealogy.ams.org/id.php?id=7401"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1893, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 321, "name": "Willibald Reichardt", "aliases": ["Willibald Reichardt"], "bio": "Willibald Reichardt worked in Klein's mathematical circle on algebraic equations and related function theory. Scholarly history places him in Klein's Leipzig seminar in 1885. Bibliographic records also connect his name with Kummer surfaces and hyperelliptic functions; exact identity and dissertation details deserve further checking.", "status": "Biographical entry", "sources": [{"title": "Niedersächsische Staats- und Universitätsbibliothek Göttingen", "url": "https://www.sub.uni-goettingen.de/fileadmin/media/texte/spezialsammlungen/Nachl%C3%A4sse/Klein.pdf"}, {"title": "C. Felix Klein - The Mathematics Genealogy Project", "url": "https://genealogy.ams.org/id.php?id=7401"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1893, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 322, "name": "Ernst Ritter", "aliases": ["Ernst Ritter"], "bio": "Ernst Ritter (1867–1895) worked in complex function theory and was connected with Klein's Göttingen circle. He died young while traveling to take up a position at Cornell. His short career nevertheless forms a distinct episode in the transfer of German mathematical training to American universities.", "status": "Biographical entry", "sources": [{"title": "About Ernst Ritter | pi.math.cornell.edu", "url": "https://www2.math.cornell.edu/m/node/7264"}, {"title": "Ernst Ritter (Agrarwissenschaftler)", "url": "https://de.wikipedia.org/wiki/Ernst_Ritter_%28Agrarwissenschaftler%29"}, {"title": "Ernst Ritter (Mediziner)", "url": "https://de.wikipedia.org/wiki/Ernst_Ritter_%28Mediziner%29"}, {"title": "Sesquicentennial Historical Notes, Chapter I: 1865-1895 | Department of Mathematics", "url": "https://math.cornell.edu/historical-notes-chapter-1"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1881, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 323, "name": "Karl Rohn", "aliases": ["Karl Rohn"], "bio": "Karl Rohn (1855–1920) was a German geometer who studied algebraic curves and surfaces. He taught in Dresden and Leipzig and was associated with the visual and constructive traditions of geometry. His work remains part of the history of real algebraic geometry.", "status": "Biographical entry", "sources": [{"title": "Karl Rohn (1855 - 1920) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Rohn/"}, {"title": "Karl Rohn", "url": "https://en.wikipedia.org/wiki/Karl_Rohn"}, {"title": "Karl Rohn", "url": "https://de.wikipedia.org/wiki/Karl_Rohn"}, {"title": "Karl Rohn", "url": "https://es.wikipedia.org/wiki/Karl_Rohn"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1887, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 324, "name": "Karl Schellenberg", "aliases": ["Karl Schellenberg"], "bio": "The Klein branch's Karl Schellenberg needs to be distinguished from earlier publishers and other namesakes. The imported genealogy supplies an academic context, but a securely matched personal biography has not been established. No dates from unrelated family records are adopted.", "status": "Needs research", "sources": [{"title": "Karl Schellenberg", "url": "https://de.wikipedia.org/wiki/Karl_Schellenberg"}, {"title": "Karl Schellenberg - Wikidata", "url": "https://www.wikidata.org/wiki/Q102156242"}, {"title": "Guide to the University of Chicago Press Records 1892-1965", "url": "https://www.lib.uchicago.edu/e/scrc/findingaids/view.php?eadid=ICU.SPCL.PRESSTEST&q=Jewish"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1893, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 325, "name": "Victor Schlegel", "aliases": ["Victor Schlegel"], "bio": "Victor Schlegel (1843–1905) worked in geometry and promoted the ideas of Hermann Grassmann. Schlegel diagrams provide a way of representing higher-dimensional polytopes in lower dimensions. His career also included school teaching and mathematical exposition.", "status": "Biographical entry", "sources": [{"title": "Grassmann", "url": "https://mathshistory.st-andrews.ac.uk/Strick/grassmann.pdf"}, {"title": "Victor Schlegel", "url": "https://en.wikipedia.org/wiki/Victor_Schlegel"}, {"title": "Victor Schlegel", "url": "https://de.wikipedia.org/wiki/Victor_Schlegel"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1874, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 326, "name": "Johannes Schröder", "aliases": ["Johannes Schröder"], "bio": "An authority record identifies Johannes Schröder as a German mathematician (1865–1937) connected with Klein. The name is also associated with the expanded form Johannes Karl August Schröder. Further academic details require direct confirmation from his dissertation or university records.", "status": "Biographical entry", "sources": [{"title": "Johannes Schröder - Wikidata", "url": "https://www.wikidata.org/wiki/Q94907820"}, {"title": "Johannes Schröder", "url": "https://de.wikipedia.org/wiki/Johannes_Schr%C3%B6der"}, {"title": "Prof. Dr. Johannes Schröder - Marsilius-Kolleg", "url": "https://www.marsilius-kolleg.uni-heidelberg.de/de/forschung/fellows/fellow-klasse-200910/prof-dr-johannes-schroeder"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1900, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 327, "name": "Otto Staude", "aliases": ["Otto Staude"], "bio": "Otto Staude (1857–1928) was a German mathematician who worked in geometry and mathematical physics. His career included teaching in several European university settings. His geometrical work is part of the later nineteenth-century tradition represented by Klein's branch.", "status": "Biographical entry", "sources": [{"title": "Wilhelm Ahrens (1872 - 1927) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Ahrens/"}, {"title": "Piers Bohl (1865 - 1921) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Bohl/"}, {"title": "Otto Staude", "url": "https://de.wikipedia.org/wiki/Otto_Staude"}, {"title": "Otto Staude", "url": "https://pt.wikipedia.org/wiki/Otto_Staude"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1892, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 328, "name": "Henry Thompson", "aliases": ["Henry Thompson"], "bio": "The intended Henry Thompson is Henry Dallas Thompson, an American mathematics professor associated with Princeton. He is distinct from the British surgeon Henry Thompson and the educator Henry Adams Thompson. The expanded name is essential to reconstructing his academic biography.", "status": "Biographical entry", "sources": [{"title": "Elementary Solid Geometry and Mensuration. By Professor Henry Dallas Thompson, D.Sc, Ph.D. (Macmillan, 1896. Price 6s.)", "url": "https://www.cambridge.org/core/journals/mathematical-gazette/article/abs/elementary-solid-geometry-and-mensuration-by-professor-henry-dallas-thompson-dsc-phd-macmillan-1896-price-6s/5C55BD50C99C1059052E6669BEF3D0C3"}, {"title": "COMMENTARIES 22025.07.22 no cover page.pages", "url": "https://www.math.northwestern.edu/documents/commentaries-22025.07.22.pdf"}, {"title": "Beatrice Stern research files, Chronological Files, Box 1, pre-1929", "url": "https://albert.ias.edu/server/api/core/bitstreams/b745b11a-c093-44a5-8616-49891d9548f8/content"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1893, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 329, "name": "Anton Timpe", "aliases": ["Anton Timpe"], "bio": "Anton Aloys Timpe (1882–1959) was a German mathematician associated with applied mathematics and elasticity. His work connected analytical methods with mechanical problems. The expanded name provides a more precise identification than the original abbreviated label.", "status": "Biographical entry", "sources": [{"title": "Anton Aloys Timpe", "url": "https://de.wikipedia.org/wiki/Anton_Aloys_Timpe"}, {"title": "Anton Aloys Timpe", "url": "https://pt.wikipedia.org/wiki/Anton_Aloys_Timpe"}, {"title": "Timpe", "url": "https://de.wikipedia.org/wiki/Timpe"}, {"title": "Liste der Biografien/Tim", "url": "https://de.wikipedia.org/wiki/Liste_der_Biografien/Tim"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1917, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 330, "name": "Ludwig Wedekind", "aliases": ["Ludwig Wedekind"], "bio": "Ludwig Wedekind is represented in German biographical and mathematical records. The intended mathematical figure must be distinguished from other members of the Wedekind family. His place in Klein's branch is preserved while detailed educational and publication records remain to be checked.", "status": "Needs research", "sources": [{"title": "Wedekind, Ludwig - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfzW2362.html"}, {"title": "Wedekind, Georg Wilhelm Freiherr von - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd117204722.html?language=en"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1893, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 331, "name": "Guido Weichold", "aliases": ["Guido Weichold"], "bio": "Guido Weichold published on algebraic equations, including the irreducible case of the cubic. Bibliographic records establish a concrete mathematical subject for this otherwise sparsely documented node. Full personal dates and appointments remain open.", "status": "Needs research", "sources": [{"title": "GUIDO WEICHOLD", "url": "https://www.numdam.org/item/JMPA_1879_3_5__293_0.pdf"}, {"title": "University of Southampton Research Repository", "url": "https://eprints.soton.ac.uk/401543/1/Thesis_20final_20-_20Michael_20West.pdf"}, {"title": "BIBLIOTHJl:QUE DE PHILOSOPHIE CONTEMPORAINE", "url": "https://www.maths.ed.ac.uk/~v1ranick/papers/ponthist.pdf"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1893, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 332, "name": "Adolf Weiler", "aliases": ["Adolf Weiler"], "bio": "Adolf Weiler (1851–1916) was a Swiss mathematician born in Winterthur. His work belonged to the geometrical tradition associated with Klein. His biography is documented in the MacTutor history archive.", "status": "Biographical entry", "sources": [{"title": "Adolf Weiler (1851 - 1916) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Weiler/"}, {"title": "Adolf Weiler", "url": "https://en.wikipedia.org/wiki/Adolf_Weiler"}, {"title": "Adolf Weiler", "url": "https://de.wikipedia.org/wiki/Adolf_Weiler"}, {"title": "Adolf Weiler", "url": "https://pt.wikipedia.org/wiki/Adolf_Weiler"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1883, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 333, "name": "Henry White", "aliases": ["Henry White"], "bio": "Henry Seely White (1861–1943) was an American geometer trained at Göttingen. He taught at Northwestern and Vassar and worked on algebraic geometry and invariant theory. His career contributed to the growth of research mathematics in the United States.", "status": "Biographical entry", "sources": [{"title": "Henry White (1861 - 1943) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/White/"}, {"title": "Henry White (1861 - 1943) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/White/"}, {"title": "UTS1: Henry White Papers, 1842-1849", "url": "https://library.columbia.edu/content/dam/libraryweb/locations/burke/fa/uts/ldpd_4492515.pdf"}, {"title": "Henry White | Darwin Correspondence Project", "url": "https://darwin-editorial.darwinproject.ac.uk/view/nameregs/nameregs_5100"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1896, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 334, "name": "Carl Wieghardt", "aliases": ["Carl Wieghardt"], "bio": "Karl Wieghardt (1874–1924) was a mathematician who worked in mechanics and applied mathematics. He should not be confused with his son, the physicist Karl Wieghardt (1913–1996). Distinguishing the generations is important in interpreting publication and appointment records.", "status": "Biographical entry", "sources": [{"title": "Karl Wieghardt (Mathematiker)", "url": "https://de.wikipedia.org/wiki/Karl_Wieghardt_%28Mathematiker%29"}, {"title": "Nekrolog 2. Quartal 1924", "url": "https://de.wikipedia.org/wiki/Nekrolog_2._Quartal_1924"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1899, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 335, "name": "Max Winkelmann", "aliases": ["Max Winkelmann"], "bio": "Max Winkelmann worked in applied mathematics and engineering science. He became professor of applied mathematics at Jena in 1911, succeeding Wilhelm Kutta. His career connects the geometrical lineage with technical and applied mathematical teaching.", "status": "Biographical entry", "sources": [{"title": "Fritz Noether (1884 - 1941) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Noether_Fritz/"}, {"title": "Karl Heun (1859 - 1929) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Heun/"}, {"title": "Max Winkelmann (Ingenieurwissenschaftler)", "url": "https://de.wikipedia.org/wiki/Max_Winkelmann_%28Ingenieurwissenschaftler%29"}, {"title": "Max Winkelmann", "url": "https://pt.wikipedia.org/wiki/Max_Winkelmann"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1893, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 336, "name": "Mary Winston Newson", "aliases": ["Mary Winston"], "bio": "Mary Winston Newson (1869–1959) earned her doctorate at Göttingen in 1897 under Felix Klein. She taught mathematics in the United States and translated important German mathematical material, including Hilbert's address on mathematical problems. The original “Mary Winston” is retained as an alias.", "status": "Biographical entry", "sources": [{"title": "Mary Winston Newson (1869 - 1959) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Newson/"}, {"title": "Dr. Mary Winston, the second chair of the mathematics department is featured in the project of the Chapman Center for Rural Studies", "url": "https://www.math.k-state.edu/about/news-calendar/2023/23WinstonBioChapman.html"}, {"title": "Friends of Mathematics Newsletter 2024 - Mary Winston Newson Lecture Series | K-State | Kansas State University", "url": "https://www.math.ksu.edu/about/news-calendar/news/newsletter/2024/mary-winston-newson-lecture-series/index.html"}, {"title": "Mary Frances Winston Newson", "url": "https://en.wikipedia.org/wiki/Mary_Frances_Winston_Newson"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1897, "kind": "Recorded milestone", "basis": "Doctorate, Göttingen", "estimated": false}}, {"id": 337, "name": "Alexander Witting", "aliases": ["Alexander Witting"], "bio": "Alexander Witting (1861–1946) was a German mathematician and teacher associated with Dresden. He worked in mathematical education and participated in scientific societies. His writings helped disseminate mathematics beyond research universities.", "status": "Biographical entry", "sources": [{"title": "Alexander Witting", "url": "https://en.wikipedia.org/wiki/Alexander_Witting"}, {"title": "Alexander Witting", "url": "https://pt.wikipedia.org/wiki/Alexander_Witting"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1896, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 338, "name": "Frederick Woods", "aliases": ["Frederick Woods"], "bio": "Frederick Shenstone Woods (1864–1950) was an American mathematician educated at Göttingen who taught at MIT. His work and textbooks concerned geometry and analysis. He is distinct from later writers and other public figures called Frederick Woods.", "status": "Biographical entry", "sources": [{"title": "Woods, Frederick S. (Frederick Shenstone), 1864- | The Online Books Page", "url": "https://onlinebooks.library.upenn.edu/webbin/book/lookupname?key=Woods%2C+Frederick+S.+%28Frederick+Shenstone%29%2C+1864-"}, {"title": "Frederick S. Woods", "url": "https://en.wikipedia.org/wiki/Frederick_S._Woods"}, {"title": "FREDERICK S. WOODS, A.B., A.M., Ph.D., Assistant Professor of Mathematics.—Wesleyan University, Ψ Υ, Φ Β Κ. A. B. Wesleyan, ’85; A.M., Wesleyan, ’88; Ph.D., Göttingen, ’94.", "url": "https://web.mit.edu/technique/www/scans/1905_Technique.pdf"}], "color": "#ef4444", "incoming": [83], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1899, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 339, "name": "Johann von Soldner", "aliases": ["Johann von Soldner"], "bio": "Johann Georg von Soldner (1776–1833) was a German astronomer and surveyor. His work included geodesy and an early calculation of the deflection of light using a corpuscular model. His contributions connect observational measurement with mathematical physics.", "status": "Biographical entry", "sources": [{"title": "Soldner, Johann von (seit 1825) - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/118748769.html?language=en"}, {"title": "Soldner, Johann von (seit 1825) - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd118748769.html"}, {"title": "Soldner, Johann von (seit 1825) - Deutsche Biographie", "url": "https://www.deutsche-biog nd with vitalist approaches to physiology. His medical training, rather than a mathematics doctorate, explains his position in the chart.", "status": "Biographical entry", "sources": [{"title": "Georg Stahl", "url": "https://de.wikipedia.org/wiki/Georg_Stahl"}, {"title": "Georg Ernst Stahl | Encyclopedia.com", "url": "https://www.encyclopedia.com/people/science-and-technology/chemistry-biographies/georg-ernst-stahl"}], "color": "#3b82f6", "incoming": [104], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 13, "timeline": {"year": 1694, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 344, "name": "Reinier de Graaf", "aliases": ["Reinier de Graaf"], "bio": "Reinier de Graaf (1641–1673) was a Dutch physician and anatomist known especially for studies of reproductive anatomy. He trained in the Leiden medical environment and also studied in France. He must not be confused with the contemporary architect of the same name.", "status": "Biographical entry", "sources": [{"title": "M0002616: Portrait of Reinier de Graaf (1641-1673) | Wellcome Collection", "url": "https://wellcomecollection.org/works/jhftwd7e"}, {"title": "R. de Graaf Med: Doct: De virorum organis generationi inservientibus, de clysteribus et de usu siphonis in anatomia / [Reinier de Graaf]. | Wellcome Collection", "url": "https://wellcomecollection.org/works/he8hsxtm"}], "color": "#3b82f6", "incoming": [106], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 12, "timeline": {"year": 1657, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 345, "name": "Frederick Dekkers", "aliases": ["Frederick Dekkers"], "bio": "Frederik Dekkers (1644–1720) was a Dutch physician and university professor. Bibliographic holdings preserve medical dissertations associated with his teaching. His branch belongs to the Leiden medical tradition rather than a separate mathematical doctoral program.", "status": "Biographical entry", "sources": [{"title": "Frederick Dekkers | Wellcome Collection", "url": "https://wellcomecollection.org/concepts/e7mm3prv"}, {"title": "Frederick Dekkers - Wikidata", "url": "https://www.wikidata.org/wiki/Q2386031"}, {"title": "<visual_element id=\"e1\">", "url": "https://maa.missouri.edu/sites/default/files/image-button/2022-01/on-line_exhibition_distinction_part_i_portraying_others_complete.pdf"}], "color": "#3b82f6", "incoming": [106], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 12, "timeline": {"year": 1679, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 346, "name": "Burchard de Volder", "aliases": ["Burchard de Volder"], "bio": "Burchard de Volder (1643–1709) was a Dutch philosopher and natural scientist at Leiden. He promoted experimental teaching and corresponded with Leibniz. His intellectual connections combine university education, experimental practice, and philosophical debate.", "status": "Biographical entry", "sources": [{"title": "Burchard de Volder", "url": "https://en.wikipedia.org/wiki/Burchard_de_Volder"}, {"title": "Burchard de Volder", "url": "https://pt.wikipedia.org/wiki/Burchard_de_Volder"}, {"title": "Microsoft Word - VolderB.doc", "url": "https://web-genealogy.scs.illinois.edu/Info/volderb.pdf"}], "color": "#3b82f6", "incoming": [106], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 12, "timeline": {"year": 1676, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 347, "name": "Lucas Schacht", "aliases": ["Lucas Schacht"], "bio": "Lucas Schacht (1634–1689) was a Dutch physician associated with medical teaching at Leiden. His educational setting links him with the clinical tradition around Franciscus Sylvius. Detailed dates of supervision and publications should be checked against medical and university records.", "status": "Biographical entry", "sources": [{"title": "Schacht (Familienname)", "url": "https://de.wikipedia.org/wiki/Schacht_%28Familienname%29"}, {"title": "SECTION: 9", "url": "https://www.emich.edu/regents/board-documents/2021/12-9-2021/sec_9_redacted.pdf"}, {"title": "List of rectores magnifici of Leiden University", "url": "https://en.wikipedia.org/wiki/List_of_rectores_magnifici_of_Leiden_University"}, {"title": "Bernhardus Albinus", "url": "https://en.wikipedia.org/wiki/Bernhardus_Albinus"}], "color": "#3b82f6", "incoming": [106], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 12, "timeline": {"year": 1661, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 348, "name": "Florentius Schuyl", "aliases": ["Florentius Schuyl"], "bio": "Florentius Schuyl (1619–1669) was a Dutch physician and scholar associated with Leiden. He is known for his role in publishing and translating Cartesian material on the human body. His career bridges medicine and natural philosophy.", "status": "Biographical entry", "sources": [{"title": "Florentius Schuyl", "url": "https://fr.wikipedia.org/wiki/Florentius_Schuyl"}, {"title": "[Florentius Schuyl], Biographisch woordenboek der Nederlanden. Deel 17. Eerste stuk, A.J. van der Aa - DBNL", "url": "https://www.dbnl.org/tekst/aa__001biog20_01/aa__001biog20_01_0963.php"}, {"title": "The Correspondence between Descartes and Henricus Regius", "url": "https://www.academia.edu/475323/The_Correspondence_between_Descartes_and_Henricus_Regius"}], "color": "#3b82f6", "incoming": [106], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 12, "timeline": {"year": 1644, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 349, "name": "Robert Sibbald", "aliases": ["Robert Sibbald"], "bio": "Robert Sibbald (1641–1722) was a Scottish physician and naturalist who helped establish Edinburgh's medical institutions and botanical garden. His education included study on the Continent. His publications addressed natural history, geography, and medicine.", "status": "Biographical entry", "sources": [{"title": "Robert Sibbald | 300 years of medicine | College of Medicine and Vet Medicine", "url": "https://medicine-vet-medicine.ed.ac.uk/300-years-of-medicine/300-faces-of-edinburgh-medical-school/300-faces-s/robert-sibbald"}, {"title": "Sir Robert Sibbald | RCP Museum", "url": "https://history.rcp.ac.uk/inspiring-physicians/sir-robert-sibbald"}], "color": "#3b82f6", "incoming": [106], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 12, "timeline": {"year": 1676, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 350, "name": "Jan Swammerdam", "aliases": ["Johannes Swammerdam"], "bio": "Jan Swammerdam (1637–1680) was a Dutch naturalist and anatomist known for microscopic studies of insects and development. His detailed observations challenged prevailing assumptions about transformation and generation. “Johannes Swammerdam” in the original refers to this figure.", "status": "Biographical entry", "sources": [{"title": "'Visualizing Cartesian Anatomy at Leiden University: Steno, Schuyl, De Graaf,  and Swammerdam'", "url": "https://www.academia.edu/167592880/Visualizing_Cartesian_Anatomy_at_Leiden_University_Steno_Schuyl_De_Graaf_and_Swammerdam"}, {"title": "Reading the Book of Nature in the Dutch Golden Age, 1575-1715", "url": "https://www.academia.edu/16532454/Reading_the_Book_of_Nature_in_the_Dutch_Golden_Age_1575_1715"}], "color": "#3b82f6", "incoming": [106], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 12, "timeline": {"year": 1658, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 351, "name": "Johann von Flammerdinge", "aliases": ["Johann von Flammerdinge"], "bio": "The name “Johann von Flammerdinge” appears in bibliographic and authority records, but available search results also route to Johannes de Raey. That does not by itself establish that the names identify the same person. The node is retained separately until its dissertation or a reliable authority record resolves the identity.", "status": "Biographical entry", "sources": [{"title": "Johannes de Raey - Wikidata", "url": "https://www.wikidata.org/wiki/Q5469707"}], "color": "#3b82f6", "incoming": [106], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 12, "timeline": {"year": 1659, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 353, "name": "Georg Wedel", "aliases": ["Georg Wedel"], "bio": "Georg Wolfgang Wedel (1645–1721) was a German physician and professor at Jena. His medical teaching and writings belong to the early modern tradition connecting chemistry, pharmacy, and physiology. He is distinct from later civic figures with the shorter name Georg Wedel.", "status": "Biographical entry", "sources": [{"title": "Georg Wolfgang Wedel", "url": "https://de.wikipedia.org/wiki/Georg_Wolfgang_Wedel"}, {"title": "Wedel, Georg Wolfgang | Encyclopedia.com", "url": "https://www.encyclopedia.com/science/dictionaries-thesauruses-pictures-and-press-releases/wedel-georg-wolfgang"}], "color": "#3b82f6", "incoming": [106], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 12, "timeline": {"year": 1680, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 354, "name": "Johann Bauhin", "aliases": ["Johann Bauhin"], "bio": "“Johann Bauhin” is ambiguous in this context. The famous botanist Johann Bauhin (1541–1613) cannot simply be treated as a student of Emmanuel Stupanus (1587–1664). Basel dissertation records instead name Johann Caspar Bauhin. This possible duplicate or misidentification is preserved and flagged rather than silently merged.", "status": "Biographical entry", "sources": [{"title": "Johann Bauhin", "url": "https://en.wikipedia.org/wiki/Johann_Bauhin"}, {"title": "Emmanuel Stupanus", "url": "https://en.wikipedia.org/wiki/Emmanuel_Stupanus"}, {"title": "UB Basel / Vincul. corporis cum anima spirit. influent : Ex Gal. de plac. Hipp. monu", "url": "https://www.e-rara.ch/bau_1/content/titleinfo/5564774"}], "color": "#3b82f6", "incoming": [64], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 11, "timeline": {"year": 1576, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 355, "name": "Michael Servetus", "aliases": ["Michael Servetus"], "bio": "Michael Servetus (c. 1511–1553) was a physician and religious writer. His description of pulmonary circulation appeared within a theological work. He was executed in Geneva for heresy, an event central to later debates about religious toleration and freedom of inquiry.", "status": "Biographical entry", "sources": [{"title": "Michael Servetus", "url": "https://en.wikipedia.org/wiki/Michael_Servetus"}, {"title": "Servetus, Michael | Encyclopedia.com", "url": "https://www.encyclopedia.com/environment/encyclopedias-almanacs-transcripts-and-maps/servetus-michael"}], "color": "#3b82f6", "incoming": [110], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 5, "timeline": {"year": 1532, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 356, "name": "Johannes Sturmius", "aliases": ["Johannes Sturmius"], "bio": "The original Johannes Sturmius is identity-sensitive: it may refer to the humanist schoolmaster Johann Sturm, while searches also return a later physician who studied at Rostock and Helmstedt. The intended link to Winter of Andernach needs a matching historical record. Those two careers are not combined here.", "status": "Needs research", "sources": [{"title": "Sturmius, Johannes · Sennert Collaborators", "url": "https://sennertcollab.omeka.fas.harvard.edu/items/show/2757"}, {"title": "Joannes Sturmius Mechlinianus", "url": "https://en.wikipedia.org/wiki/Joannes_Sturmius_Mechlinianus"}], "color": "#3b82f6", "incoming": [110], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 5, "timeline": {"year": 1552, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 357, "name": "Carolus Stephanus", "aliases": ["Carolus Stephanus"], "bio": "Charles Estienne (1504–1564), Latinized as Carolus Stephanus, was a French physician, anatomist, and printer. His anatomical publications belong to the Renaissance effort to describe the human body through text and illustration. He was also part of the prominent Estienne printing family.", "status": "Needs research", "sources": [], "color": "#3b82f6", "incoming": [112], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 4, "timeline": {"year": 1534, "kind": "Estimated active period O", "url": "https://citeseerx.ist.psu.edu/document?doi=c6697d7daa7c4a02a85e43660b75fd449cffbe7f&repid=rep1&type=pdf"}], "color": "#3b82f6", "incoming": [90], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 43, "timeline": {"year": 2005, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 439, "name": "Scott A. McCullough", "aliases": ["Scott A. McCullough"], "bio": "Scott McCullough is an operator theorist associated with the University of Florida. His research connects operator theory, interpolation, matrix inequalities, and free noncommutative analysis. He earned his doctorate under Jim Agler, a relationship distinct from his later mentoring and collaboration with Pascoe.", "status": "Biographical entry", "sources": [{"title": "MAA6617 Spring 2026 syllabus | scott mccullough", "url": "https://syllabus.math.ufl.edu/wp-content/uploads/sites/133/SPRING-2026-MAA6617_MAT4930_Mccullough.pdf"}, {"title": "maa4211 syllabus | scott mccullough", "url": "https://syllabus.math.ufl.edu/wp-content/uploads/sites/133/maa4211-Mccullough.pdf"}, {"title": "Faculty - Mathematics", "url": "https://math.ufl.edu/people/faculty/"}, {"title": "Mathematics Department | University of Florida Catalog", "url": "https://gradcatalog.ufl.edu/graduate/colleges-departments/liberal-arts-sciences/mathematics/"}], "color": "#3b82f6", "incoming": [90], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 43, "timeline": {"year": 2005, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 440, "name": "Benjamin J. Raphael", "aliases": ["Benjamin J. Raphael"], "bio": "Benjamin J. Raphael is a computer scientist whose research focuses on computational biology and cancer genomics. His earlier doctoral training was in mathematics under Jim Agler. His career illustrates a substantial change of application area within the same academic lineage.", "status": "Biographical entry", "sources": [{"title": "BROWN UNIVERSITY", "url": "https://citeseerx.ist.psu.edu/document?doi=2f56a19a2208ae75d9e6fc5ed258c287e9a41075&repid=rep1&type=pdf"}, {"title": "Genome Reconstruction and", "url": "https://ueaeprints.uea.ac.uk/id/eprint/57181/1/PhD_Thesis_Luca_Penso_Dolfin.pdf"}], "color": "#3b82f6", "incoming": [90], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 43, "timeline": {"year": 2005, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 441, "name": "David Scheinker", "aliases": ["David Scheinker"], "bio": "David Scheinker works at the intersection of mathematics, operations research, and health-care delivery. His doctoral training was under Jim Agler, and his later research has applied quantitative methods to clinical operations. This is another branch where professional subject matter differs markedly from the adviser's field.", "status": "Biographical entry", "sources": [{"title": "CERC Faculty | Clinical Excellence Research Center | Stanford Medicine", "url": "https://med.stanford.edu/cerc/about/team-faculty.html"}, {"title": "2011- 2012 | Department of Mathematics | Drexel Un", "url": "https://drexel.edu/~/media/Files/math/annual-report/2011-2012-annual-report.ashx?la=en"}], "color": "#3b82f6", "incoming": [90], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 43, "timeline": {"year": 2005, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 442, "name": "Gaston Darboux", "aliases": ["Gaston Darboux"], "bio": "Gaston Darboux (1842–1917) was a French mathematician known for work in differential geometry and analysis. He taught in Paris and wrote influential treatments of surfaces. His research and teaching helped shape the French geometrical tradition.", "status": "Biographical entry", "sources": [{"title": "Gaston Darboux (1842 - 1917) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Darboux/"}, {"title": "Darboux Appell - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Extras/Darboux_Appell/"}, {"title": "Darboux Larmour - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Extras/Darboux_Larmour/"}, {"title": "encyclopedia.com", "url": "https://mathshistory.st-andrews.ac.uk/DSB/Darboux.pdf"}], "color": "#eab308", "incoming": [31], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 34, "timeline": {"year": 1877, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 443, "name": "Valerian Ligin", "aliases": ["Valerian Ligin"], "bio": "Valerian Nikolayevich Ligin (1846–1900) was a mathematician and educator associated with Odessa. His work and institutional activity belong to the nineteenth-century development of mathematical and technical education. His name also appears in German transliteration as Walerian Ligin.", "status": "Biographical entry", "sources": [{"title": "Henri Fehr (1870 - 1954) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Fehr/"}, {"title": "Walerian Nikolajewitsch Ligin", "url": "https://de.wikipedia.org/wiki/Walerian_Nikolajewitsch_Ligin"}, {"title": "One Hundred Years", "url": "https://citeseerx.ist.psu.edu/document?doi=f88cf46053c210abc5678da2b6d371b894d3a05d&repid=rep1&type=pdf"}], "color": "#eab308", "incoming": [31], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 34, "timeline": {" odels - Richard P. Baker | Smithsonian Institution", "url": "https://www.si.edu/spotlight/maa-charter/geometric-models-richard-p-baker"}, {"title": "Academic Hood of Richard P. Baker | National Museum of American History", "url": "https://americanhistory.si.edu/collections/object/nmah_1214100"}, {"title": "Photograph of Richard Philip Baker | National Museum of American History", "url": "https://americanhistory.si.edu/collections/object/nmah_904611"}, {"title": "Frances Baker: Daughter of a Mathematical Model Maker | National Museum of American History", "url": "https://americanhistory.si.edu/collections/object-groups/women-mathematicians/frances-baker-daughter-of-a-mathematical-model-maker"}], "color": "#06b6d4", "incoming": [33], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1901, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 448, "name": "Raymond Barnard", "aliases": ["Raymond Barnard"], "bio": "The intended Raymond Barnard belongs to E. H. Moore's Chicago branch. Sources discuss Raymond W. Barnard in that setting, but a fully matched personal biography remains incomplete. He should not be identified with later mathematicians or unrelated persons solely from the shared name.", "status": "Needs research", "sources": [{"title": "Archie Blake (mathematician)", "url": "https://en.wikipedia.org/wiki/Archie_Blake_%28mathematician%29"}, {"title": "Celebratio Mathematica — Moore — Life &amp; Works", "url": "https://celebratio.org/Moore_EH/article/99/"}], "color": "#06b6d4", "incoming": [33], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1910, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 449, "name": "George Birkhoff", "aliases": ["George Birkhoff"], "bio": "George David Birkhoff (1884–1944) was an American mathematician who worked on differential equations, dynamical systems, and ergodic theory. He earned his doctorate at Chicago under E. H. Moore and taught at Harvard. He is distinct from his son, the algebraist Garrett Birkhoff.", "status": "Biographical entry", "sources": [{"title": "George Birkhoff (1884 - 1944) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Birkhoff/"}, {"title": "George Birkhoff (1884 - 1944) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Birkhoff/"}, {"title": "Papers of George D. Birkhoff, 1902-1946 - HOLLIS for Archival Discovery", "url": "https://hollisarchives.lib.harvard.edu/catalog/hua62021"}, {"title": "Biographical Encyclopedia of Astronomers", "url": "https://mathshistory.st-andrews.ac.uk/BEA/birkhoff_bea.pdf"}], "color": "#06b6d4", "incoming": [33], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1914, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 450, "name": "Edward Chittenden", "aliases": ["Edward Chittenden"], "bio": "Edward Wilson Chittenden (1885–1977) was an American mathematician associated with Iowa. His papers document research and teaching in analysis and topology. He trained in the Chicago mathematical environment represented by Moore.", "status": "Biographical entry", "sources": [{"title": "Collection: Edward Wilson Chittenden Papers | ArchivesSpace at the University of Iowa", "url": "https://s-lib019.lib.uiowa.edu/repositories/3/resources/1261"}, {"title": "DOCUMENT RESUME", "url": "https://citeseerx.ist.psu.edu/document?doi=0149d0185e4e2b224647bc4e654ba0fd62671d44&repid=rep1&type=pdf"}, {"title": "Daily Iowan (Iow mpact Kürschak fields. This locates his work in algebra and valuation theory within Moore's school. The expanded name distinguishes him from other members of the Gokhale family and later scholars.", "status": "Biographical entry", "sources": [{"title": "BANARAS HINDU UNIVERSITY", "url": "https://www.bhu.ac.in/Images/files/1956_OrderofProceeding.pdf"}, {"title": "Concerning Compact Kürschak Fields | JSTOR", "url": "https://www.jstor.org/stable/2370416"}], "color": "#06b6d4", "incoming": [33], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1910, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 456, "name": "William Hart", "aliases": ["William Hart"], "bio": "William LeRoy Hart (1892–1984) was an American mathematician and mathematical educator. His publications included college mathematics texts. His graduate background connects him with the Chicago analysis tradition.", "status": "Biographical entry", "sources": [{"title": "Details zu: First year college mathematics / › Koha - Katalog", "url": "https://katalog.bibliothek.kit.edu/bib/918202"}], "color": "#06b6d4", "incoming": [33], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1927, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 457, "name": "Theophil Hildebrandt", "aliases": ["Theophil Hildebrandt"], "bio": "Theophil Henry Hildebrandt (1888–1980) was an American analyst associated with the University of Michigan. He earned his doctorate at Chicago and worked on integration and functional analysis. His career included substantial departmental leadership and professional service.", "status": "Biographical entry", "sources": [{"title": "Theophil Henry Hildebr  "aliases": ["R. L. Moore"], "bio": "Robert Lee Moore (1882–1974) was an American topologist associated especially with Texas and with the teaching approach called the Moore method. He earned his doctorate at Chicago. His educational legacy also includes racial exclusion and discriminatory treatment, which are essential parts of an accurate biography.", "status": "Biographical entry", "sources": [{"title": "Robert Lee Moore (1882 - 1974) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Moore_Robert/"}, {"title": "Robert Lee Moore (1882 - 1974) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Moore_Robert/"}, {"title": "R. L. Moore - racist mathematician unveiled", "url": "https://math.buffalo.edu/mad/special/RLMoore-racist-math.html"}], "color": "#06b6d4", "incoming": [33], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1917, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 464, "name": "Frederick Owens", "aliases": ["Frederick Owens"], "bio": "Frederick William Owens (1872–1961) was an American mathematician and educator. His career is documented in part through family and institutional archives associated with mathematician Helen Brewster Owens. Those archival relationships should be separated from the precise doctoral connection in the chart.", "status": "Biographical entry", "sources": [{"title": "Papers of Helen Brewster Owens, 1867-1968, 1867-1968 - HOLLIS for Archival Discovery", "url": "https://hollisarchives.lib.harvard.edu/catalog/sch00069"}, {"title": "-\nCO \nUNIVE \nI \nOFFICIAL PUBLICATION \nNUMBER 3 \nVO", "url": "https://ecommons.cornell.edu/bitstreams/543c15a7-0893-4d6f-bd01-001f604eb29e/download"}, {"title": "Sesquicentenial Historical Notes, Chapter I  Association of America. He also edited the American Mathematical Monthly. His professional service and commitment to teaching were central parts of his career.", "status": "Biographical entry", "sources": [{"title": "Herbert Ellsworth Slaught (1861 - 1937) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Slaught/"}, {"title": "Herbert Ellsworth Slaught (1861 - 1937) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Slaught/"}, {"title": "Slaught on Mathematics and Teaching - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Extras/Slaught_Teaching/"}, {"title": "Slaught, Herbert Ellsworth : Photographic Archive : The University of Chicago", "url": "https://photoarchive.lib.uchicago.edu/db.xqy?one=apf1-07673.xml"}], "color": "#06b6d4", "incoming": [33], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1896, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 470, "name": "Herman Lyle Smith", "aliases": ["Herman Smith"], "bio": "Herman Lyle Smith (1892–1950) was an American mathematician associated with the theory of generalized convergence. The Moore–Smith notion of a net is named for his work with E. H. Moore. This identifies the mathematical figure intended by the abbreviated original label.", "status": "Biographical entry", "sources": [{"title": "Herman L. Smith", "url": "https://en.wikipedia.org/wiki/Herman_L._Smith"}], "color": "#06b6d4", "incoming": [33], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1921, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 4 er", "aliases": ["Anna Wheeler"], "bio": "Anna Johnson Pell Wheeler (1883–1966) worked in analysis and became a major figure in American mathematics education. She studied in Germany and completed a doctorate at Chicago. She later led mathematics at Bryn Mawr and helped create opportunities for women in advanced mathematics.", "status": "Biographical entry", "sources": [{"title": "Anna Johnson Wheeler (1883 - 1966) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Wheeler/"}, {"title": "Anna Johnson Wheeler (1883 - 1966) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Wheeler/"}, {"title": "Anna Johnson Wheeler (1883 - 1966) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Wheeler/"}], "color": "#06b6d4", "incoming": [33], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1918, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 474, "name": "Robert Wilson", "aliases": ["Robert Wilson"], "bio": "The Robert Wilson intended by Moore's branch needs a direct historical identification. Contemporary algebraists and analysts of the same name cannot be assumed to be Moore's student. The node is preserved without importing their publications or appointments.", "status": "Needs research", "sources": [{"title": "Van Vleck Notes  Spring 2011", "url": "https://web.math.wisc.edu/oldnews/news2011.pdf"}, {"title": "Guide to the University of Chicago Department of Mathematics Records 1892-1975", "url": "https://www.lib.uchicago.edu/e/scrc/findingaids/view.php?eadid=ICU.SPCL.MATHDEPT"}], "color": "#06b6d4", "incoming": [33], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 36, "timeline": {"year": 1910, "kind": life. Not a degree date.", "estimated": true}}, {"id": 489, "name": "John Vanderslice", "aliases": ["John Vanderslice"], "bio": "John Louis Vanderslice was a mathematician associated with differential geometry and the Princeton scholarly environment. The Institute for Advanced Study maintains a record of his affiliation. He is not the contemporary musician John Vanderslice.", "status": "Biographical entry", "sources": [{"title": "John L. Vanderslice | Scholars | Institute for Advanced Study", "url": "https://www.ias.edu/scholars/john-l-vanderslice"}], "color": "#06b6d4", "incoming": [34], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 37, "timeline": {"year": 1928, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 490, "name": "J. H. C. Whitehead", "aliases": ["John Whitehead"], "bio": "J. H. C. Whitehead (1904–1960) was a British topologist who earned his doctorate at Princeton under Veblen. His work helped establish homotopy theory and the use of CW complexes. He later taught at Oxford and is distinct from Alfred North Whitehead.", "status": "Biographical entry", "sources": [{"title": "Henry Whitehead (1904 - 1960) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Whitehead_Henry/"}, {"title": "J. H. C. Whitehead", "url": "https://en.wikipedia.org/wiki/J._H._C._Whitehead"}, {"title": "J.H.C. Whitehead in nLab", "url": "https://ncatlab.org/nlab/show/J.H.C.%2BWhitehead"}], "color": "#06b6d4", "incoming": [34], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 37, "timeline": {"year": 1932, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 491, "name": "C. Anthony Anderson", "aliases": ["C. Anthony Anderson"], "bio": "C. Anthony Anderson is a philosopher and logician associated with work in modal logic and related areas of philosophical logic. His doctoral training was under Alonzo Church. The initial and middle name help distinguish him from unrelated public figures.", "status": "Biographical entry", "sources": [{"title": "Anderson, C. Anthony | Department of Philosophy", "url": "https://philosophy.ucsb.edu/index.php/people/anderson-c-anthony"}, {"title": "C. Anthony Anderson", "url": "https://en.wikipedia.org/wiki/C._Anthony_Anderson"}], "color": "#06b6d4", "incoming": [35], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 38, "timeline": {"year": 1952, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 492, "name": "Peter Andrews", "aliases": ["Peter Andrews"], "bio": "Peter B. Andrews is a logician known for work on type theory, automated reasoning, and mathematical logic. He earned his doctorate under Church and taught at Carnegie Mellon. His textbooks and theorem-proving work connect classical logical foundations with computation.", "status": "Biographical entry", "sources": [{"title": "Peter B. Andrews", "url": "https://en.wikipedia.org/wiki/Peter_B._Andrews"}, {"title": "An Introduction to Mathematical Logic and Type Theory", "url": "https://link.springer.com/book/10.1007/978-94-015-9934-4"}], "color": "#06b6d4", "incoming": [35], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 38, "timeline": {"year": 1952, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 493, "name": "Bijan Arbab", "aliases": ["Bijan Arbab"], "bio": "Bijan Arbab's published work includes computer science and artificial intelligence. The supplied chart places him in Church's doctoral branch. Becaus  "sources": [{"title": "Brian Chellas", "url": "https://en.wikipedia.org/wiki/Brian_Chellas"}, {"title": "Brian Farrell Chellas, The Logical Form of Imperatives - PhilPapers", "url": "https://philpapers.org/rec/CHETLF"}, {"title": "dblp: Brian F. Chellas", "url": "https://dblp.org/pid/10/4419.html"}, {"title": "Works by Brian F. Chellas - PhilPapers", "url": "https://philpapers.org/s/Brian%20F.%20Chellas"}], "color": "#06b6d4", "incoming": [36], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 39, "timeline": {"year": 1976, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 537, "name": "John Copeland", "aliases": ["John Copeland"], "bio": "Jack Copeland, whose full name is Brian Jack Copeland, is a philosopher and historian of computing. His work includes extensive scholarship on Alan Turing and early computing. The original “John Copeland” label requires confirmation before it is definitively identified with him; the likely match is presented as tentative.", "status": "Needs research", "sources": [], "color": "#06b6d4", "incoming": [36], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 39, "timeline": {"year": 1983, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 538, "name": "Martin Davies", "aliases": ["Martin Davies"], "bio": "Martin Davies is a philosopher associated with Oxford whose work includes mind, language, and cognition. His career has also included a professorship at the Australian National University. He is distinct from other academics of the same name in education and other fields.", "status": "Biographical entry", "sources": [{"title": "Martin Davies | Faculty of Philosophy", "url": "https://www.philosophy.ox.ac.uk/people/martin-davies"}, {"ti an mathematician who worked in symbolic computation and discrete mathematics. He is known for algorithms for hypergeometric solutions and for coauthoring A=B. His doctorate at Carnegie Mellon was supervised by Scott.", "status": "Biographical entry", "sources": [{"title": "Marko Petkovsek | Carnegie Mellon University Computer Science Department", "url": "https://csd.cs.cmu.edu/academics/doctoral/degrees-conferred/marko-petkovsek"}, {"title": "Marko Petkovšek", "url": "https://en.wikipedia.org/wiki/Marko_Petkov%C5%A1ek"}], "color": "#06b6d4", "incoming": [36], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 39, "timeline": {"year": 1989, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 565, "name": "Joseph Quinsey", "aliases": ["Joseph Quinsey"], "bio": "Joseph Quinsey has worked in mathematical logic and is represented in Scott's doctoral lineage. Public mathematical discussion under his name supplements, but does not replace, the need for an institutional degree record. Detailed personal dates and appointments are not inferred from forum profiles.", "status": "Needs research", "sources": [], "color": "#06b6d4", "incoming": [36], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 39, "timeline": {"year": 1983, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 566, "name": "Sridhar Ramesh", "aliases": ["Sridhar Ramesh"], "bio": "Sridhar Ramesh completed a 2023 Berkeley doctorate on introspective theories and geminal categories. His work concerns categorical logic and mathematical foundations. His own public academic description and thesis record provide a specific research context for this recent branch.", "status": "Biographical entry", "sources": [{"title": "User Sridhar Ramesh - MathOverflow", "url": "https://mathoverflow.net/users/sridhar-ramesh"}, {"title": "Sridhar Ramesh in nLab", "url": "https://ncatlab.org/nlab/show/Sridhar%20Ramesh"}, {"title": "User Sridhar Ramesh - MathOverflow", "url": "https://mathoverflow.net/users/3902/sridhar-ramesh"}, {"title": "User Sridhar Ramesh - MathOverflow", "url": "https://mathoverflow.net/users/3902/sridhar-ramesh?tab=profile"}], "color": "#06b6d4", "incoming": [36], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 39, "timeline": {"year": 2023, "kind": "Recorded milestone", "basis": "Doctoral thesis, Berkeley", "estimated": false}}, {"id": 567, "name": "Fred Roberts", "aliases": ["Fred Roberts"], "bio": "Fred S. Roberts is a mathematician whose work includes discrete mathematics, measurement theory, and applications to social and decision sciences. He has been associated with Rutgers and DIMACS. His training under Scott connects logic with a broad applied-combinatorial career.", "status": "Biographical entry", "sources": [{"title": "CV - Fred Roberts, Board of Governors Professor, Math/CCICADA/DIMACS", "url": "https://sites.rutgers.edu/fredroberts/cv/"}, {"title": "Fred Roberts - Rutgers CAIT", "url": "https://cait.rutgers.edu/directory/fred-roberts/"}, {"title": "Fred Roberts – The Rutgers Artificial Intelligence and Data Science (RAD) Collaboratory", "url": "https://radcollaboratory.rutgers.edu/profile/fred-roberts/"}, {"title": "Roberts, Fred", "url": "https://math.rutgers.edu/people/department-directory/detail/344-department-directory/1750-roberts-fred"}], "color": "#06b6d4", "incoming": [36], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 39, "timeline": {"year": 1983, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 568, "name": "Giuseppe Rosolini", "aliases": ["Giuseppe Rosolini"], "bio": "Giuseppe Rosolini is an Italian mathematician whose research connects category theory, logic, and the foundations of computation. His doctoral studies were at Oxford under Scott. His work belongs to the categorical and constructive side of the lineage.", "status": "Needs research", "sources": [], "color": "#06b6d4", "incoming": [36], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 39, "timeline": {"year": 1983, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 569, "name": "William Rounds", "aliases": ["William Rounds"], "bio": "William C. Rounds was a computer scientist whose publications addressed formal languages, computation, and linguistic or logical formalisms. His work belongs to the interaction between theoretical computer science and language. His doctoral background connects him with Scott's branch.", "status": "Biographical entry", "sources": [{"title": "dblp: William C. Rounds", "url": "https://dblp.org/pid/r/WCRounds.html"}], "color": "#06b6d4", "incoming": [36], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 39, "timeline": {"year": 1983, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 570, "name": "Vijay Saraswat", "aliases": ["Vijay Saraswat"], "bio": "Vijay Saraswat is a computer scientist known for work on concurrent constraint programming and programming languages. He trained at Carnegie Mellon under Scott. He is distinct from the Indian defense scientist Vijay Kumar Saraswat, whose biography should not be attached to this node.", "status": "Needs research", "sources": [], "color": "#06b6d4", "incoming": [36], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 39, "timeline": {"year": 1983, "kind": "Inferred placement", "basis": "La
