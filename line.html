sm with Protestant institutional and educational reform.", "status": "Biographical entry", "sources": [{"title": "Wolfgang Capito", "url": "https://en.wikipedia.org/wiki/Wolfgang_Capito"}], "color": "#ec4899", "incoming": [138, 139], "outgoing": [117], "originalYear": 1515, "sourceType": "Main roster", "rank": 4, "timeline": {"year": 1515, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 123, "name": "Sebastian Beck", "aliases": ["Sebastian Beck"], "bio": "Sebastian Beck (1583–1654) was a Reformed theologian at Basel. His publications and teaching belong to the university's theological tradition. He appears in the imported lineage through that educational setting, not because every later mathematical descendant worked in his own field.", "status": "Biographical entry", "sources": [{"title": "Sebastian Beck", "url": "https://de.wikipedia.org/wiki/Sebastian_Beck"}, {"title": "QAZVINI, MOḤAMMAD - Encyclopaedia Iranica", "url": "https://www.iranicaonline.org/articles/qazvini-mohammad/?generate_pdf=1"}], "color": "#ec4899", "incoming": [118], "outgoing": [124], "originalYear": 1610, "sourceType": "Main roster", "rank": 24, "timeline": {"year": 1610, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 124, "name": "Theodor Zwinger II (theologian)", "aliases": ["Theodor Zwinger Jr."], "bio": "Theodor Zwinger II (1597–1654) was a Reformed theologian in Basel. He earned a theology doctorate in 1630 and became a professor and leader of the Basel church. Swiss historical records distinguish him from the physician Theodor Zwinger III (1658–1724). The original “Jr.” label has therefore been expanded to identify the theological figure intended by this branch.", "status": "Biographical entry", "sources": [{"title": "Zwinger, Theodor", "url": "https://hls-dhs-dss.ch/de/articles/010944/2013-12-09/"}, {"title": "Zwinger, Theodor - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd11760318X.html"}, {"title": "Zwinger, Theodor - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd11760318X.html?language=en"}], "color": "#3b82f6", "incoming": [123], "outgoing": [142], "originalYear": 1630, "sourceType": "Main roster", "rank": 25, "timeline": {"year": 1630, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 125, "name": "Gemma Frisius", "aliases": ["Gemma (Jemme Reinerszoon) Frisius"], "bio": "Gemma Frisius (1508–1555), born Jemme Reinerszoon, was a physician, mathematician, cartographer, and instrument maker associated with Leuven. He described triangulation for surveying and methods relevant to determining longitude. His work connected theoretical geography with the construction and use of scientific instruments.", "status": "Biographical entry", "sources": [{"title": "Gemma Frisius, Rainer - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd111548993.html"}, {"title": "Gemma, Frisius, 1508-1555 | The Online Books Page", "url": "https://onlinebooks.library.upenn.edu/webbin/who/Gemma%2C%20Frisius%2C%201508-1555"}, {"title": "Gemma Frisius", "url": "https://en.wikipedia.org/wiki/Gemma_Frisius"}], "color": "#ec4899", "incoming": [], "outgoing": [143], "originalYear": 1530, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1530, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 126, "name": "Andreas Schato", "aliases": ["Andreas Schato"], "bio": "Andreas Schato (1539–1603) was a physician and mathematician at Wittenberg. His university career included mathematical teaching before medicine. He illustrates the permeability of disciplinary boundaries in the sixteenth-century university and requires medical as well as mathematical sources for a full biography.", "status": "Biographical entry", "sources": [{"title": "Schato von Schattenthal, Andreas von (seit 1600) - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz121299.html"}, {"title": "Schato von Schattenthal, Andreas von (seit 1600) - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz121299.html?language=en"}, {"title": "Andreas Schato", "url": "https://en.wikipedia.org/wiki/Andreas_Schato"}], "color": "#ec4899", "incoming": [148], "outgoing": [359, 360], "originalYear": 1580, "sourceType": "Main roster", "rank": 10, "timeline": {"year": 1580, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 127, "name": "Jacobus Martini", "aliases": ["Jacobus Martini"], "bio": "Jakob Martini (1570–1649) was a Lutheran theologian and philosopher at Wittenberg. His teaching and writings addressed logic and metaphysics within Protestant scholasticism. He is distinct from Cornelius Martini at Helmstedt; their similar names should not cause their biographies or appointments to be merged.", "status": "Biographical entry", "sources": [{"title": "Martini, Jakob - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/100205828.html?language=en"}], "color": "#ec4899", "incoming": [152], "outgoing": [165, 166, 362, 363, 364], "originalYear": 1596, "sourceType": "Main roster", "rank": 25, "timeline": {"year": 1596, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 128, "name": "Rudolf Agricola", "aliases": ["Rudolf Agricola"], "bio": "Rudolf Agricola (1444–1485) was a northern European humanist known especially for De inventione dialectica. He studied and worked in several centers of learning, including Ferrara. His approach to argument, rhetoric, and education influenced later humanists, including the educational tradition associated with Erasmus.", "status": "Biographical entry", "sources": [{"title": "Agricola, Rudolf - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz474.html"}, {"title": "Rudolf Agricola (Wirtschaftswissenschaftler)", "url": "https://de.wikipedia.org/wiki/Rudolf_Agricola_%28Wirtschaftswissenschaftler%29"}, {"title": "Rudolf Agricola", "url": "https://it.wikipedia.org/wiki/Rudolf_Agricola"}], "color": "#ec4899", "incoming": [134, 135], "outgoing": [136], "originalYear": 1480, "sourceType": "Main roster", "rank": 1, "timeline": {"year": 1480, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 129, "name": "Theodore Gaza", "aliases": ["Theodoros Gazes"], "bio": "Theodore Gaza (c. 1400–1475), also called Theodoros Gazes, was a Greek humanist who taught and translated in Italy. His translations of Aristotle and writings on Greek grammar were important to Renaissance scholarship. His biography belongs to the movement of Byzantine learning into Italian humanist institutions.", "status": "Biographical entry", "sources": [{"title": "The Lost Poems on the Muses by Theodoros Gazes", "url": "https://www.academia.edu/143040569/The_Lost_Poems_on_the_Muses_by_Theodoros_Gazes"}, {"title": "GAZA, Theodore", "url": "https://dbcs.sas.rutgers.edu/all-scholars/gaza-theodore"}, {"title": "Theodorus Gaza", "url": "https://en.wikipedia.org/wiki/Theodorus_Gaza"}, {"title": "Teodoro Gaza", "url": "https://pt.wikipedia.org/wiki/Teodoro_Gaza"}], "color": "#ec4899", "incoming": [], "outgoing": [130], "originalYear": 1430, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1430, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 130, "name": "Demetrios Chalcocondyles", "aliases": ["Demetrios Chalcocondyles"], "bio": "Demetrios Chalcocondyles (1423–1511) was a Greek humanist who taught in Padua, Florence, and Milan. He helped prepare the first printed edition of Homer's works in Greek. His teaching trained readers and editors whose classical learning also supported Renaissance medicine and philosophy.", "status": "Biographical entry", "sources": [{"title": "Demetrios Chalkokondyles", "url": "https://en.wikipedia.org/wiki/Demetrios_Chalkokondyles"}, {"title": "Chalkokondyles, Demetrius", "url": "https://www.academia.edu/68629842/Chalkokondyles_Demetrius"}], "color": "#ec4899", "incoming": [129], "outgoing": [131], "originalYear": 1452, "sourceType": "Main roster", "rank": 1, "timeline": {"year": 1452, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 131, "name": "Janus Lascaris", "aliases": ["Janus Lascaris"], "bio": "Janus Lascaris (1445–1535) was a Greek humanist, librarian, and diplomat who worked in Italy and France. He collected manuscripts and edited Greek texts. His career illustrates the importance of libraries, printing, and patronage in transmitting classical learning across Renaissance Europe.", "status": "Biographical entry", "sources": [{"title": "Janus Lascaris’ Florentine Oration and the ‘Reception’ of Ancient Aeolism", "url": "https://www.academia.edu/41405002/Janus_Lascaris_Florentine_Oration_and_the_Reception_of_Ancient_Aeolism"}, {"title": "Janus Lascaris’ Florentine Oration and the ‘Reception’ of Ancient Aeolism", "url": "https://www.academia.edu/86384757/Janus_Lascaris_Florentine_Oration_and_the_Reception_of_Ancient_Aeolism"}, {"title": "Janus Lascaris", "url": "https://en.wikipedia.org/wiki/Janus_Lascaris"}, {"title": "CATHOLIC ENCYCLOPEDIA: Janus Lascaris", "url": "https://www.newadvent.org/cathen/09010c.htm"}], "color": "#ec4899", "incoming": [130], "outgoing": [112], "originalYear": 1472, "sourceType": "Main roster", "rank": 2, "timeline": {"year": 1472, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 132, "name": "Hermonymus of Sparta", "aliases": ["Hermonymus of Sparta"], "bio": "George Hermonymus, known as Hermonymus of Sparta, was a Greek scribe, diplomat, and teacher active in fifteenth-century western Europe. He taught Greek in Paris and worked with manuscripts. The relative scarcity of secure personal dates warrants approximate rather than invented chronological labels.", "status": "Biographical entry", "sources": [{"title": "George Hermonymus", "url": "https://en.wikipedia.org/wiki/George_Hermonymus"}], "color": "#ec4899", "incoming": [], "outgoing": [112], "originalYear": 1470, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1470, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 133, "name": "Jacques Lefèvre d'Étaples", "aliases": ["Jacques Lefèvre d'Étaples"], "bio": "Jacques Lefèvre d'Étaples (c. 1450–1536) taught philosophy in Paris before turning increasingly to biblical scholarship and religious reform. His work included editions and commentary on philosophical and mathematical traditions. His educational influence belongs to French humanism and should be distinguished from formal medical supervision.", "status": "Biographical entry", "sources": [{"title": "Jacques Lefèvre d'Étaples", "url": "https://plato.stanford.edu/archives/sum2017/entries/lefevre-etaples/"}, {"title": "Jacques Lefèvre d'Étaples", "url": "https://plato.stanford.edu/archives/fall2016/entries/lefevre-etaples/"}, {"title": "Jacques Lefèvre d'Étaples", "url": "https://en.wikipedia.org/wiki/Jacques_Lef%C3%A8vre_d%27%C3%89taples"}], "color": "#ec4899", "incoming": [], "outgoing": [112], "originalYear": 1480, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1480, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 134, "name": "Battista Guarino", "aliases": ["Battista Guarino"], "bio": "Battista Guarino (1434–1513) was an Italian humanist and teacher, the son of Guarino da Verona. He taught in Ferrara and wrote about humanist education. Classical language, rhetoric, and the organization of study are the relevant contributions behind his place in this genealogy.", "status": "Biographical entry", "sources": [{"title": "Battista Guarino", "url": "https://en.wikipedia.org/wiki/Battista_Guarino"}, {"title": "Guarino", "url": "https://history.hanover.edu/texts/guarino.html"}], "color": "#ec4899", "incoming": [], "outgoing": [128], "originalYear": 1460, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1460, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 135, "name": "Ludovico Carbone", "aliases": ["Ludovico Carbone"], "bio": "Ludovico Carbone (1430–1485) was an Italian humanist, poet, translator, and orator associated with Ferrara. His career was embedded in court and university culture. His connection to Agricola concerns humanist education, not a mathematics degree.", "status": "Biographical entry", "sources": [{"title": "TUI 1584 ‘metadata’ Authors", "url": "https://amesfoundation.law.harvard.edu/digital/tui/TUI1584Metadata_Authors_rev.php"}, {"title": "Luigi Orlandi", "url": "https://files.core.ac.uk/download/637930138.pdf"}], "color": "#ec4899", "incoming": [], "outgoing": [128], "originalYear": 1465, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1465, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 136, "name": "Alexander Hegius", "aliases": ["Alexander Hegius"], "bio": "Alexander Hegius (c. 1433–1498) was a humanist schoolmaster, best known for his work at Deventer. His teaching emphasized classical languages and influenced the education of Erasmus. School teaching is a genuine historical relationship, but it should not be labeled doctoral supervision.", "status": "Biographical entry", "sources": [{"title": "Hegius, Alexander - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd100290132.html"}, {"title": "Hegius, Alexander - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz28688.html"}, {"title": "\"Alexander Hegius (ca. 1433-98) : His life, Philosophy, and Pedagogy\" by John V. Matthews", "url": "https://digitalcommons.andrews.edu/dissertations/566/"}], "color": "#ec4899", "incoming": [128], "outgoing": [138], "originalYear": 1463, "sourceType": "Main roster", "rank": 2, "timeline": {"year": 1463, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 137, "name": "Jan Standonck", "aliases": ["Jan Standonck"], "bio": "Jan Standonck (1453–1504) was an educator and religious reformer associated with the Collège de Montaigu in Paris. His reforms stressed discipline, communal life, and the education of poor students. Erasmus's experience of that institution forms part of the context for their connection.", "status": "Biographical entry", "sources": [{"title": "Standonck, Johann - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/131341189.html?language=en"}, {"title": "Jan Standonck", "url": "https://en.wikipedia.org/wiki/Jan_Standonck"}, {"title": "Jan Standonck", "url": "https://it.wikipedia.org/wiki/Jan_Standonck"}], "color": "#ec4899", "incoming": [], "outgoing": [138], "originalYear": 1490, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1490, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 138, "name": "Desiderius Erasmus", "aliases": ["Desiderius Erasmus"], "bio": "Desiderius Erasmus (c. 1466–1536) was a humanist, classical scholar, and editor of the Greek New Testament. His writings on education, religious life, and classical culture circulated widely across Europe. His doctorate was in theology at Turin in 1506; it was not a mathematics doctorate.", "status": "Biographical entry", "sources": [{"title": "Desiderius Erasmus", "url": "https://plato.stanford.edu/entries/erasmus/"}, {"title": "Desiderius Erasmus", "url": "https://plato.stanford.edu/archives/spr2016/entries/erasmus/"}, {"title": "Desiderius Erasmus", "url": "https://plato.stanford.edu/archives/fall2014/entries/erasmus/"}, {"title": "Erasmus, Desiderius | Internet Encyclopedia of Philosophy", "url": "https://iep.utm.edu/erasmus/"}], "color": "#ec4899", "incoming": [136, 137], "outgoing": [122], "originalYear": 1506, "sourceType": "Main roster", "rank": 3, "timeline": {"year": 1506, "kind": "Recorded milestone", "basis": "Theology doctorate, Turin", "estimated": false}}, {"id": 139, "name": "Ulrich Zasius", "aliases": ["Ulrich Zasius"], "bio": "Ulrich Zasius (1461–1535) was a jurist and humanist associated with Freiburg im Breisgau. His legal teaching and scholarship were influential in Renaissance jurisprudence. The original file placed him at Ingolstadt; the biographical record instead points to Freiburg as the principal institutional setting.", "status": "Biographical entry", "sources": [{"title": "Zasius, Ulrich - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd118772295.html"}, {"title": "Zasius, Ulrich - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd118772295.html?language=en"}, {"title": "Zasius, Ulrich - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz86438.html"}, {"title": "Zasius, Ulrich - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd118772295.html?language=de"}], "color": "#ec4899", "incoming": [], "outgoing": [122], "originalYear": 1501, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1501, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 140, "name": "Jacob ben Jehiel Loans", "aliases": ["Jacob ben Jehiel Loans"], "bio": "Jacob ben Jehiel Loans, who died in 1506, was a Jewish scholar and physician associated with the court of Emperor Frederick III. He taught Hebrew to Johannes Reuchlin. This is a documented kind of scholarly exchange that should be represented as language teaching, not a mathematical doctoral connection.", "status": "Biographical entry", "sources": [{"title": "Jacob ben Jehiel Loans", "url": "https://en.wikipedia.org/wiki/Jacob_ben_Jehiel_Loans"}], "color": "#ec4899", "incoming": [], "outgoing": [23], "originalYear": 1450, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1450, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 141, "name": "Johannes Stöffler", "aliases": ["Johannes Stöffler"], "bio": "Johannes Stöffler (1452–1531) was a mathematician, astronomer, priest, and maker of astronomical instruments associated with Tübingen. His work included calendars and astronomical tables. His teaching is part of the scientific educational context in which Melanchthon developed.", "status": "Biographical entry", "sources": [{"title": "Stoeffler, Johannes - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd118798979.html"}, {"title": "Johannes Stöffler", "url": "https://en.wikipedia.org/wiki/Johannes_St%C3%B6ffler"}, {"title": "Johannes Stöffler", "url": "https://de.wikipedia.org/wiki/Johannes_St%C3%B6ffler"}, {"title": "Johannes Stöffler", "url": "https://it.wikipedia.org/wiki/Johannes_St%C3%B6ffler"}], "color": "#ec4899", "incoming": [], "outgoing": [24], "originalYear": 1476, "sourceType": "Main roster", "rank": 0, "timeline": {"year": 1476, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 142, "name": "Peter Werenfels", "aliases": ["Peter Werenfels"], "bio": "Peter Werenfels (1627–1703) was a Swiss theologian, professor at Basel, and leader of the Basel church. He belongs to the theological educational background of the Bernoulli generation. His inclusion illustrates why premodern ancestry cannot be interpreted as an unbroken sequence of mathematics Ph.D.s.", "status": "Biographical entry", "sources": [{"title": "Werenfels, Peter - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd124314805.html?language=en"}, {"title": "Werenfels, Samuel - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd12209025X.html?language=en"}, {"title": "Peter Werenfels", "url": "https://en.wikipedia.org/wiki/Peter_Werenfels"}, {"title": "Peter Werenfels", "url": "https://pt.wikipedia.org/wiki/Peter_Werenfels"}], "color": "#3b82f6", "incoming": [124], "outgoing": [55], "originalYear": 1649, "sourceType": "Main roster", "rank": 26, "timeline": {"year": 1649, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 143, "name": "Andreas Vesalius", "aliases": ["Andreas Vesalius"], "bio": "Andreas Vesalius (1514–1564) transformed anatomical teaching through human dissection and the illustrated De humani corporis fabrica, published in 1543. He taught at Padua and later served as an imperial physician. His criticisms of inherited anatomical authority shaped the medical branches represented here.", "status": "Biographical entry", "sources": [{"title": "Andreas Vesalius (1514–1564) | Embryo Project Encyclopedia", "url": "https://embryo.asu.edu/pages/andreas-vesalius-1514-1564"}], "color": "#3b82f6", "incoming": [112, 110, 125], "outgoing": [144], "originalYear": 1537, "sourceType": "Main roster", "rank": 5, "timeline": {"year": 1537, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 144, "name": "Matteo Realdo Colombo", "aliases": ["Matteo Realdo Colombo"], "bio": "Realdo Colombo (c. 1516–1559) was an Italian anatomist and surgeon who taught in Padua, Pisa, and Rome. His De re anatomica described pulmonary circulation and other anatomical observations. His career should be reconstructed through appointments and publications rather than assumed to follow a simple doctoral chain.", "status": "Needs research", "sources": [], "color": "#3b82f6", "incoming": [143], "outgoing": [145], "originalYear": 1544, "sourceType": "Main roster", "rank": 6, "timeline": {"year": 1544, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 145, "name": "Gabriele Falloppio", "aliases": ["Gabriele Falloppio"], "bio": "Gabriele Falloppio (1522/23–1562) taught anatomy and medicine, especially at Padua. His anatomical investigations included the ear, reproductive organs, and other structures, and his Observationes anatomicae appeared in 1561. Several later physicians in the chart studied within the teaching tradition associated with him.", "status": "Biographical entry", "sources": [{"title": "Gabriele Falloppio", "url": "https://en.wikipedia.org/wiki/Gabriele_Falloppio"}], "color": "#3b82f6", "incoming": [144], "outgoing": [62, 147], "originalYear": 1547, "sourceType": "Main roster", "rank": 7, "timeline": {"year": 1547, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 146, "name": "Johannes Nicolaus Stupanus", "aliases": ["Johannes Nicolaus Stupanus"], "bio": "Johannes Nicolaus Stupanus (1542–1621) was a physician, translator, and professor at Basel. His career also included philosophical and literary work. He was the father of Emmanuel Stupanus; the family link and the academic relationship should both be considered without assuming they are interchangeable.", "status": "Biographical entry", "sources": [{"title": "Stupanus", "url": "https://de.wikipedia.org/wiki/Stupanus"}, {"title": "Emmanuel Stupanus", "url": "https://de.wikipedia.org/wiki/Emmanuel_Stupanus"}, {"title": "Experientia and the Machiavellian turn in religio-political and scientific thinking: Basel in 1580", "url": "https://www.academia.edu/25481652/Experientia_and_the_Machiavellian_turn_in_religio_political_and_scientific_thinking_Basel_in_1580_History_of_European_Ideas_42_2016_857_881"}, {"title": "Johann Nikolaus Stupanus - Wikidata", "url": "https://www.wikidata.org/wiki/Q6216160"}], "color": "#3b82f6", "incoming": [62], "outgoing": [64], "originalYear": 1569, "sourceType": "Main roster", "rank": 9, "timeline": {"year": 1569, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 147, "name": "Hieronymus Fabricius", "aliases": ["Hieronymus Fabricius"], "bio": "Hieronymus Fabricius of Aquapendente (1537–1619) taught anatomy at Padua and contributed to comparative anatomy and embryology. His studies of venous valves influenced later work on circulation. William Harvey was among his pupils, though the supplied tree does not attempt to enumerate all of his students.", "status": "Biographical entry", "sources": [{"title": "Treasures from the Rare Book Room: Hieronymus Fabricius Scrutinized – HSLS Update", "url": "https://info.hsls.pitt.edu/updatereport/2015/april-2015/treasures-from-the-rare-book-room-hieronymus-fabricius-scrutinized/"}, {"title": "Harvey's Teacher in Padua: Hieronymus Fabricius of Aquapendente (1537–1619) | cabinet", "url": "https://www.cabinet.ox.ac.uk/harveys-teacher-padua-hieronymus-fabricius-aquapendente-1537-1619"}, {"title": "Hieronymus Fabricius", "url": "https://en.wikipedia.org/wiki/Hieronymus_Fabricius"}], "color": "#3b82f6", "incoming": [145], "outgoing": [148], "originalYear": 1559, "sourceType": "Main roster", "rank": 8, "timeline": {"year": 1559, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 148, "name": "Salomon Alberti", "aliases": ["Salomon Alberti"], "bio": "Salomon Alberti (1540–1600) was a German physician and anatomist associated with Wittenberg and Dresden. He studied anatomy in Italy and published observations on venous valves and other structures. His work helps explain the connection between the Paduan anatomical tradition and German medical education.", "status": "Biographical entry", "sources": [{"title": "Salomon Alberti", "url": "https://en.wikipedia.org/wiki/Salomon_Alberti"}], "color": "#ec4899", "incoming": [147], "outgoing": [126], "originalYear": 1574, "sourceType": "Main roster", "rank": 9, "timeline": {"year": 1574, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 149, "name": "Valentin Thau", "aliases": ["Valentin Thau"], "bio": "Valentin Thau (1531–1575) was a German mathematician associated with Leipzig. His writings defended the value of geometry and mathematical study within university education. The exact teacher–student edges in the imported branch still require documentary confirmation.", "status": "Biographical entry", "sources": [{"title": "Valentin Thau", "url": "https://de.wikipedia.org/wiki/Valentin_Thau"}, {"title": "Valentin Thau", "url": "https://pt.wikipedia.org/wiki/Valentin_Thau"}], "color": "#ec4899", "incoming": [24], "outgoing": [150], "originalYear": 1550, "sourceType": "Main roster", "rank": 21, "timeline": {"year": 1550, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 150, "name": "Paul Wittich", "aliases": ["Paul Wittich"], "bio": "Paul Wittich (1546–1586) was an astronomer associated with Breslau and with late sixteenth-century astronomical calculation. He contributed to computational techniques, including the use of trigonometric identities in multiplication. His contact with Tycho Brahe and other astronomers places him in a wider network than the single inherited edge suggests.", "status": "Biographical entry", "sources": [{"title": "Paul Wittich (1546 - 1586) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Wittich/"}, {"title": "Paul Wittich (1546 - 1586) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Wittich/"}, {"title": "Wittich, Paul - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz85947.html"}, {"title": "Biographical Encyclopedia of Astronomers", "url": "https://mathshistory.st-andrews.ac.uk/BEA/wittich_bea.pdf"}], "color": "#ec4899", "incoming": [149], "outgoing": [151], "originalYear": 1570, "sourceType": "Main roster", "rank": 22, "timeline": {"year": 1570, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 151, "name": "Duncan Liddel", "aliases": ["Duncan Liddel"], "bio": "Duncan Liddel (1561–1613) was a Scottish mathematician, astronomer, and physician who studied and taught on the Continent, notably at Helmstedt. He later returned to Aberdeen and endowed educational support. His biography joins mathematical teaching, medicine, and the international movement of scholars.", "status": "Biographical entry", "sources": [{"title": "Duncan Liddel (1561 - 1613) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Liddel/"}, {"title": "Duncan Liddel (1561 - 1613) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Liddel/"}, {"title": "Liddel life - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Extras/Liddel_life/"}, {"title": "LIDDELL, DUNCAN [SSNE 1543] - The Scotland, Scandinavia and Northern European Biographical Database", "url": "https://www.st-andrews.ac.uk/history/ssne/item.php?id=1543"}], "color": "#ec4899", "incoming": [150], "outgoing": [152], "originalYear": 1596, "sourceType": "Main roster", "rank": 23, "timeline": {"year": 1596, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 152, "name": "Cornelius Martini", "aliases": ["Cornelius Martini"], "bio": "Cornelius Martini (1568–1621) was a philosopher and logician at Helmstedt. His work helped establish a Protestant scholastic treatment of metaphysics and logic. He is distinct from Jakob Martini of Wittenberg; their educational relationships should be checked individually rather than inferred from the shared surname.", "status": "Biographical entry", "sources": [{"title": "Liste der Biografien/Martini", "url": "https://de.wikipedia.org/wiki/Liste_der_Biografien/Martini"}], "color": "#ec4899", "incoming": [151], "outgoing": [127], "originalYear": 1591, "sourceType": "Main roster", "rank": 24, "timeline": {"year": 1591, "kind": "Imported estimate", "basis": "Approximate historical anchor retained from the supplied tree; not verified as a degree date.", "estimated": true}}, {"id": 153, "name": "Abu 'Ubayd al-Juzjani", "aliases": ["Abu 'Ubayd al-Juzjani"], "bio": "Abu Ubayd al-Juzjani was a student and companion of Avicenna. His continuation of Avicenna's autobiography is a major source for the philosopher's life and writings. His importance is therefore both intellectual and documentary: he helped preserve an account of the teacher whose work he studied.", "status": "Biographical entry", "sources": [{"title": "Ibn Sina [Avicenna]", "url": "https://plato.stanford.edu/entries/ibn-sina/index.html"}, {"title": "Jūzjānī: Abū ʿUbayd ʿAbd al‐Wāḥid ibn Muḥammad al‐Jūzjānī | ISMI", "url": "https://ismi.mpiwg-berlin.mpg.de/biography/Juzjani_BEA.htm"}, {"title": "Abū ʿUbayd ʿAbd al-Wāḥid ibn Muḥammad al-Jūzjānī | ISMI", "url": "https://ismi.mpiwg-berlin.mpg.de/person/74872"}], "color": "#10b981", "incoming": [3], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 2, "timeline": {"year": 1025, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 154, "name": "Abu 'Abd Allah al-Ma'sumi", "aliases": ["Abu 'Abd Allah al-Ma'sumi"], "bio": "Abu Abd Allah al-Ma'sumi appears in accounts of Avicenna's students and intellectual circle. Biographical information is sparse, and his own works and life dates need further identification. His place in the chart is preserved without substituting Avicenna's biography for his own.", "status": "Needs research", "sources": [{"title": "Ibn Sina [Avicenna]", "url": "https://plato.stanford.edu/archives/fall2023/entries/ibn-sina/"}, {"title": "Ibn Sina [Avicenna]", "url": "https://plato.stanford.edu/entries/ibn-sina/"}, {"title": "Avicenna (980 - 1037) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Avicenna/"}], "color": "#10b981", "incoming": [3], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 2, "timeline": {"year": 1025, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 155, "name": "Ibn Zayla", "aliases": ["Ibn Zayla"], "bio": "Ibn Zayla was an eleventh-century student in Avicenna's circle. His surviving work is associated particularly with music theory and philosophy. He represents the breadth of subjects studied in that circle, rather than a narrowly mathematical line of descent.", "status": "Needs research", "sources": [], "color": "#10b981", "incoming": [3], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 2, "timeline": {"year": 1025, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 156, "name": "Abu'l-Abbas al-Lawkari", "aliases": ["Abu'l-Abbas al-Lawkari"], "bio": "Abu al-Abbas al-Lawkari was a philosopher in the later Avicennian tradition. His Bayan al-haqq organized philosophical material into a substantial synthesis, including natural philosophy. Modern editions and historical studies offer a stronger basis for his biography than the original one-line descendant label.", "status": "Needs research", "sources": [], "color": "#10b981", "incoming": [4], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 3, "timeline": {"year": 1065, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 157, "name": "Abu Hatim al-Muzaffar al-Isfizari", "aliases": ["Abu Hatim al-Muzaffar al-Isfizari"], "bio": "Al-Isfizari was a mathematician and natural philosopher active in the late eleventh and early twelfth centuries. He is associated with mechanics, balances, and the astronomical setting of the Seljuk period. A connection to Khayyam's scholarly environment does not by itself establish a doctoral-style relationship.", "status": "Biographical entry", "sources": [{"title": "Isfizārī: Abū Ḥātim al‐Muẓaffar ibn Ismāʿīl al‐Isfizārī | ISMI", "url": "https://ismi.mpiwg-berlin.mpg.de/biography/Isfizari_BEA.htm"}, {"title": "Abū Ḥātim al-Muẓaffar ibn Ismāʿīl al-Isfizārī | ISMI", "url": "https://ismi.mpiwg-berlin.mpg.de/person/31986"}, {"title": "\"İsfahan (Melikşah) Gözlemevi’nin mekanik bilimcisi: Ebû Hâtim Muzaffer B. İsmâîl el İsfizârî\", Turkish Studies - Historical Analysis, 2020, 15 (1), s. 150-160.", "url": "https://www.academia.edu/42317926/_%C4%B0sfahan_Melik%C5%9Fah_G%C3%B6zlemevi_nin_mekanik_bilimcisi_Eb%C3%BB_H%C3%A2tim_Muzaffer_B_%C4%B0sm%C3%A2%C3%AEl_el_%C4%B0sfiz%C3%A2r%C3%AE_Turkish_Studies_Historical_Analysis_2020_15_1_s_150_160"}], "color": "#10b981", "incoming": [5], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 4, "timeline": {"year": 1093, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 158, "name": "Abd al-Rahman al-Khazini", "aliases": ["Abd al-Rahman al-Khazini"], "bio": "Al-Khazini was a twelfth-century scholar associated with Merv. His Book of the Balance of Wisdom treated balances, weights, and hydrostatics, and he also compiled astronomical tables. His work exemplifies the close connection between mathematical calculation, measurement, and instrument design.", "status": "Biographical entry", "sources": [{"title": "Al-Khazini, Abu’l-Fath ‘Abd Al-Ra?man [Sometimes Abu Man?ur ’ Abd Al-Ra?man or ’Abd Al-Rahman Man?ur] | Encyclopedia.com", "url": "https://www.encyclopedia.com/science/dictionaries-thesauruses-pictures-and-press-releases/al-khazini-abul-fath-abd-al-raman-sometimes-abu-manur-abd-al-raman-or-abd-al-rahman-manur"}], "color": "#10b981", "incoming": [5], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 4, "timeline": {"year": 1093, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 159, "name": "Zayn al-Din al-Kashshi", "aliases": ["Zayn al-Din al-Kashshi"], "bio": "Zayn al-Din al-Kashshi was a philosopher and logician connected with the tradition of Fakhr al-Din al-Razi. Scholarship on his logical writings and his treatment of law provides evidence of his intellectual activity. Personal dates and the precise teaching relationship require further checking.", "status": "Biographical entry", "sources": [{"title": "Hisashi Obuchi - Albert-Ludwigs-Universität Freiburg - Updated 2026", "url": "https://uni-freiburg.academia.edu/HisashiObuchi/Conference%20Presentations"}, {"title": "Book Review", "url": "https://journals.library.columbia.edu/index.php/alusur/article/download/uw33husayn/uw33husayn/41577"}, {"title": "Hisashi Obuchi - Albert-Ludwigs-Universität Freiburg - Updated 2026", "url": "https://uni-freiburg.academia.edu/HisashiObuchi/Book%20Chapter"}, {"title": "Fakhr al-Dīn al-Rāzī and Occult Science as Philosophy: An Aspect of the Philosophical Theology of Islam at the Beginning of the Thirteenth Century", "url": "https://www.academia.edu/36384560/Fakhr_al_D%C4%ABn_al_R%C4%81z%C4%AB_and_Occult_Science_as_Philosophy_An_Aspect_of_the_Philosophical_Theology_of_Islam_at_the_Beginning_of_the_Thirteenth_Century"}], "color": "#10b981", "incoming": [8], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 6, "timeline": {"year": 1204, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 160, "name": "Siraj al-Din al-Urmawi", "aliases": ["Siraj al-Din al-Urmawi"], "bio": "Siraj al-Din al-Urmawi (1198–1283) was a philosopher, logician, and jurist active in the medieval Islamic world. His logical writings became part of a continuing handbook tradition. His relationship to al-Razi's intellectual school should be distinguished from a modern doctoral affiliation.", "status": "Biographical entry", "sources": [{"title": "The Islamisation of Anatolia project", "url": "https://www.islam-anatolia.ac.uk/data/documents/TK_Kon_Yus_5482?hl=%E2%80%8F&hlu="}, {"title": "Being Another Way", "url": "https://webfiles.ucpress.edu/oa/9780520401648_WEB.pdf"}, {"title": "Fakhr al-Din al-Razi", "url": "https://en.wikipedia.org/wiki/Fakhr_al-Din_al-Razi"}, {"title": "Safi al-Din al-Hindi", "url": "https://en.wikipedia.org/wiki/Safi_al-Din_al-Hindi"}], "color": "#10b981", "incoming": [8], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 6, "timeline": {"year": 1233, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 161, "name": "Ibn Khallikan", "aliases": ["Ibn Khallikan"], "bio": "Ibn Khallikan (1211–1282) was a jurist and biographer whose Wafayat al-a'yan preserves accounts of notable scholars and other figures. His work is a major historical resource for Islamic intellectual history. His presence in the chart reflects education and scholarly transmission beyond mathematics.", "status": "Biographical entry", "sources": [{"title": "Ibn Khallikan", "url": "https://en.wikipedia.org/wiki/Ibn_Khallikan"}, {"title": "Ibn Khallikan", "url": "https://es.wikipedia.org/wiki/Ibn_Khallikan"}], "color": "#10b981", "incoming": [9], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 6, "timeline": {"year": 1246, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 162, "name": "Qutb al-Din al-Shirazi", "aliases": ["Qutb al-Din al-Shirazi"], "bio": "Qutb al-Din al-Shirazi (1236–1311) was a physician, astronomer, and philosopher who studied with Nasir al-Din al-Tusi. His writings addressed astronomy, optics, and philosophy. He belongs to the intellectual network associated with Maragha and the development of mathematical astronomy.", "status": "Biographical entry", "sources": [{"title": "Qutb al-Din al-Shirazi", "url": "https://en.wikipedia.org/wiki/Qutb_al-Din_al-Shirazi"}, {"title": "Shīrāzī: Quṭb al‐Dīn Maḥmūd ibn Masʿūd Muṣliḥ al‐Shīrāzī | ISMI", "url": "https://ismi.mpiwg-berlin.mpg.de/biography/Shirazi_BEA.htm"}], "color": "#10b981", "incoming": [12], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 9, "timeline": {"year": 1271, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 163, "name": "Allamah al-Hilli", "aliases": ["Allamah al-Hilli"], "bio": "Al-Allama al-Hilli (1250–1325) was a major Twelver Shi'i theologian and jurist. He also studied and wrote on philosophy and logic and was connected with Nasir al-Din al-Tusi. His work belongs to the theological and philosophical side of the network.", "status": "Needs research", "sources": [], "color": "#10b981", "incoming": [12], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 9, "timeline": {"year": 1285, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 164, "name": "Bar Hebraeus", "aliases": ["Bar Hebraeus"], "bio": "Bar Hebraeus (1226–1286) was a Syriac church leader and polymath. His writings included history, theology, philosophy, medicine, and astronomy. His contacts with Islamic scholars illustrate an interconnected intellectual world, but contact and collaboration should not automatically be converted into formal supervision.", "status": "Biographical entry", "sources": [{"title": "Barhebraeus", "url": "https://en.wikipedia.org/wiki/Barhebraeus"}], "color": "#10b981", "incoming": [12], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 9, "timeline": {"year": 1256, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 165, "name": "Daniel Sennert", "aliases": ["Daniel Sennert"], "bio": "Daniel Sennert (1572–1637) was a physician and professor at Wittenberg. His medical and natural-philosophical writings combined inherited learning with chemical and corpuscular ideas. His teaching and publications contributed to debates about matter and medicine in the early seventeenth century.", "status": "Biographical entry", "sources": [{"title": "Sennert, Daniel - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd117478091.html?language=en"}, {"title": "Daniel Sennert’s Dissertations and the", "url": "https://scholar.harvard.edu/sites/scholar.harvard.edu/files/goeing/files/goeing-sennert-2023.pdf"}, {"title": "Daniel Sennert’s Dissertations 123", "url": "https://goeing.scholars.harvard.edu/sites/g/files/omnuum9486/files/goeing/files/goeing-sennert-2023.pdf"}, {"title": "Daniel Sennert", "url": "https://en.wikipedia.org/wiki/Daniel_Sennert"}], "color": "#ec4899", "incoming": [127], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 26, "timeline": {"year": 1604, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 166, "name": "Georg Großhain", "aliases": ["Georg Grosshain", "Georg Großhain"], "bio": "Georg Großhain was a German theologian associated with university teaching in the seventeenth century. Biographical and educational records name him in the training of later theologians. “Georg Grosshain” and “Georg Großhain” in the original have been merged as spelling variants.", "status": "Biographical entry", "sources": [{"title": "Grosshain, Georg - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/ppn102486220.html"}, {"title": "Johannes Musaeus", "url": "https://en.wikipedia.org/wiki/Johannes_Musaeus"}], "color": "#ec4899", "incoming": [127], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 26, "timeline": {"year": 1621, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 167, "name": "George Chrysokokkes", "aliases": ["George Chrysokokkes"], "bio": "George Chrysokokkes, also written Chrysococces, was a Byzantine physician and astronomical writer. His work belongs to the reception of Persian astronomical learning in the fourteenth century. His connection with Chioniades is best investigated through the transmission of texts, not assumed to be a formal doctorate.", "status": "Biographical entry", "sources": [{"title": "Georges Chrysococcès", "url": "https://fr.wikipedia.org/wiki/Georges_Chrysococc%C3%A8s"}], "color": "#8b5cf6", "incoming": [14], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 11, "timeline": {"year": 1325, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 168, "name": "Nikephoros Gregoras", "aliases": ["Nikephoros Gregoras"], "bio": "Nikephoros Gregoras (c. 1295–1360) was a Byzantine historian, astronomer, and theologian associated with Theodore Metochites. He proposed calendar reform and wrote a substantial history of his period. His later career also involved controversy over Palamite theology.", "status": "Biographical entry", "sources": [{"title": "Nikephoros Gregoras - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz144933.html"}, {"title": "Nikephoros Gregoras - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd118697463.html"}, {"title": "Nikephoros Gregoras - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz144933.html?language=en"}, {"title": "Who Writes the History of the Romans? Agency and Causality in Nikephoros Gregoras’ \"Historia Rhōmaïkē\"", "url": "https://www.academia.edu/37652238/Who_Writes_the_History_of_the_Romans_Agency_and_Causality_in_Nikephoros_Gregoras_Historia_Rh%C5%8Dma%C3%AFk%C4%93_"}], "color": "#8b5cf6", "incoming": [16], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 13, "timeline": {"year": 1327, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 169, "name": "Manuel Chrysoloras", "aliases": ["Manuel Chrysoloras"], "bio": "Manuel Chrysoloras (c. 1355–1415) was a Byzantine diplomat and teacher of Greek in Italy. His teaching in Florence and his Greek grammar helped establish systematic Greek study among Italian humanists. His role is educational and linguistic rather than that of a mathematics doctoral adviser.", "status": "Biographical entry", "sources": [{"title": "Chrysoloras, Manuel, c 1350-1415 (Diplomat, scholar and teacher of Greek literature) | ArchivesSpace Public Interface", "url": "https://archives.collections.ed.ac.uk/agents/people/16658"}, {"title": "Manuel Chrysoloras", "url": "https://en.wikipedia.org/wiki/Manuel_Chrysoloras"}, {"title": "CHRYSOLARAS, Manuel", "url": "https://dbcs.sas.rutgers.edu/all-scholars/chrysolaras-manuel"}], "color": "#8b5cf6", "incoming": [19], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 16, "timeline": {"year": 1385, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 170, "name": "Mark Eugenikos", "aliases": ["Mark Eugenikos"], "bio": "Mark of Ephesus (1392–1444), also called Mark Eugenikos, was a Byzantine theologian and metropolitan. He is especially known for opposing the church union negotiated at Florence. He belongs to the philosophical and theological environment of late Byzantium.", "status": "Biographical entry", "sources": [{"title": "Mark of Ephesus (1392-1444): revisiting the sources on his life and work", "url": "https://orca.cardiff.ac.uk/id/eprint/181673/"}], "color": "#8b5cf6", "incoming": [20], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 17, "timeline": {"year": 1418, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 171, "name": "George Scholarios", "aliases": ["George Scholarios"], "bio": "George Scholarios, later Patriarch Gennadios II (c. 1400–c. 1473), was a Byzantine philosopher and theologian. He engaged with Aristotelian and Latin scholastic thought and became patriarch after the Ottoman conquest of Constantinople. His relationship with Plethon included intellectual disagreement as well as a shared scholarly setting.", "status": "Biographical entry", "sources": [{"title": "CATHOLIC ENCYCLOPEDIA: Gennadius II", "url": "https://www.newadvent.org/cathen/06416b.htm"}], "color": "#8b5cf6", "incoming": [20], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 17, "timeline": {"year": 1435, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 172, "name": "Laonikos Chalkokondyles", "aliases": ["Laonikos Chalkokondyles"], "bio": "Laonikos Chalkokondyles was a fifteenth-century Greek historian associated with the intellectual world of Mistra. His Histories recount the rise of the Ottomans and the changing political order of his period. He should not be confused with the humanist Demetrios Chalcocondyles.", "status": "Biographical entry", "sources": [{"title": "Laonikos Chalkokondyles and his Demonstrations of Histories, Books I-III¹⁵⁷", "url": "https://research.sabanciuniv.edu/id/eprint/24248/1/HenryR.Shapiro_409826.pdf"}, {"title": "Laonikos Chalkokondyles", "url": "https://en.wikipedia.org/wiki/Laonikos_Chalkokondyles"}, {"title": "Laonikos Chalkokondyles and the rise of the Ottoman Turks*", "url": "https://www.cambridge.org/core/journals/byzantine-and-modern-greek-studies/article/abs/laonikos-chalkokondyles-and-the-rise-of-the-ottoman-turks/7B9544CD8CAEBE74A06FD465B707E55D"}], "color": "#8b5cf6", "incoming": [20], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 17, "timeline": {"year": 1435, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 173, "name": "Niccolò Perotti", "aliases": ["Niccolò Perotti"], "bio": "Niccolò Perotti (1429–1480) was an Italian humanist and churchman. His grammatical and lexicographical writings, including the Cornu copiae, contributed to Renaissance Latin scholarship. His association with Bessarion belongs to a network of patronage, translation, and humanist learning.", "status": "Biographical entry", "sources": [{"title": "Niccolò Perotti and the ars traducendi (Sol et homo. Mensch und Natur in der Renaissance", "url": "https://www.academia.edu/7644519/Niccol%C3%B2_Perotti_and_the_ars_traducendi_Sol_et_homo_Mensch_und_Natur_in_der_Renaissance"}, {"title": "Niccolò Perotti", "url": "https://en.wikipedia.org/wiki/Niccol%C3%B2_Perotti"}, {"title": "Niccolò Perotti: Rudimenta grammatices - Einleitung", "url": "https://diglib.hab.de/content.php?dir=ebooks%2Fed000171&distype=optional&metsID=perottus&xml=texts%2Fperotti.xml&xsl=scripts%2Ftei-introduction.xsl"}], "color": "#ec4899", "incoming": [21], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 18, "timeline": {"year": 1454, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 174, "name": "Domizio Calderini", "aliases": ["Domizio Calderini"], "bio": "Domizio Calderini (1446–1478) was an Italian humanist and classical commentator. He taught and worked in Rome and published commentary on Latin authors. His career illustrates the literary and philological branches of the Renaissance scholarly network.", "status": "Biographical entry", "sources": [{"title": "MATERIALI BIOGRAFICI ANTICHI SU GIOVENALE RECUPERATI DA DOMIZIO CALDERINI", "url": "https://www.academia.edu/17570692/MATERIALI_BIOGRAFICI_ANTICHI_SU_GIOVENALE_RECUPERATI_DA_DOMIZIO_CALDERINI"}, {"title": "Calderini", "url": "https://en.wikipedia.org/wiki/Calderini"}], "color": "#ec4899", "incoming": [21], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 18, "timeline": {"year": 1462, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 175, "name": "Donato Acciaiuoli", "aliases": ["Donato Acciaiuoli"], "bio": "Donato Acciaiuoli (1429–1478) was a Florentine humanist and statesman. He studied Greek learning and wrote or translated works in the philosophical and historical traditions. His education with Argyropoulos is part of the Florentine reception of Greek philosophy.", "status": "Biographical entry", "sources": [{"title": "Donato Acciaiuoli, <i>Charlemagne’s Life<\/i> | ILLUMINATED", "url": "https://fitzmuseum.cam.ac.uk/illuminated/manuscript/discover/donato-acciaiuoli-charlemagnes-life"}, {"title": "Acciaiuoli, Donato - Springer Encyclopedia of Renaissance Philosophy", "url": "https://www.academia.edu/27045284/Acciaiuoli_Donato_Springer_Encyclopedia_of_Renaissance_Philosophy"}, {"title": "Folio 1v | Donato Acciaiuoli, <i>Charlemagne’s Life<\/i> | ILLUMINATED", "url": "https://www.fitzmuseum.cam.ac.uk/illuminated/manuscript/discover/donato-acciaiuoli-charlemagnes-life/folio/folio-1v-270"}, {"title": "Folio 2r | Donato Acciaiuoli, <i>Charlemagne’s Life<\/i> | ILLUMINATED", "url": "https://www.fitzmuseum.cam.ac.uk/illuminated/manuscript/discover/donato-acciaiuoli-charlemagnes-life/folio/folio-2r-271"}], "color": "#ec4899", "incoming": [22], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 19, "timeline": {"year": 1453, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 176, "name": "Bartolomeo Platina", "aliases": ["Bartolomeo Platina"], "bio": "Bartolomeo Platina (1421–1481) was an Italian humanist, writer, and papal librarian. He wrote on the lives of popes and on food and health and became involved in the organization of the Vatican Library. His place in this chart reflects humanist education and patronage.", "status": "Biographical entry", "sources": [{"title": "Bartolomeo Platina", "url": "https://en.wikipedia.org/wiki/Bartolomeo_Platina"}, {"title": "CATHOLIC ENCYCLOPEDIA: Bartolomeo Platina", "url": "https://www.newadvent.org/cathen/12158a.htm"}], "color": "#ec4899", "incoming": [22], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 19, "timeline": {"year": 1451, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 177, "name": "Angelo Poliziano", "aliases": ["Angelo Poliziano"], "bio": "Angelo Poliziano (1454–1494) was a Florentine poet and classical scholar associated with the Medici. His textual criticism and teaching brought Greek and Latin literature into close dialogue. His intellectual biography extends well beyond the single teaching connection shown in the graph.", "status": "Biographical entry", "sources": [{"title": "Gallery of Philologists | Angelo Poliziano", "url": "https://www.umass.edu/wsp/method/philology/gallery/poliziano.html"}, {"title": "Angelo Poliziano (1454-1494)", "url": "https://userhome.brooklyn.cuny.edu/bonaffini/jit/JIT17-2.pdf"}, {"title": "Angelo Poliziano", "url": "https://www.cambridge.org/core/books/abs/cambridge-translations-of-renaissance-philosophical-texts/angelo-poliziano/85C5172BBE56FF27AD92BDFD6852D2D5"}, {"title": "Poliziano, Angelo 1454–1494 Italian Scholar and Poet | Encyclopedia.com", "url": "https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/poliziano-angelo-1454-1494-italian-scholar-and-poet"}], "color": "#ec4899", "incoming": [22], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 19, "timeline": {"year": 1474, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 178, "name": "Pietro de' Medici", "aliases": ["Pietro de' Medici"], "bio": "The original label “Pietro de' Medici” is ambiguous. Several members of the Medici family had closely related names, and the inherited relationship to Argyropoulos is not enough to identify one securely. This edition preserves the label but does not attach an unrelated Medici biography to it.", "status": "Biographical entry", "sources": [{"title": "John Argyropoulos", "url": "https://en.wikipedia.org/wiki/John_Argyropoulos"}, {"title": "John Argyropoulos - Wikidata", "url": "https://www.wikidata.org/wiki/Q20003438"}, {"title": "John Argyropoulos - Wikidata", "url": "https://www.wikidata.org/wiki/Q26648"}], "color": "#ec4899", "incoming": [22], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 19, "timeline": {"year": 1469, "kind": "Inferred placement", "basis": "Layout estimate from the earlier connections plus 25 years, capped at 2026. The actual date is unknown.", "estimated": true}}, {"id": 179, "name": "Caspar Peucer", "aliases": ["Caspar Peucer"], "bio": "Caspar Peucer (1525–1602) was a physician, astronomer, and scholar at Wittenberg and Melanchthon's son-in-law. His publications and teaching connected medicine, astronomy, and religious learning. His career was also shaped by the confessional controversies of the later Reformation.", "status": "Biographical entry", "sources": [{"title": "Peucer, Caspar - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd118790676.html"}, {"title": "Peucer, Caspar - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz60344.html"}, {"title": "Caspar Peucer. Idyllion. Patria", "url": "https://www.academia.edu/2372057/Caspar_Peucer_Idyllion_Patria"}, {"title": "Caspar Peucer", "url": "https://en.wikipedia.org/wiki/Caspar_Peucer"}], "color": "#ec4899", "incoming": [24], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 21, "timeline": {"year": 1560, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 180, "name": "Erasmus Reinhold", "aliases": ["Erasmus Reinhold"], "bio": "Erasmus Reinhold (1511–1553) taught mathematics at Wittenberg and produced the Prutenic Tables. These tables used parameters from Copernican astronomy and became important computational tools. Their use does not imply that every user accepted the physical motion of the Earth.", "status": "Biographical entry", "sources": [{"title": "Erasmus Reinhold (1511 - 1553) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Reinhold/"}, {"title": "Erasmus Reinhold (1511 - 1553) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Reinhold/"}, {"title": "Erasmus Reinhold (1511 - 1553) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk//Biographies/Reinhold/"}, {"title": "BEA", "url": "https://mathshistory.st-andrews.ac.uk/BEA/reinhold_bea.pdf"}], "color": "#ec4899", "incoming": [24], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 21, "timeline": {"year": 1532, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 181, "name": "Jacob Milich", "aliases": ["Jacob Milich"], "bio": "Jakob Milich (1501–1559) was a physician and mathematical teacher at Wittenberg. His career combined medicine, mathematics, and the educational culture surrounding Melanchthon. The original spelling “Jacob Milich” is preserved for searching.", "status": "Biographical entry", "sources": [{"title": "encyclopedia.com", "url": "https://mathshistory.st-andrews.ac.uk/DSB/Stifel.pdf"}, {"title": "Milich, Jakob - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd117041777.html"}, {"title": "Jacob Milich", "url": "https://en.wikipedia.org/wiki/Jacob_Milich"}], "color": "#ec4899", "incoming": [24], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 21, "timeline": {"year": 1530, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 182, "name": "Victorin Strigel", "aliases": ["Victorin Strigel"], "bio": "Victorin Strigel (1524–1569) was a Protestant theologian who taught at several German universities. His career was shaped by confessional disputes and the interpretation of Melanchthon's theology. He belongs to the theological teaching branch of the chart.", "status": "Biographical entry", "sources": [{"title": "Strigel, Victorin - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz10893.html"}, {"title": "Strigel, Victorin - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/pnd124408494.html"}, {"title": "Strigel - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz81726.html"}, {"title": "Strigel - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd138563950.html"}], "color": "#ec4899", "incoming": [24], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 21, "timeline": {"year": 1546, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 183, "name": "David Chytraeus", "aliases": ["David Chytraeus"], "bio": "David Chytraeus (1530–1600) was a Lutheran theologian, historian, and educator associated with Rostock. He contributed to university development and church organization. His biography extends the Melanchthon branch into institutional and theological history.", "status": "Biographical entry", "sources": [{"title": "Chytraeus, David - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz19489.html?language=en"}, {"title": "Chytraeus, David - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/119009137.html?language=en"}, {"title": "\"Ad Gloriam Dei Humanism and Theology in David Chytraeus’ Regulae Stud\" by Timios Cook", "url": "https://scholar.csl.edu/phd/38/"}, {"title": "David Chytraeus", "url": "https://en.wikipedia.org/wiki/David_Chytraeus"}], "color": "#ec4899", "incoming": [24], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 21, "timeline": {"year": 1565, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 184, "name": "Bernhard Walther", "aliases": ["Bernhard Walther"], "bio": "Bernhard Walther (1430–1504) was a Nuremberg merchant and astronomical observer who collaborated with Regiomontanus. His support and observations contributed to the city's astronomical activity. He is an example of a scientific participant whose role cannot be captured by a university-doctorate label.", "status": "Biographical entry", "sources": [{"title": "Bernhard Walther", "url": "https://en.wikipedia.org/wiki/Bernhard_Walther"}, {"title": "Bernhard Walther", "url": "https://de.wikipedia.org/wiki/Bernhard_Walther"}, {"title": "Bernhard Walther", "url": "https://es.wikipedia.org/wiki/Bernhard_Walther"}], "color": "#ec4899", "incoming": [27], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 19, "timeline": {"year": 1465, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 185, "name": "Valentin Otho", "aliases": ["Valentin Otho"], "bio": "Valentin Otho (1545–1603) was a mathematician and astronomer who continued Rheticus's large trigonometric table project. The Opus palatinum de triangulis appeared in 1596. His work joined long-term numerical computation with the publication of practical mathematical reference material.", "status": "Biographical entry", "sources": [{"title": "Valentinus Otho", "url": "https://en.wikipedia.org/wiki/Valentinus_Otho"}, {"title": "Valentinus Otho", "url": "https://de.wikipedia.org/wiki/Valentinus_Otho"}, {"title": "Valentin Otho", "url": "https://fr.wikipedia.org/wiki/Valentin_Otho"}, {"title": "Valentinus Otho - Wikidata", "url": "https://www.wikidata.org/wiki/Q91647"}], "color": "#ec4899", "incoming": [30], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 22, "timeline": {"year": 1574, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 186, "name": "Bartholomäus Scultetus", "aliases": ["Bartholomäus Scultetus"], "bio": "Bartholomäus Scultetus (1540–1614) was an astronomer, cartographer, and civic official associated with Görlitz. His writings and observations connected local administration with mathematical and astronomical learning. His several Latinized and German names should be treated as variants of one identity.", "status": "Biographical entry", "sources": [{"title": "Scultetus, Bartholomäus - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz79824.html"}, {"title": "Scultetus, Bartholomäus - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz79824.html?language=en"}, {"title": "Scultetus, Bartholomäus - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd11745446X.html?language=en"}, {"title": "Scultetus, Bartholomäus - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd11745446X.html"}], "color": "#ec4899", "incoming": [30], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 22, "timeline": {"year": 1575, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 187, "name": "Johann Burckhardt Mencke", "aliases": ["Johann Burckhardt Mencke"], "bio": "Johann Burckhardt Mencke (1674–1732) was a Leipzig historian and scholar and the son of Otto Mencke. He continued the family's connection with learned publishing and Acta Eruditorum. Family, editorial, and educational relationships need to be distinguished in interpreting the chart.", "status": "Needs research", "sources": [{"title": "Mencke, Johann Burchard - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/sfz61517.html"}, {"title": "Mencke, Johann Burchard - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd118783181.html?language=en"}, {"title": "Mencke, Johann Burchard - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/118783181.html?language=en"}, {"title": "Mencke, Johann Burchard - Deutsche Biographie", "url": "https://www.deutsche-biographie.de/gnd118783181.html"}], "color": "#f97316", "incoming": [44], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 2, "timeline": {"year": 1703, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 188, "name": "Samuel Pufendorf", "aliases": ["Samuel Pufendorf"], "bio": "Samuel Pufendorf (1632–1694) was a jurist, philosopher, and historian known for writings on natural law. His education included study with Erhard Weigel at Jena. His later career shows how a mathematical-philosophical education could lead into jurisprudence and political thought.", "status": "Biographical entry", "sources": [{"title": "Samuel Freiherr von Pufendorf", "url": "https://plato.stanford.edu/entries/pufendorf/"}, {"title": "Pufendorf’s Moral and Political Philosophy", "url": "https://plato.stanford.edu/archives/sum2026/entries/pufendorf-moral/"}, {"title": "Pufendorf's Moral and Political Philosophy", "url": "https://plato.stanford.edu/archives/spr2014/entries/pufendorf-moral/"}, {"title": "Pufendorf’s Moral and Political Philosophy", "url": "https://plato.stanford.edu/archives/fall2020/entries/pufendorf-moral/"}], "color": "#ef4444", "incoming": [48], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 26, "timeline": {"year": 1663, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 189, "name": "Johann Christoph Sturm", "aliases": ["Johann Christoph Sturm"], "bio": "Johann Christoph Sturm (1635–1703) was a mathematician and natural philosopher who taught at Altdorf. His work included experimental philosophy, optics, and mathematical instruction. He promoted the use of demonstrations and instruments in teaching natural science.", "status": "Biographical entry", "sources": [{"title": "Johann Sturm", "url": "https://plato.stanford.edu/entries/johann-sturm/"}, {"title": "Johann Christoph Sturm", "url": "https://de.wikipedia.org/wiki/Johann_Christoph_Sturm"}, {"title": "Johann Christoph Sturm", "url": "https://it.wikipedia.org/wiki/Johann_Christoph_Sturm"}], "color": "#ef4444", "incoming": [48], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 26, "timeline": {"year": 1669, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 190, "name": "Christian von Wolff", "aliases": ["Christian von Wolff"], "bio": "Christian Wolff (1679–1754) was a German philosopher whose systematic approach to knowledge drew on mathematical ideals of exposition. He taught at Halle and Marburg and corresponded with Leibniz. That correspondence should not be mislabeled as a modern doctoral relationship.", "status": "Biographical entry", "sources": [{"title": "Christian Wolff (philosopher)", "url": "https://en.wikipedia.org/wiki/Christian_Wolff_%28philosopher%29"}, {"title": "Christian Wolff", "url": "https://es.wikipedia.org/wiki/Christian_Wolff"}, {"title": "Christian Wolff (philosophe)", "url": "https://fr.wikipedia.org/wiki/Christian_Wolff_%28philosophe%29"}, {"title": "Wolff Christian von - Detailseite - LEO-BW", "url": "https://www.leo-bw.de/web/guest/detail/-/Detail/details/DOKUMENT/ubt_portraits/111076/Wolff%20Christian%20von"}], "color": "#3b82f6", "incoming": [50], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 27, "timeline": {"year": 1714, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 191, "name": "Ehrenfried Walther von Tschirnhaus", "aliases": ["Ehrenfried Walther von Tschirnhaus", "Ehrenfried von Tschirnhaus"], "bio": "Ehrenfried Walther von Tschirnhaus (1651–1708) worked in algebra, optics, and experimental science. His name is attached to transformations of polynomial equations, and his experiments were connected with the development of European porcelain. The shorter “Ehrenfried von Tschirnhaus” label in the original is an alias of this person.", "status": "Biographical entry", "sources": [{"title": "Ehrenfried Walter von Tschirnhaus (1651 - 1708) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Tschirnhaus/"}, {"title": "Ehrenfried Walter von Tschirnhaus (1651 - 1708) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies//Tschirnhaus/"}, {"title": "EHRENFRIED WALTER GRAF VON TSCHIRNHAUS  (April 10, 1651 – October 11, 1708)", "url": "https://mathshistory.st-andrews.ac.uk/Strick/tschirnhaus.pdf"}, {"title": "Ehrenfried Walther von Tschirnhaus", "url": "https://de.wikipedia.org/wiki/Ehrenfried_Walther_von_Tschirnhaus"}], "color": "#3b82f6", "incoming": [50, 106], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 27, "timeline": {"year": 1679, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 192, "name": "Nicolaus I Bernoulli", "aliases": ["Nicolaus I Bernoulli"], "bio": "Nicolaus I Bernoulli (1687–1759) studied law and mathematics and worked on probability and related analytical questions. He belonged to the Basel Bernoulli family but is distinct from Nicolaus II. Numbered names are essential here to prevent the careers of different family members from being merged.", "status": "Biographical entry", "sources": [{"title": "Nicolaus (I) Bernoulli (1687 - 1759) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Bernoulli_Nicolaus%28I%29/"}, {"title": "Jacob Bernoulli (1655 - 1705) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac. Nicolaus II Bernoulli (1695–1726), a son of Johann Bernoulli, worked in mathematics and taught in St Petersburg near the end of his short life. He is distinct from his cousin Nicolaus I. His career forms part of the Bernoulli family's contribution to the early St Petersburg Academy.", "status": "Biographical entry", "sources": [{"title": "Nicolaus (II) Bernoulli (1695 - 1726) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Bernoulli_Nicolaus%28II%29/"}, {"title": "Poster of Nicolaus (II) Bernoulli", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Bernoulli_Nicolaus%28II%29/poster/born/"}, {"title": "Johann Bernoulli (1667 - 1748) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Bernoulli_Johann/"}, {"title": "sci_hi", "url": "https://mathshistory.st-andrews.ac.uk/SH/bernoulli_daniel_sh.pdf"}], "color": "#3b82f6", "incoming": [67], "outgoing": [], "originalYear": null, "sourceType": "Side branch", "rank": 30, "timeline": {"year": 1710, "kind": "Estimated active period", "basis": "Approximate active period: birth plus 35 years, or lifespan midpoint for a shorter life. Not a degree date.", "estimated": true}}, {"id": 195, "name": "Daniel Bernoulli", "aliases": ["Daniel Bernoulli"], "bio": "Daniel Bernoulli (1700–1782) worked in mathematics, medicine, mechanics, and probability. His Hydrodynamica treated fluid motion and related physical questions. He held positions in St Petersburg and Basel; his scientific relationship with his father Johann included both cooperation and rivalry.", "status": "Biographical entry", "sources": [{"title": "Daniel Bernoulli (1700 - 1782) - Biography - MacTutor History of Mathematics", "url": "https://mathshistory.st-andrews.ac.uk/Biographies/Bernoulli_Daniel/"}, {"title": "Daniel Bernoulli English version", "url": "https://mathshistory.st-andrews.ac.uk/Strick/bernoulli_daniel.pdf"}, {"title": "Daniel Bernoulli (1700
